<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='900' viewBox='0 0 1600 900'>
  <defs>
    <linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#0f172a'/>
      <stop offset='100%' stop-color='#1e3a8a'/>
    </linearGradient>
  </defs>
  <rect width='1600' height='900' fill='url(#bg)'/>
  <text x='100' y='140' fill='#f8fafc' font-family='Arial, sans-serif' font-size='64' font-weight='700'>Past Tense: haben → hatte</text>
  <g fill='#e2e8f0' font-family='Arial, sans-serif' font-size='44'>
    <text x='120' y='250'>ich hatte</text>
    <text x='120' y='320'>du hattest</text>
    <text x='120' y='390'>er/sie/es hatte</text>
    <text x='120' y='460'>wir hatten</text>
    <text x='120' y='530'>ihr hattet</text>
    <text x='120' y='600'>sie/Sie hatten</text>
  </g>
  <text x='100' y='735' fill='#bfdbfe' font-family='Arial, sans-serif' font-size='38'>Ich hatte ein Buch.</text>
</svg>
