<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='900' viewBox='0 0 1600 900'>
  <defs>
    <linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#0f172a'/>
      <stop offset='100%' stop-color='#334155'/>
    </linearGradient>
  </defs>
  <rect width='1600' height='900' fill='url(#bg)'/>
  <text x='80' y='110' fill='#f8fafc' font-family='Arial, sans-serif' font-size='56' font-weight='700'>German Directions + Ost vs Osten</text>

  <g fill='#e2e8f0' font-family='Arial, sans-serif' font-size='38'>
    <text x='80' y='210'>Norden = north</text>
    <text x='80' y='270'>Süden = south</text>
    <text x='80' y='330'>Westen = west</text>
    <text x='80' y='390'>Osten = east (location: im Osten)</text>
  </g>

  <g fill='#bfdbfe' font-family='Arial, sans-serif' font-size='34'>
    <text x='80' y='500'>Ost = east (short noun/adjective stem, often in compounds)</text>
    <text x='80' y='550'>Osten = the east region/direction after "im", "von", etc.</text>
    <text x='80' y='610'>Example: Berlin liegt im Osten von Deutschland.</text>
  </g>

  <g transform='translate(1170 430)'>
    <circle cx='0' cy='0' r='180' fill='none' stroke='#94a3b8' stroke-width='8'/>
    <line x1='0' y1='-160' x2='0' y2='160' stroke='#e2e8f0' stroke-width='8'/>
    <line x1='-160' y1='0' x2='160' y2='0' stroke='#e2e8f0' stroke-width='8'/>
    <polygon points='0,-200 -20,-140 20,-140' fill='#22d3ee'/>
    <text x='-15' y='-215' fill='#22d3ee' font-family='Arial, sans-serif' font-size='40'>N</text>
    <text x='-16' y='232' fill='#fca5a5' font-family='Arial, sans-serif' font-size='40'>S</text>
    <text x='190' y='14' fill='#93c5fd' font-family='Arial, sans-serif' font-size='40'>O</text>
    <text x='-235' y='14' fill='#c4b5fd' font-family='Arial, sans-serif' font-size='40'>W</text>
  </g>
</svg>
