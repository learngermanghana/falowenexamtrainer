<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='900' viewBox='0 0 1600 900'>
  <defs>
    <linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#111827'/>
      <stop offset='100%' stop-color='#0f766e'/>
    </linearGradient>
  </defs>
  <rect width='1600' height='900' fill='url(#bg)'/>
  <text x='100' y='140' fill='#f8fafc' font-family='Arial, sans-serif' font-size='64' font-weight='700'>Past Tense: sein → war</text>
  <g fill='#e2e8f0' font-family='Arial, sans-serif' font-size='44'>
    <text x='120' y='250'>ich war</text>
    <text x='120' y='320'>du warst</text>
    <text x='120' y='390'>er/sie/es war</text>
    <text x='120' y='460'>wir waren</text>
    <text x='120' y='530'>ihr wart</text>
    <text x='120' y='600'>sie/Sie waren</text>
  </g>
  <text x='100' y='735' fill='#99f6e4' font-family='Arial, sans-serif' font-size='38'>Ich war in Berlin.</text>
</svg>
