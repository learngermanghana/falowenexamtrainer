    />
    <script>
      (function () {
        var host = window.location.hostname.toLowerCase();
        var path = window.location.pathname;
        if ((host === "classes.falowen.app" || host === "www.classes.falowen.app") && (path === "/" || path === "")) {
          window.location.replace("/classes/");
        }
      })();
    </script>
    <script>
      (function () {
        function shouldOpenSignup() {
          try {
            return sessionStorage.getItem("falowen:auto-open-signup") === "1";
          } catch (error) {
            return false;
          }
        }

        function clearSignupFlag() {
          try {
            sessionStorage.removeItem("falowen:auto-open-signup");
          } catch (error) {}
        }

        function tryOpenSignup() {
          if (!shouldOpenSignup()) return true;

          var signupButton = document.querySelector("button.falowen-home-primary");
          if (!signupButton) {
            var buttons = Array.prototype.slice.call(document.querySelectorAll("button"));
            signupButton = buttons.find(function (button) {
              var text = (button.textContent || "").toLowerCase();
              return text.includes("join") || text.includes("sign up") || text.includes("get started");
            });
          }

          if (signupButton) {
            clearSignupFlag();
            signupButton.click();
            return true;
          }

          return false;
        }

        window.addEventListener("load", function () {
          if (tryOpenSignup()) return;

          var observer = new MutationObserver(function () {
            if (tryOpenSignup()) observer.disconnect();
          });

          observer.observe(document.body, { childList: true, subtree: true });
          setTimeout(function () { observer.disconnect(); }, 8000);
        });
      })();
    </script>
