<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign up | Falowen</title>
    <script>
      try {
        var params = new URLSearchParams(window.location.search);
        var className = params.get("className") || "";
        sessionStorage.setItem("falowen:auto-open-signup", "1");
        localStorage.setItem("falowen:signup-program", "german");
        if (className) {
          localStorage.setItem("exam-coach-class", className);
        }
      } catch (error) {}
      window.location.replace("/");
    </script>
  </head>
  <body>
    <p>Opening Falowen sign up...</p>
  </body>
</html>
