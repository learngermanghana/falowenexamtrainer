    <style>
      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: #eff6ff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .falowen-startup {
        min-height: 100vh;
        min-height: 100dvh;
        box-sizing: border-box;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 22px max(24px, env(safe-area-inset-bottom));
        color: #0f172a;
        background: linear-gradient(160deg, #eff6ff 0%, #ffffff 55%, #dbeafe 100%);
      }

      .falowen-startup__card {
        width: min(100%, 440px);
        display: grid;
        justify-items: center;
        gap: 14px;
        text-align: center;
        padding: 30px 24px;
        border: 1px solid #bfdbfe;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 22px 60px rgba(30, 64, 175, 0.14);
      }

      .falowen-startup__logo {
        width: 88px;
        height: 88px;
        object-fit: contain;
        border-radius: 22px;
      }

      .falowen-startup__spinner {
        width: 34px;
        height: 34px;
        border: 4px solid #bfdbfe;
        border-top-color: #1d4ed8;
        border-radius: 50%;
        animation: falowen-spin 0.9s linear infinite;
      }

      .falowen-startup h1,
      .falowen-startup p {
        margin: 0;
      }

      .falowen-startup h1 {
        font-size: 24px;
      }

      .falowen-startup p {
        color: #475569;
        line-height: 1.6;
      }

      .falowen-startup__retry {
        display: none;
        border: 0;
        border-radius: 12px;
        padding: 12px 18px;
        background: #1d4ed8;
        color: #ffffff;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }

      .falowen-startup__retry[data-visible="true"] {
        display: inline-flex;
      }

      @keyframes falowen-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .falowen-startup__spinner {
          animation-duration: 1.8s;
        }
      }
    </style>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <main id="falowen-startup" class="falowen-startup" role="status" aria-live="polite">
        <section class="falowen-startup__card">
          <img class="falowen-startup__logo" src="/logo192.png" alt="Falowen" />
          <div id="falowen-startup-spinner" class="falowen-startup__spinner" aria-hidden="true"></div>
          <h1 id="falowen-startup-title">Opening Falowen…</h1>
          <p id="falowen-startup-message">Loading your learning space. This may take a moment on a slow connection.</p>
          <button id="falowen-startup-retry" class="falowen-startup__retry" type="button">Retry</button>
        </section>
      </main>
    </div>
    <script>
      (function () {
        var startup = document.getElementById("falowen-startup");
        var title = document.getElementById("falowen-startup-title");
        var message = document.getElementById("falowen-startup-message");
        var spinner = document.getElementById("falowen-startup-spinner");
        var retry = document.getElementById("falowen-startup-retry");
        var appMounted = false;

        function showRecovery(nextTitle, nextMessage) {
          if (!document.getElementById("falowen-startup")) return;
          title.textContent = nextTitle;
          message.textContent = nextMessage;
          spinner.style.display = "none";
          retry.dataset.visible = "true";
        }

        function showLoading(nextMessage) {
          if (!document.getElementById("falowen-startup")) return;
          title.textContent = "Opening Falowen…";
          message.textContent = nextMessage;
          spinner.style.display = "block";
          retry.dataset.visible = "false";
        }

        function checkConnection() {
          if (!navigator.onLine) {
            showRecovery("You are offline", "Connect to the internet, then tap Retry to open Falowen.");
          }
        }

        retry.addEventListener("click", function () {
          showLoading("Trying again…");
          window.location.reload();
        });

        window.addEventListener("falowen:app-mounted", function () {
          appMounted = true;
        });

        window.addEventListener("offline", checkConnection);
        window.addEventListener("online", function () {
          if (!appMounted) {
            showRecovery("Connection restored", "Tap Retry to continue opening Falowen.");
          }
        });

        window.addEventListener("error", function () {
          if (!appMounted) {
            showRecovery("Falowen could not open", "Something interrupted startup. Tap Retry to try again.");
          }
        });

        window.addEventListener("unhandledrejection", function () {
          if (!appMounted) {
            showRecovery("Falowen could not open", "Something interrupted startup. Tap Retry to try again.");
          }
        });

        window.setTimeout(function () {
          if (!appMounted && document.getElementById("falowen-startup")) {
            showRecovery("Still loading", "The connection may be slow. Tap Retry to reload Falowen.");
          }
        }, 12000);

        checkConnection();
      })();
    </script>
    <script type="module" src="/src/index.js"></script>
