name: Trigger B1 PDF after Lesen fix 3368

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/trigger-b1-pdf-reading-fix-3368.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch-b1-render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch B1 course material PDF
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const response = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "course-material-bundle.yml",
              ref: "main",
              inputs: { level: "B1", build_pdf: "true", press_preview: "false" }
            });
            core.info("Dispatched B1 level PDF (HTTP " + response.status + ")");
