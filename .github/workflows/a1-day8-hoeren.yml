name: A1 Day 8 Hören

on:
  pull_request:
    paths:
      - "web/src/components/A1Day8CountriesAndLanguagesWorkbookPage.js"
      - "web/src/components/A1Day8CountriesAndLanguagesWorkbookPage.test.js"
      - ".github/workflows/a1-day8-hoeren.yml"
  push:
    branches: [main]
    paths:
      - "web/src/components/A1Day8CountriesAndLanguagesWorkbookPage.js"
      - "web/src/components/A1Day8CountriesAndLanguagesWorkbookPage.test.js"
      - ".github/workflows/a1-day8-hoeren.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Test A1 Day 8 Hören embed and Frage 5
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/A1Day8CountriesAndLanguagesWorkbookPage.test.js
      - name: Build Falowen web app
        run: npm run build
