name: Apply direct writing coach update

on:
  push:
    branches:
      - fix/ci-and-direct-writing-coach
    paths:
      - scripts/applyCiAndDirectCoachUpdate.js
      - .github/workflows/apply-ci-direct-coach.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/ci-and-direct-writing-coach
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply asserted source updates
        run: node scripts/applyCiAndDirectCoachUpdate.js

      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Integrate coach directly and repair curriculum outputs"
          git push origin HEAD:fix/ci-and-direct-writing-coach
