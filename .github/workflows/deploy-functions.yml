name: Deploy Falowen Exam Trainer API

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'scripts/patchSpeakingAudioReliability.mjs'
      - 'scripts/runSpeakingAudioReliabilityPatch.mjs'
      - 'firebase.json'
      - '.firebaserc'
      - 'firestore.rules'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

concurrency:
  group: falowenexamtrainer-firebase-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIREBASE_PROJECT_ID: falowen-examiner-trainer
      GOOGLE_CLOUD_PROJECT: falowen-examiner-trainer
      GCLOUD_PROJECT: falowen-examiner-trainer
      PAYSTACK_POLICY_URL: https://api-awc2au65xa-ew.a.run.app/paystack/webhook

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Apply speaking audio reliability patch
        run: |
          node --check scripts/patchSpeakingAudioReliability.mjs
          node --check scripts/runSpeakingAudioReliabilityPatch.mjs
          node scripts/runSpeakingAudioReliabilityPatch.mjs
          node --check functions/functionz/speakingAudioReliability.js
          node --check functions/functionz/app.js
          grep -F 'gpt-4o-mini-transcribe' functions/functionz/speakingAudioReliability.js
          grep -F 'TRANSCRIPTION_FAILED' functions/functionz/app.js

      - name: Install functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Validate functions source and discovery
        working-directory: functions
        run: |
          node --check index.entry.js
          node --check functionz/paymentAwareApp.js
          node --check functionz/paystackFeePolicy.js
          node -e 'const exported = require("./index.entry.js"); if (!exported.api) throw new Error("Firebase api export was not discovered");'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_FALOWEN }}'

      - name: Deploy Firestore security rules
        shell: bash
        run: |
          set +e
          firebase deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --only firestore:rules \
            --debug > firebase-rules-deploy.log 2>&1
          status=$?
          tail -n 180 firebase-rules-deploy.log || true
          exit "$status"

      - name: Deploy existing exam trainer API
        shell: bash
        run: |
          set +e
          firebase deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --only functions:falowenexamtrainer:api \
            --debug > firebase-deploy.log 2>&1
          status=$?
          tail -n 180 firebase-deploy.log || true
          exit "$status"

      - name: Verify Paystack fee policy
        run: |
          response=''
          for attempt in $(seq 1 18); do
            response=$(curl --fail --silent --show-error "$PAYSTACK_POLICY_URL" || true)
            if echo "$response" | grep -q 'shared_50_50'; then
              echo "Verified shared_50_50 Paystack policy"
              exit 0
            fi
            sleep 10
          done
          echo "Expected shared_50_50 response was not received. Last response: $response"
          exit 1

      - name: Upload Firebase deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-api-deploy-diagnostics-${{ github.run_id }}
          path: |
            firebase-rules-deploy.log
            firebase-deploy.log
            firebase-debug.log
          if-no-files-found: warn
          retention-days: 7
