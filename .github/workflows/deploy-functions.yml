name: Deploy Falowen Exam Trainer Functions

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

concurrency:
  group: falowenexamtrainer-firebase-functions
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      FIREBASE_PROJECT_ID: falowen-examiner-trainer
      GOOGLE_CLOUD_PROJECT: falowen-examiner-trainer
      GCLOUD_PROJECT: falowen-examiner-trainer

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Validate functions source and discovery
        working-directory: functions
        run: |
          node --check index.entry.js
          node --check functionz/paymentAwareApp.js
          node --check functionz/paystackFeePolicy.js
          node -e 'const exported = require("./index.entry.js"); console.log("Discovered exports:", Object.keys(exported).sort().join(", "));'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_FALOWEN }}'

      - name: Deploy exam trainer functions
        shell: bash
        run: |
          set +e
          firebase deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --only functions:falowenexamtrainer \
            --force \
            --debug > firebase-deploy.log 2>&1
          status=$?
          echo "Firebase deploy exit code: $status"
          echo "=== Firebase deployment summary ==="
          tail -n 180 firebase-deploy.log || true
          exit "$status"

      - name: Upload Firebase deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-deploy-diagnostics-${{ github.run_id }}
          path: |
            firebase-deploy.log
            firebase-debug.log
          if-no-files-found: warn
          retention-days: 7
