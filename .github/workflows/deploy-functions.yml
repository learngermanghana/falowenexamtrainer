name: Deploy Firebase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-functions.yml'

concurrency:
  group: falowenexamtrainer-firebase-functions
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_FALOWEN }}'

      - name: Export Google Cloud project env
        run: |
          echo "GOOGLE_CLOUD_PROJECT=falowen-examiner-trainer" >> $GITHUB_ENV
          echo "GCLOUD_PROJECT=falowen-examiner-trainer" >> $GITHUB_ENV

      - name: Deploy Firebase Functions
        run: firebase deploy --only functions --project falowen-examiner-trainer --force --debug
