name: Deploy Falowen Exam Trainer API

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: falowenexamtrainer-firebase-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      FIREBASE_PROJECT_ID: falowen-examiner-trainer
      GOOGLE_CLOUD_PROJECT: falowen-examiner-trainer
      GCLOUD_PROJECT: falowen-examiner-trainer

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Validate functions source and discovery
        working-directory: functions
        run: |
          node --check index.entry.js
          node --check functionz/paymentAwareApp.js
          node --check functionz/paystackFeePolicy.js
          node -e 'const exported = require("./index.entry.js"); if (!exported.api) throw new Error("Firebase api export was not discovered"); console.log("Firebase api export discovered successfully");'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_FALOWEN }}'

      - name: Deploy existing exam trainer API
        id: firebase_deploy
        continue-on-error: true
        shell: bash
        run: |
          set +e
          firebase deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --only functions:falowenexamtrainer:api \
            --debug > firebase-deploy.log 2>&1
          status=$?
          echo "Firebase deploy exit code: $status"
          echo "=== Firebase deployment summary ==="
          tail -n 180 firebase-deploy.log || true
          exit "$status"

      - name: Upload Firebase deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-api-deploy-diagnostics-${{ github.run_id }}
          path: |
            firebase-deploy.log
            firebase-debug.log
          if-no-files-found: warn
          retention-days: 7

      - name: Record Firebase API deployment result
        if: always()
        env:
          DEPLOY_OUTCOME: '${{ steps.firebase_deploy.outcome }}'
          DEPLOY_COMMIT: '${{ github.sha }}'
          DEPLOY_RUN_ID: '${{ github.run_id }}'
          DEPLOY_RUN_NUMBER: '${{ github.run_number }}'
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "checkedAt": datetime.now(timezone.utc).isoformat(),
              "success": os.environ.get("DEPLOY_OUTCOME") == "success",
              "outcome": os.environ.get("DEPLOY_OUTCOME", "unknown"),
              "commit": os.environ.get("DEPLOY_COMMIT", ""),
              "runId": os.environ.get("DEPLOY_RUN_ID", ""),
              "runNumber": os.environ.get("DEPLOY_RUN_NUMBER", ""),
              "function": "falowenexamtrainer:api",
              "project": os.environ.get("FIREBASE_PROJECT_ID", ""),
              "webhook": "https://api-awc2au65xa-ew.a.run.app/paystack/webhook",
          }
          path = Path("diagnostics/firebase-api-deploy.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

          git config user.name "Falowen Deployment Bot"
          git config user.email "moxflex@gmail.com"
          git add diagnostics/firebase-api-deploy.json
          git commit -m "Record Firebase API deploy result [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fail workflow when Firebase deployment failed
        if: steps.firebase_deploy.outcome != 'success'
        run: exit 1
