name: A2 Course Book audit

on:
  pull_request:
    paths:
      - "shared/curriculumCanonical.json"
      - "scripts/applyA1RouteAlignment.js"
      - "scripts/patchA2LateWorkbookNativeOwnership.mjs"
      - "web/src/__tests__/A2CourseTabSections.test.js"
      - "web/src/components/CourseTab.js"
      - "web/src/data/a2CurriculumAlignment.js"
      - "web/src/data/a2Day*CourseBookAudit.test.js"
      - "web/src/data/a2Days*CourseBookAudit.test.js"
      - "web/src/data/a2GrammarRoutes.js"
      - "web/src/data/additionalA2RadioEntries.js"
      - "web/src/data/curriculumManifest.js"
      - "web/src/data/courseSchedule.js"
      - "web/src/data/inAppWorkbookRoutes.json"
      - "web/src/data/inAppWorkbookRoutes.js"
      - "web/src/components/A2Day*Workbook*.js"
      - "web/src/components/A2StandardTabbedWorkbookPage.js"
      - "web/src/components/A2StarterConjunctionsPage.js"
      - "web/src/components/A2Day1RadioRegression.test.js"
      - "web/src/components/A2SharedWorkbookRegression.test.js"
      - ".github/workflows/a2-course-book-audit.yml"

jobs:
  a2-course-book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Regenerate curriculum manifest
        run: npm run sync:curriculum
      - name: Apply focused A2 Course Book ownership and section patch
        run: node scripts/patchA2LateWorkbookNativeOwnership.mjs
      - name: Test A2 Course Book audit regressions
        working-directory: web
        env:
          CI: true
        run: >-
          npx jest --runInBand --runTestsByPath
          src/__tests__/A2CourseTabSections.test.js
          src/data/a2Day1CourseBookAudit.test.js
          src/data/a2Days1To12CourseBookAudit.test.js
          src/data/a2Days13To18CourseBookAudit.test.js
          src/data/a2Days19To24CourseBookAudit.test.js
          src/data/a2Days25To28CourseBookAudit.test.js
          src/components/A2Day1RadioRegression.test.js
          src/components/A2SharedWorkbookRegression.test.js
      - name: Build web app
        working-directory: web
        run: npx vite build
