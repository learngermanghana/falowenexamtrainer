name: Hide discussion navigation once

on:
  push:
    branches:
      - codex/hide-discussion-nav-preserve-route

permissions:
  contents: write

jobs:
  update-navigation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update campus navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("web/src/App.js")
          text = path.read_text(encoding="utf-8")

          discussion_tab = '    { key: "discussion", label: t("appNav.tabs.discussion"), section: "discussion" },\n'
          if discussion_tab not in text:
              raise SystemExit("Discussion tab entry was not found")
          text = text.replace(discussion_tab, "", 1)

          old_preferred = (
              'const getPreferredSection = (allowedSections, preferred, tabStructure) => {\n'
              '  if (preferred && allowedSections[preferred]) return preferred;\n'
              '\n'
              '  return findFirstAllowedSection(allowedSections, tabStructure);\n'
              '};'
          )
          new_preferred = (
              'const getPreferredSection = (allowedSections, preferred, tabStructure, { allowHidden = false } = {}) => {\n'
              '  const isVisibleSection = Boolean(preferred && getMainTabForSection(preferred, tabStructure));\n'
              '  if (preferred && allowedSections[preferred] && (allowHidden || isVisibleSection)) return preferred;\n'
              '\n'
              '  return findFirstAllowedSection(allowedSections, tabStructure);\n'
              '};'
          )
          if old_preferred not in text:
              raise SystemExit("Preferred-section helper was not found")
          text = text.replace(old_preferred, new_preferred, 1)

          old_resolved = (
              '  const resolvedSection = useMemo(() => getPreferredSection(allowedSections, section || defaultSection, tabStructure), [\n'
              '    allowedSections,\n'
              '    defaultSection,\n'
              '    section,\n'
              '    tabStructure,\n'
              '  ]);'
          )
          new_resolved = (
              '  const resolvedSection = useMemo(\n'
              '    () =>\n'
              '      getPreferredSection(allowedSections, section || defaultSection, tabStructure, {\n'
              '        allowHidden: Boolean(section),\n'
              '      }),\n'
              '    [allowedSections, defaultSection, section, tabStructure]\n'
              '  );'
          )
          if old_resolved not in text:
              raise SystemExit("Campus section resolver was not found")
          text = text.replace(old_resolved, new_resolved, 1)

          old_storage = (
              '  useEffect(() => {\n'
              '    if (!tabStorageKey) return;\n'
              '    localStorage.setItem(tabStorageKey, resolvedSection);\n'
              '  }, [resolvedSection, tabStorageKey]);'
          )
          new_storage = (
              '  useEffect(() => {\n'
              '    if (!tabStorageKey || !getMainTabForSection(resolvedSection, tabStructure)) return;\n'
              '    localStorage.setItem(tabStorageKey, resolvedSection);\n'
              '  }, [resolvedSection, tabStorageKey, tabStructure]);'
          )
          if old_storage not in text:
              raise SystemExit("Campus tab persistence effect was not found")
          text = text.replace(old_storage, new_storage, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Commit navigation update
        shell: bash
        run: |
          rm .github/workflows/hide-discussion-nav-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/App.js .github/workflows/hide-discussion-nav-once.yml
          git commit -m "Hide discussion from campus navigation"
          git push origin HEAD:codex/hide-discussion-nav-preserve-route
