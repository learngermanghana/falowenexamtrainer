name: Patch A1 hub assertion

on:
  push:
    branches:
      - fix/a1-day2-hub-and-media

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/a1-day2-hub-and-media
          fetch-depth: 0
      - name: Point hub query assertion at the extracted resolver
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('web/src/data/inAppWorkbookRoutes.a1LessonLinks.test.js')
          text = path.read_text()
          old = '''    const hubRouteSource = fs.readFileSync(
              path.resolve(__dirname, "../components/A1ChapterResourceHubRoute.jsx"),
              "utf8",
            );

            expect(indexSource).toContain("A1ChapterResourceHubRoute");'''
          new = '''    const hubRouteSource = fs.readFileSync(
              path.resolve(__dirname, "../components/A1ChapterResourceHubRoute.jsx"),
              "utf8",
            );
            const hubStateSource = fs.readFileSync(
              path.resolve(__dirname, "../utils/a1ChapterResourceHubState.js"),
              "utf8",
            );

            expect(indexSource).toContain("A1ChapterResourceHubRoute");'''
          if old not in text:
              raise SystemExit('Expected source block was not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '    expect(hubRouteSource).toContain(\'query.get("hub") === "1"\');',
              '    expect(hubStateSource).toContain(\'query.get("hub") === "1"\');',
              1,
          )
          path.write_text(text)
          PY
          git config user.name "falowen-ci"
          git config user.email "actions@users.noreply.github.com"
          git add web/src/data/inAppWorkbookRoutes.a1LessonLinks.test.js
          git commit -m "Align A1 hub assertion with extracted resolver"
          git push origin HEAD:fix/a1-day2-hub-and-media
