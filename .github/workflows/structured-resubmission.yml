name: Structured one-box resubmissions

on:
  pull_request:
    paths:
      - "web/src/utils/structuredSubmissionTemplate.js"
      - "web/src/utils/structuredSubmissionTemplate.test.js"
      - "web/src/components/StructuredResubmissionLifecycle.test.js"
      - "scripts/patchWorkbookSubmissionAutoSelection.mjs"
      - "scripts/patchStructuredResubmission.mjs"
      - "functions/resubmission.js"
      - "functions/scripts/testStructuredResubmission.js"
      - ".github/workflows/structured-resubmission.yml"
  push:
    branches:
      - main
    paths:
      - "web/src/utils/structuredSubmissionTemplate.js"
      - "scripts/patchWorkbookSubmissionAutoSelection.mjs"
      - "scripts/patchStructuredResubmission.mjs"
      - "functions/resubmission.js"
      - ".github/workflows/structured-resubmission.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            functions/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Install function dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Apply submission and resubmission lifecycle twice
        run: |
          node scripts/patchWorkbookSubmissionAutoSelection.mjs
          node scripts/patchWorkbookSubmissionAutoSelection.mjs
      - name: Test structured submission and resubmission helpers
        working-directory: web
        env:
          CI: true
        run: npx jest --runInBand src/utils/structuredSubmissionTemplate.test.js src/components/StructuredSubmissionLifecycle.test.js src/components/StructuredResubmissionLifecycle.test.js
      - name: Check resubmission callable syntax
        run: node --check functions/resubmission.js
      - name: Test resubmission callable structured payload
        run: node functions/scripts/testStructuredResubmission.js
      - name: Build production web app
        working-directory: web
        run: npm run build
