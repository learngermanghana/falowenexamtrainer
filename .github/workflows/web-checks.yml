name: Web checks

on:
  pull_request:
    paths:
      - "web/**"
      - "shared/**"
      - "scripts/**"
      - "functions/data/curriculumManifest.js"
      - "functions/data/lessonCatalog.js"
      - "package.json"
      - ".github/workflows/web-checks.yml"

permissions:
  contents: read

jobs:
  a1-curriculum:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Audit A1 curriculum
        run: npm run audit:a1-curriculum

      - name: Install web dependencies
        working-directory: web
        run: npm install --legacy-peer-deps --no-audit --no-fund --loglevel=error

      - name: Test A1 curriculum source, card expansion and route integrity
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/data/a1CourseBookCards.test.js src/data/a1RouteAlignment.test.js src/utils/courseBookEntries.test.js

  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm install --legacy-peer-deps --no-audit --no-fund --loglevel=error

      - name: Test A1 workbook visibility, submit mounting, exam cards and mobile layout
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/A1WorkbookSectionTabs.test.js src/components/WorkbookInlineEnhancements.test.jsx src/components/A1Day13RevisionNumberCleanup.test.jsx src/components/VerbotenErlaubtPage.test.jsx src/a1WorkbookMobileSubmit.test.js

      - name: Test Preposition Case Coach
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/lib/prepositionCaseCoach.test.js src/hooks/usePrepositionCaseHints.test.js src/components/PrepositionCaseHints.test.jsx src/components/PrepositionCaseCoachField.test.jsx

      - name: Test attendance reporting
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/services/attendanceService.test.js

      - name: Test authoritative live class session selection
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/services/canonicalLiveClassOfficialRepair.test.js src/services/canonicalLiveClassServiceV4.test.js

      - name: Test live class card redesign
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/LiveClassCardRedesign.test.js

      - name: Test indicator null-profile handling
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/CourseBookNextClassIndicator.test.js -t "handles a null student profile"

      - name: Test indicator day countdown
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/CourseBookNextClassIndicator.test.js -t "shows days and hours"

      - name: Test indicator hour countdown
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/CourseBookNextClassIndicator.test.js -t "shows hours and minutes"

      - name: Test indicator Ghana wall clock
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/CourseBookNextClassIndicator.test.js -t "uses Ghana wall-clock fields"

      - name: Test indicator live states
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/CourseBookNextClassIndicator.test.js -t "shows the live state|does not keep showing live"

      - name: Test indicator session filtering
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/CourseBookNextClassIndicator.test.js -t "ignores cancelled, completed and stale live sessions"

      - name: Test indicator Course Book placement
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/CourseBookNextClassIndicator.test.js -t "finds the Course Book statistics grid"

      - name: Test speaking tools
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/SpeakingMindMap.test.js src/components/SpeakingPracticeTimerCard.test.js

      - name: Test inline course submissions
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/CourseLessonInlineSubmission.test.js

      - name: Test Question of the Day writing templates
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/QuestionOfDayWritingTemplateInjector.test.js

      - name: Test workbook route matching
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/AutoWorkbookStartGuide.test.js

      - name: Test workbook tabs and lock identities
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/utils/courseWorkbookSubmission.test.js

      - name: Test protected A2 route and duplicate Submit cleanup
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/utils/a2ProtectedWorkbookRoutes.test.js

      - name: Audit restored A2 workbook content
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/A2SharedWorkbookRegression.test.js

      - name: Test A2 and B1 workbook navigation
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/A2B1CourseBook.test.js src/components/A2B1LegacyGrammarTabRegression.test.js src/components/A2Day16CustomWorkbook.test.js src/components/B2CourseBookContentAlignment.test.js

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Audit A1 curriculum
        run: npm run audit:a1-curriculum

      - name: Install web dependencies
        working-directory: web
        run: npm install --legacy-peer-deps --no-audit --no-fund --loglevel=error

      - name: Build web app
        working-directory: web
        run: npm run build

  curriculum-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check curriculum manifest sync
        run: node scripts/checkCurriculumManifestSync.js
