name: Web checks

on:
  pull_request:
    paths:
      - "web/**"
      - "shared/**"
      - "scripts/**"
      - "functions/data/curriculumManifest.js"
      - "package.json"
      - ".github/workflows/web-checks.yml"

jobs:
  a1-curriculum:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Audit A1 curriculum
        run: npm run audit:a1-curriculum

      - name: Install web dependencies
        working-directory: web
        run: npm install --legacy-peer-deps --no-audit --no-fund --loglevel=error

      - name: Test A1 curriculum source and card expansion
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/data/a1CourseBookCards.test.js src/utils/courseBookEntries.test.js

  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm install --legacy-peer-deps --no-audit --no-fund --loglevel=error

      - name: Test Preposition Case Coach
        working-directory: web
        env:
          CI: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:ci -- --runTestsByPath src/lib/prepositionCaseCoach.test.js src/hooks/usePrepositionCaseHints.test.js src/components/PrepositionCaseHints.test.jsx src/components/PrepositionCaseCoachInjector.test.jsx 2>&1 | tee preposition-case-coach-tests.log

      - name: Upload coach test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preposition-case-coach-test-log
          path: web/preposition-case-coach-tests.log
          if-no-files-found: ignore

      - name: Test attendance reporting
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/services/attendanceService.test.js

      - name: Test speaking tools
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/SpeakingMindMap.test.js src/components/SpeakingPracticeTimerCard.test.js

      - name: Test inline course submissions
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/CourseLessonInlineSubmission.test.js

      - name: Test workbook route matching
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/AutoWorkbookStartGuide.test.js

      - name: Test workbook tabs and lock identities
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/utils/courseWorkbookSubmission.test.js

      - name: Test A2 and B1 workbook navigation
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/A2B1CourseBook.test.js

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Audit A1 curriculum
        run: npm run audit:a1-curriculum

      - name: Install web dependencies
        working-directory: web
        run: npm install --legacy-peer-deps --no-audit --no-fund --loglevel=error

      - name: Build web app
        working-directory: web
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee web-build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preposition-case-coach-build-log
          path: web/web-build.log
          if-no-files-found: ignore

  curriculum-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check curriculum manifest sync
        run: node scripts/checkCurriculumManifestSync.js
