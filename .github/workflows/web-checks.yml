name: Web checks

on:
  pull_request:
    paths:
      - "web/**"
      - "shared/**"
      - "scripts/**"
      - "functions/data/curriculumManifest.js"
      - "package.json"
      - ".github/workflows/web-checks.yml"

jobs:
  a1-curriculum:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - test_path: src/data/a1CourseBookCards.test.js
            artifact_name: a1-card-source-test-log
          - test_path: src/utils/courseBookEntries.test.js
            artifact_name: a1-entry-expansion-test-log
    name: A1 curriculum · ${{ matrix.test_path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Audit A1 curriculum
        run: npm run audit:a1-curriculum

      - name: Install web dependencies
        working-directory: web
        run: npm install --legacy-peer-deps --no-audit --no-fund --loglevel=error

      - name: Run A1 regression test
        working-directory: web
        env:
          CI: true
        run: |
          set +e
          npm test -- --watchAll=false --runInBand --runTestsByPath ${{ matrix.test_path }} > ../${{ matrix.artifact_name }}.log 2>&1
          status=$?
          cat ../${{ matrix.artifact_name }}.log
          exit $status

      - name: Upload A1 test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.log
          retention-days: 2

  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Audit A1 curriculum
        run: npm run audit:a1-curriculum

      - name: Install web dependencies
        working-directory: web
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Test speaking tools
        working-directory: web
        env:
          CI: true
        run: npm test -- --watchAll=false --runTestsByPath src/components/SpeakingMindMap.test.js src/components/SpeakingPracticeTimerCard.test.js

      - name: Test inline course submissions
        working-directory: web
        env:
          CI: true
        run: npm test -- --watchAll=false --runTestsByPath src/components/CourseLessonInlineSubmission.test.js

      - name: Test workbook route matching
        working-directory: web
        env:
          CI: true
        run: npm test -- --watchAll=false --runTestsByPath src/components/AutoWorkbookStartGuide.test.js

      - name: Test workbook tabs and lock identities
        working-directory: web
        env:
          CI: true
        run: npm test -- --watchAll=false --runTestsByPath src/utils/courseWorkbookSubmission.test.js

      - name: Test A2 and B1 workbook navigation
        working-directory: web
        env:
          CI: true
        run: npm test -- --watchAll=false --runTestsByPath src/components/A2B1CourseBook.test.js

      - name: Build web app
        working-directory: web
        run: npm run build

      - name: Check curriculum manifest sync
        run: node scripts/checkCurriculumManifestSync.js
