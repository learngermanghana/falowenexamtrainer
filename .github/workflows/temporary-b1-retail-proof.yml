name: Temporary B1 retail PDF proof (no deployment)
on:
  push:
    branches: [fix/b1-retail-pdf-publishing-2026-11-02]
permissions:
  contents: read
jobs:
  retail-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test B1 print sources and helpers
        run: |
          node --check scripts/course-material-bundles/b1PdfPrintExtras.mjs
          node --check scripts/course-material-bundles/b1PrintableCompanions.mjs
          node --test scripts/course-material-bundles/b1RetailPrint.test.mjs
          node --test scripts/course-material-bundles/b1PrintableCompanions.test.mjs
      - name: Generate B1 manifest
        run: node scripts/course-material-bundles/buildLevelManifest.mjs B1
      - name: Install PDF renderer
        run: npm install --no-save --package-lock=false playwright@1.54.2 pdf-lib@1.17.1 qrcode@1.5.4
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install print text validator
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Render B1 retail proof
        run: node scripts/course-material-bundles/renderLevelBundleV2.mjs B1
        env:
          FALOWEN_PDF_BASE_URL: https://www.falowen.app
          FALOWEN_PDF_EMAIL: ${{ secrets.FALOWEN_PDF_EMAIL }}
          FALOWEN_PDF_PASSWORD: ${{ secrets.FALOWEN_PDF_PASSWORD }}
          FALOWEN_PDF_AUTH_STATE_B64: ${{ secrets.FALOWEN_PDF_AUTH_STATE_B64 }}
      - name: Validate full B1 retail proof
        run: node scripts/course-material-bundles/validateGeneratedBundle.mjs B1
      - name: Upload B1 PDF for editorial inspection even when the final audit fails
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: Falowen-B1-retail-inspection-not-for-sale
          path: artifacts/course-material-bundles/B1/Falowen-B1-Course-Materials.pdf
          if-no-files-found: warn
          retention-days: 14
      - name: Upload diagnostics if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: B1-retail-publication-diagnostics
          path: |
            artifacts/course-material-bundles/B1/render-diagnostics.json
            artifacts/course-material-bundles/B1/Falowen-B1-Course-Materials-manifest.json
          retention-days: 7
