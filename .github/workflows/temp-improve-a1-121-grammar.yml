name: Improve A1 12.1 grammar notes

on:
  push:
    branches:
      - agent/integrate-a1-bridge-grammar-notes

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/integrate-a1-bridge-grammar-notes
          fetch-depth: 0

      - name: Improve translations and visual game
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('web/src/components/TwoCasePrepositionsPageLegacy.js')
          source = path.read_text()

          replacements = []

          replacements.append((
          '''const SceneCard = ({ label, emojiLine1, emojiLine2, helper }) => (''',
          '''const SceneCard = ({ label, emojiLine1, emojiLine2, helper }) => ('''
          ))

          replacements.append((
          '''const examplePairs = [
            ["in", "Ich gehe in die Schule.", "Ich bin in der Schule."],
            ["auf", "Er legt das Buch auf den Tisch.", "Das Buch liegt auf dem Tisch."],
            ["an", "Sie hängt das Bild an die Wand.", "Das Bild hängt an der Wand."],
            ["unter", "Der Hund läuft unter den Tisch.", "Der Hund liegt unter dem Tisch."],
            ["zwischen", "Ich stelle den Stuhl zwischen die Tische.", "Der Stuhl steht zwischen den Tischen."],
          ];''',
          '''const examplePairs = [
            ["in", "Ich gehe in die Schule.", "I go into the school.", "Ich bin in der Schule.", "I am in the school."],
            ["auf", "Er legt das Buch auf den Tisch.", "He puts the book onto the table.", "Das Buch liegt auf dem Tisch.", "The book is lying on the table."],
            ["an", "Sie hängt das Bild an die Wand.", "She hangs the picture onto the wall.", "Das Bild hängt an der Wand.", "The picture is hanging on the wall."],
            ["unter", "Der Hund läuft unter den Tisch.", "The dog runs under the table.", "Der Hund liegt unter dem Tisch.", "The dog is lying under the table."],
            ["zwischen", "Ich stelle den Stuhl zwischen die Tische.", "I put the chair between the tables.", "Der Stuhl steht zwischen den Tischen.", "The chair is standing between the tables."],
          ];'''
          ))

          replacements.append((
          '''const visualGame = [
            {
              label: "Cat + table",
              emojiLine1: "🐱",
              emojiLine2: "🟫 Tisch",
              helper: "The cat is on the table.",
              sentence: "Die Katze ist ______ dem Tisch.",
              answer: "auf",
            },
            {
              label: "Table + cat",
              emojiLine1: "🟫 Tisch",
              emojiLine2: "🐱",
              helper: "The cat is under the table.",
              sentence: "Die Katze ist ______ dem Tisch.",
              answer: "unter",
            },
            {
              label: "Bank – school – library",
              emojiLine1: "🏦   🏫   📚",
              emojiLine2: "",
              helper: "The school is between the bank and the library.",
              sentence: "Die Schule ist ______ der Bank und der Bibliothek.",
              answer: "zwischen",
            },
            {
              label: "Bag + table",
              emojiLine1: "🎒",
              emojiLine2: "🟫 Tisch",
              helper: "The bag goes onto the table.",
              sentence: "Ich lege die Tasche ______ den Tisch.",
              answer: "auf",
            },
            {
              label: "Boy + tree",
              emojiLine1: "👦   🌳",
              emojiLine2: "",
              helper: "The boy stands in front of the tree.",
              sentence: "Der Junge steht ______ dem Baum.",
              answer: "vor",
            },
            {
              label: "Car + house",
              emojiLine1: "🚗",
              emojiLine2: "🏠",
              helper: "The car is in front of the house.",
              sentence: "Das Auto steht ______ dem Haus.",
              answer: "vor",
            },
            {
              label: "Lamp + door",
              emojiLine1: "💡➡️🚪",
              emojiLine2: "",
              helper: "The lamp is attached to the door.",
              sentence: "Die Lampe hängt ______ der Tür.",
              answer: "an",
            },
            {
              label: "Dog + sofa",
              emojiLine1: "🐶",
              emojiLine2: "🛋",
              helper: "The dog is on the sofa.",
              sentence: "Der Hund sitzt ______ dem Sofa.",
              answer: "auf",
            },
            {
              label: "Box + table",
              emojiLine1: "📦",
              emojiLine2: "🟫 Tisch",
              helper: "The box is on the table.",
              sentence: "Die Kiste ist ______ dem Tisch.",
              answer: "auf",
            },
          ];''',
          '''const visualGame = [
            {
              label: "Cat on the table",
              emojiLine1: "🐱  ON TOP  🟫",
              emojiLine2: "Tisch / table",
              helper: "The cat is on top of the table.",
              sentence: "Die Katze ist ______ dem Tisch.",
              answer: "auf",
            },
            {
              label: "Cat under the table",
              emojiLine1: "🟫 Tisch / table",
              emojiLine2: "⬇️  🐱",
              helper: "The cat is under the table.",
              sentence: "Die Katze ist ______ dem Tisch.",
              answer: "unter",
            },
            {
              label: "School between two places",
              emojiLine1: "🏦  ←  🏫  →  📚",
              emojiLine2: "Bank   Schule   Bibliothek",
              helper: "The school is between the bank and the library.",
              sentence: "Die Schule ist ______ der Bank und der Bibliothek.",
              answer: "zwischen",
            },
            {
              label: "Put the bag onto the table",
              emojiLine1: "🎒  ➡️  🟫",
              emojiLine2: "onto the table / auf den Tisch",
              helper: "I put the bag onto the table. This shows movement: Wohin?",
              sentence: "Ich lege die Tasche ______ den Tisch.",
              answer: "auf",
            },
            {
              label: "Boy in front of the tree",
              emojiLine1: "👦  FRONT  🌳",
              emojiLine2: "vor dem Baum",
              helper: "The boy is in front of the tree.",
              sentence: "Der Junge steht ______ dem Baum.",
              answer: "vor",
            },
            {
              label: "Car behind the house",
              emojiLine1: "🏠  HOUSE",
              emojiLine2: "⬇️ behind / dahinter: 🚗",
              helper: "The car is behind the house.",
              sentence: "Das Auto steht ______ dem Haus.",
              answer: "hinter",
            },
            {
              label: "Lamp attached to the door",
              emojiLine1: "🚪  +  💡",
              emojiLine2: "attached to the door / an der Tür",
              helper: "The lamp is attached to the door.",
              sentence: "Die Lampe hängt ______ der Tür.",
              answer: "an",
            },
            {
              label: "Dog next to the sofa",
              emojiLine1: "🐶  ↔️  🛋",
              emojiLine2: "next to / neben",
              helper: "The dog is sitting next to the sofa.",
              sentence: "Der Hund sitzt ______ dem Sofa.",
              answer: "neben",
            },
            {
              label: "Box in the room",
              emojiLine1: "🏠  📦  🏠",
              emojiLine2: "inside / in",
              helper: "The box is in the room.",
              sentence: "Die Kiste ist ______ dem Zimmer.",
              answer: "in",
            },
          ];'''
          ))

          replacements.append((
          '''              {[
                ["legen", "liegen"],
                ["stellen", "stehen"],
                ["setzen", "sitzen"],
                ["hängen", "hängen"],
              ].map(([a, b], index) => (
                <tr key={`${a}-${b}-${index}`}>
                  <td style={tdStyle}>{a}</td>
                  <td style={tdStyle}>{b}</td>
                </tr>
              ))}''',
          '''              {[
                ["legen", "to lay / put something down", "liegen", "to lie / be lying"],
                ["stellen", "to place / stand something upright", "stehen", "to stand / be standing"],
                ["setzen", "to set / seat / put into a sitting position", "sitzen", "to sit / be seated"],
                ["hängen", "to hang / put up", "hängen", "to hang / be hanging"],
              ].map(([a, aEnglish, b, bEnglish], index) => (
                <tr key={`${a}-${b}-${index}`}>
                  <td style={tdStyle}><strong>{a}</strong><br /><span style={{ opacity: 0.78 }}>{aEnglish}</span></td>
                  <td style={tdStyle}><strong>{b}</strong><br /><span style={{ opacity: 0.78 }}>{bEnglish}</span></td>
                </tr>
              ))}'''
          ))

          replacements.append((
          '''          {examplePairs.map(([preposition, movement, position], index) => (
            <div
              key={`${preposition}-${index}`}
              style={{ border: "1px solid #e5e7eb", borderRadius: 12, padding: 12 }}
            >
              <strong>🔹 {preposition}</strong>
              <p style={{ margin: "8px 0 0" }}>
                {movement} <span style={{ opacity: 0.8 }}>(Wohin?)</span>
              </p>
              <p style={{ margin: "6px 0 0" }}>
                {position} <span style={{ opacity: 0.8 }}>(Wo?)</span>
              </p>
            </div>
          ))}''',
          '''          {examplePairs.map(([preposition, movement, movementEnglish, position, positionEnglish], index) => (
            <div
              key={`${preposition}-${index}`}
              style={{ border: "1px solid #e5e7eb", borderRadius: 12, padding: 12, display: "grid", gap: 5 }}
            >
              <strong>🔹 {preposition}</strong>
              <p style={{ margin: "8px 0 0" }}>
                {movement} <span style={{ opacity: 0.8 }}>(Wohin? · Akkusativ)</span>
              </p>
              <p style={{ margin: 0, color: "#475569", fontSize: 14 }}>→ {movementEnglish}</p>
              <p style={{ margin: "6px 0 0" }}>
                {position} <span style={{ opacity: 0.8 }}>(Wo? · Dativ)</span>
              </p>
              <p style={{ margin: 0, color: "#475569", fontSize: 14 }}>→ {positionEnglish}</p>
            </div>
          ))}'''
          ))

          replacements.append((
          '''        <p style={{ margin: 0, opacity: 0.85 }}>
          Answered: {answeredVisual}/{visualGame.length}
        </p>''',
          '''        <p style={{ margin: 0, color: "#475569" }}>
          Match the picture, the English clue and the German sentence. Each card has one clear answer.
        </p>
        <p style={{ margin: 0, opacity: 0.85 }}>
          Answered: {answeredVisual} of {visualGame.length}
        </p>'''
          ))

          changed = False
          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f'Expected block not found:\n{old[:180]}')
              source = source.replace(old, new, 1)
              changed = True

          path.write_text(source)
          PY

      - name: Add regression test
        run: |
          cat > web/src/components/TwoCasePrepositionsPageLegacy.content.test.js <<'EOF'
          import fs from "fs";
          import path from "path";

          const source = fs.readFileSync(path.resolve(__dirname, "TwoCasePrepositionsPageLegacy.js"), "utf8");

          describe("A1 12.1 bilingual grammar notes", () => {
            test("adds English meanings to helpful verb pairs", () => {
              expect(source).toContain("to lay / put something down");
              expect(source).toContain("to lie / be lying");
              expect(source).toContain("to place / stand something upright");
              expect(source).toContain("to sit / be seated");
            });

            test("adds English translations to all example pairs", () => {
              [
                "I go into the school.",
                "The book is lying on the table.",
                "The picture is hanging on the wall.",
                "The dog is lying under the table.",
                "The chair is standing between the tables.",
              ].forEach((translation) => expect(source).toContain(translation));
            });

            test("keeps visual-game clues aligned with their expected answers", () => {
              expect(source).toContain('label: "Car behind the house"');
              expect(source).toContain('sentence: "Das Auto steht ______ dem Haus."');
              expect(source).toContain('answer: "hinter"');
              expect(source).toContain('label: "Dog next to the sofa"');
              expect(source).toContain('answer: "neben"');
              expect(source).toContain('label: "Box in the room"');
              expect(source).toContain('answer: "in"');
              expect(source).toContain("Answered: {answeredVisual} of {visualGame.length}");
            });
          });
          EOF

      - name: Test and build
        working-directory: web
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund --loglevel=error
          CI=true npm run test:ci -- --runTestsByPath src/components/TwoCasePrepositionsPageLegacy.content.test.js src/components/TwoCasePrepositionsPage.test.js
          npm run build

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/components/TwoCasePrepositionsPageLegacy.js web/src/components/TwoCasePrepositionsPageLegacy.content.test.js
          git commit -m "Improve A1 12.1 bilingual grammar notes"
          git push origin HEAD:agent/integrate-a1-bridge-grammar-notes
