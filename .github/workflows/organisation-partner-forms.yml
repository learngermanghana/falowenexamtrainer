name: Organisation partner forms regression

on:
  pull_request:
    paths:
      - "web/src/components/PublicPartnerForms.test.jsx"
      - "web/src/components/OrganisationEnrolmentPage.jsx"
      - "web/src/components/PartnershipPage.jsx"
      - "web/src/lib/organisationClasses.js"
      - ".github/workflows/organisation-partner-forms.yml"
  push:
    branches: [main]
    paths:
      - "web/src/components/PublicPartnerForms.test.jsx"
      - "web/src/components/OrganisationEnrolmentPage.jsx"
      - "web/src/components/PartnershipPage.jsx"
      - "web/src/lib/organisationClasses.js"
      - ".github/workflows/organisation-partner-forms.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install website dependencies
        working-directory: web
        run: npm ci
      - name: Verify organisation forms and automatic class catalogue
        working-directory: web
        run: npx jest --runInBand --runTestsByPath src/components/PublicPartnerForms.test.jsx
