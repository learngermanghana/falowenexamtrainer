name: Restore tested Home metrics implementation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  restore-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Restore last tested score summary implementation
        run: |
          git show d4824e94c4ef2bc98e3d195af670a6cd8bf3d846:functions/functionz/routes/scoresSummary.js > functions/functionz/routes/scoresSummary.js

      - name: Check backend syntax
        working-directory: functions
        run: |
          node --check functionz/routes/scoresSummary.js
          node --check functionz/routes/scoresSummaryCoursePlan.js
          node --test functionz/routes/scoresSummaryCoursePlan.test.js

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Test Course Book progression
        working-directory: web
        run: |
          npm test -- --runInBand src/utils/courseBookProgression.test.js src/utils/courseBookEntries.test.js
          node -e 'const fs=require("fs"); const parser=require("@babel/parser"); for (const file of ["src/components/CourseTab.js","src/components/HomeMetrics.js"]) { parser.parse(fs.readFileSync(file,"utf8"), {sourceType:"module", plugins:["jsx","optionalChaining"]}); }'

      - name: Commit restored implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/functionz/routes/scoresSummary.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Restore tested Home metrics score summary"
          git push origin HEAD:${{ github.head_ref }}
