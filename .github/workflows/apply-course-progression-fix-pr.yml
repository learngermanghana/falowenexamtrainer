name: Final course progression cleanup

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  clean-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Clean source blocks
        shell: bash
        env:
          COURSE_B64: 
          HOME_B64: 
          STATUS_B64: 
          MISSED_B64: 
          NEXT_B64: 
          PLAN_B64: 
        run: |
          python <<'PY'
          import base64
          import os
          import re
          from pathlib import Path

          def decoded(name):
              return base64.b64decode(os.environ[name]).decode()

          def replace(path, pattern, replacement):
              text = path.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"Expected one cleanup replacement in {path}, got {count}")
              path.write_text(updated)

          replace(
              Path("web/src/components/CourseTab.js"),
              r"  const persistPracticeProgress = async \(entry, nextValue\) => \{.*?\n\s*const updatePracticeEntry",
              decoded("COURSE_B64"),
          )
          replace(
              Path("web/src/components/HomeMetrics.js"),
              r"  const failedIdentifiersText = useMemo\(\(\) => \{.*?\n\s*const leaderboardRows",
              decoded("HOME_B64"),
          )
          scores = Path("functions/functionz/routes/scoresSummary.js")
          replace(scores, r"    const lessonStatus = plannedLessons\.map\(.*?\n\s*\}\);", decoded("STATUS_B64"))
          replace(scores, r"      \.map\(\(.*?\) => \(\{\n\s*label: .*?\n\s*\}\)\);", decoded("MISSED_B64"))
          replace(scores, r"        nextRecommendation = \{\n\s*label: firstIncomplete\.label,.*?\n\s*\};", decoded("NEXT_B64"))
          replace(
              Path("functions/functionz/routes/scoresSummaryCoursePlan.js"),
              r"      const hasResource = Boolean\(.*?\n\s*\);",
              decoded("PLAN_B64"),
          )

          updates = {
              "en": (
                  '"helper": "Missed items are only those before your last fully completed day."',
                  '"helper": "Earlier tutor assignments or self-study lessons you skipped in the visible Course Book order."',
                  None,
              ),
              "de": (
                  '"helper": "Missed items are only those before your last fully completed day."',
                  '"helper": "Frühere Tutor-Aufgaben oder Selbstlernlektionen, die du in der sichtbaren Kursbuch-Reihenfolge übersprungen hast."',
                  '"selfStudyHelper": "Schließe diese Selbstlernlektion ab und markiere sie im Kursbuch als abgeschlossen, um den nächsten Inhalt freizuschalten."',
              ),
              "fr": (
                  '"helper": "Missed items are only those before your last fully completed day."',
                  '"helper": "Devoirs avec tuteur ou leçons en autonomie précédents que tu as sautés dans l’ordre visible du manuel."',
                  '"selfStudyHelper": "Termine cette leçon en autonomie et marque-la comme terminée dans le manuel pour débloquer l’élément suivant."',
              ),
          }
          for locale, (old, new, self_study) in updates.items():
              path = Path(f"web/src/i18n/locales/{locale}/translation.json")
              text = path.read_text().replace(old, new, 1)
              if self_study and '"selfStudyHelper"' not in text:
                  text = text.replace(
                      '"defaultHelper": "Keep going with your next recommended task."',
                      '"defaultHelper": "Keep going with your next recommended task.",\n      ' + self_study,
                      1,
                  )
              path.write_text(text)
          PY

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Test Course Book progression
        working-directory: web
        run: |
          npm test -- --runInBand src/utils/courseBookProgression.test.js src/utils/courseBookEntries.test.js
          node -e 'const fs=require("fs"); const parser=require("@babel/parser"); for (const file of ["src/components/CourseTab.js","src/components/HomeMetrics.js"]) { parser.parse(fs.readFileSync(file,"utf8"), {sourceType:"module", plugins:["jsx","optionalChaining"]}); }'

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test Home metrics course plan
        working-directory: functions
        run: node --test functionz/routes/scoresSummaryCoursePlan.test.js

      - name: Commit final cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/components/CourseTab.js web/src/components/HomeMetrics.js web/src/i18n/locales/en/translation.json web/src/i18n/locales/de/translation.json web/src/i18n/locales/fr/translation.json functions/functionz/routes/scoresSummary.js functions/functionz/routes/scoresSummaryCoursePlan.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finalize course progression source cleanup"
          git push origin HEAD:${{ github.head_ref }}
