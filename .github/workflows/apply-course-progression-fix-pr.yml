name: Clean course progression implementation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  clean-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Clean generated source blocks
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def regex_once(path, pattern, replacement):
              text = path.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"Expected one formatting replacement in {path}, got {count}")
              path.write_text(updated)

          course_tab = Path("web/src/components/CourseTab.js")
          regex_once(
              course_tab,
              r"  const persistPracticeProgress = async \(entry, nextValue\) => \{.*?\n\};\n\n  const updatePracticeEntry",
              '''  const persistPracticeProgress = async (entry, nextValue) => {
            const assignmentKey = entry?.assignmentKey;
            if (!db || !studentCode || !assignmentKey) return;
            const docId = `${String(studentCode).toLowerCase()}_${String(selectedCourseLevel).toLowerCase()}_${String(assignmentKey).toLowerCase().replace(/[^a-z0-9._-]/g, "_")}`;
            await setDoc(
              doc(db, "coursePracticeProgress", docId),
              {
                studentCode,
                level: selectedCourseLevel,
                assignmentKey,
                entryId: entry.assignmentId || entry.assignment_id || null,
                displayDay: getCourseBookDisplayDay(entry),
                chapter: entry.displayChapter || entry.chapter || null,
                lessonTitle: getCourseBookEntryTitle(entry),
                ...nextValue,
                updatedAt: serverTimestamp(),
              },
              { merge: true }
            );
          };

          const updatePracticeEntry'''
          )

          home = Path("web/src/components/HomeMetrics.js")
          regex_once(
              home,
              r"  const failedIdentifiersText = useMemo\(\(\) => \{.*?\n  const leaderboardRows",
              '''  const failedIdentifiersText = useMemo(() => {
            const ids = assignmentStats?.failedIdentifiers || [];
            return ids.length ? ids.join(", ") : "";
          }, [assignmentStats]);

          const nextRecommendationHelper = useMemo(() => {
            if (blocked) {
              return failedIdentifiersText
                ? t("homeMetrics.nextRecommendation.blockedWithIds", { items: failedIdentifiersText })
                : t("homeMetrics.nextRecommendation.blocked");
            }
            if (nextObj?.selfStudy) {
              return t("homeMetrics.nextRecommendation.selfStudyHelper", {
                title: nextObj.title || nextObj.label,
                defaultValue: "Complete this self-study lesson and mark it complete in the Course Book to unlock the next item.",
              });
            }
            if (nextObj?.goal && !isPassingScoreGoal(nextObj.goal)) {
              return t("homeMetrics.nextRecommendation.goal", { goal: nextObj.goal });
            }
            return t("homeMetrics.nextRecommendation.defaultHelper");
          }, [blocked, failedIdentifiersText, nextObj, t]);

          const leaderboardRows'''
          )

          scores = Path("functions/functionz/routes/scoresSummary.js")
          regex_once(
              scores,
              r"    const lessonStatus = plannedLessons\.map\(\(l\) => \{.*?\n  \}\);",
              '''    const lessonStatus = plannedLessons.map((l) => {
              const isCompleted = l.selfStudy
                ? (l.practiceKeys || []).some((key) => completedPracticeKeys.has(normalizePracticeKey(key)))
                : l.identifiers.length > 0 && l.identifiers.every((id) => passed.has(id));
              const hasFailed = !l.selfStudy && l.identifiers.some((id) => failed.has(id));
              return { ...l, isCompleted, hasFailed };
            });'''
          )
          regex_once(
              scores,
              r"      \.map\(\(l\) => \(\{\n      label: l\.label,.*?\n    \}\)\);",
              '''      .map((l) => ({
                label: l.label,
                identifiers: l.identifiers,
                dayNumber: l.dayNumber,
                displayDay: l.displayDay,
                displayChapter: l.displayChapter,
                title: l.title,
                goal: l.goal,
                assignmentId: l.assignmentId,
                selfStudy: l.selfStudy,
                submissionRequired: l.submissionRequired,
                practiceKeys: l.practiceKeys,
              }));'''
          )
          regex_once(
              scores,
              r"        nextRecommendation = \{\n        label: firstIncomplete\.label,.*?\n      \};",
              '''        nextRecommendation = {
                  label: firstIncomplete.label,
                  identifiers: firstIncomplete.identifiers,
                  dayNumber: firstIncomplete.dayNumber,
                  displayDay: firstIncomplete.displayDay,
                  displayChapter: firstIncomplete.displayChapter,
                  title: firstIncomplete.title,
                  goal: firstIncomplete.goal,
                  assignmentId: firstIncomplete.assignmentId,
                  selfStudy: firstIncomplete.selfStudy,
                  submissionRequired: firstIncomplete.submissionRequired,
                  practiceKeys: firstIncomplete.practiceKeys,
                };'''
          )

          plan = Path("functions/functionz/routes/scoresSummaryCoursePlan.js")
          text = plan.read_text()
          text = text.replace(
              '''      const hasResource = Boolean(
                entry.workbookRoute ||
          entry.video ||
          toArray(entry.resources).some((resource) => resource?.workbookRoute || resource?.workbook_link || resource?.video || resource?.youtube_link)
              );''',
              '''      const hasResource = Boolean(
                entry.workbookRoute ||
                  entry.video ||
                  toArray(entry.resources).some(
                    (resource) =>
                      resource?.workbookRoute ||
                      resource?.workbook_link ||
                      resource?.video ||
                      resource?.youtube_link
                  )
              );'''
          )
          plan.write_text(text)

          locale_updates = {
              "en": (
                  '"helper": "Missed items are only those before your last fully completed day."',
                  '"helper": "Earlier tutor assignments or self-study lessons you skipped in the visible Course Book order."',
                  None,
              ),
              "de": (
                  '"helper": "Missed items are only those before your last fully completed day."',
                  '"helper": "Frühere Tutor-Aufgaben oder Selbstlernlektionen, die du in der sichtbaren Kursbuch-Reihenfolge übersprungen hast."',
                  '"selfStudyHelper": "Schließe diese Selbstlernlektion ab und markiere sie im Kursbuch als abgeschlossen, um den nächsten Inhalt freizuschalten."',
              ),
              "fr": (
                  '"helper": "Missed items are only those before your last fully completed day."',
                  '"helper": "Devoirs avec tuteur ou leçons en autonomie précédents que tu as sautés dans l’ordre visible du manuel."',
                  '"selfStudyHelper": "Termine cette leçon en autonomie et marque-la comme terminée dans le manuel pour débloquer l’élément suivant."',
              ),
          }
          for locale, (old_helper, new_helper, self_study_line) in locale_updates.items():
              path = Path(f"web/src/i18n/locales/{locale}/translation.json")
              text = path.read_text().replace(old_helper, new_helper, 1)
              if self_study_line and '"selfStudyHelper"' not in text:
                  text = text.replace(
                      '"defaultHelper": "Keep going with your next recommended task."',
                      '"defaultHelper": "Keep going with your next recommended task.",\n      ' + self_study_line,
                      1,
                  )
              path.write_text(text)
          PY

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Test Course Book progression
        working-directory: web
        run: |
          npm test -- --runInBand src/utils/courseBookProgression.test.js src/utils/courseBookEntries.test.js
          node -e 'const fs=require("fs"); const parser=require("@babel/parser"); for (const file of ["src/components/CourseTab.js","src/components/HomeMetrics.js"]) { parser.parse(fs.readFileSync(file,"utf8"), {sourceType:"module", plugins:["jsx","optionalChaining"]}); }'

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test Home metrics course plan
        working-directory: functions
        run: node --test functionz/routes/scoresSummaryCoursePlan.test.js

      - name: Commit cleaned implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/components/CourseTab.js web/src/components/HomeMetrics.js web/src/i18n/locales/en/translation.json web/src/i18n/locales/de/translation.json web/src/i18n/locales/fr/translation.json functions/functionz/routes/scoresSummary.js functions/functionz/routes/scoresSummaryCoursePlan.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Clean course progression implementation"
          git push origin HEAD:${{ github.head_ref }}
