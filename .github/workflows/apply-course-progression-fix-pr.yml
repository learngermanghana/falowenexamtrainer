name: Apply course progression fix PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Extract and run patch script
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-course-progression-fix.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == '- name: Apply progression changes')
          run_line = next(i for i in range(start + 1, len(source)) if source[i].strip() == 'run: |')
          lines = []
          for line in source[run_line + 1:]:
              if line.startswith('      - name:'):
                  break
              lines.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(lines) + '\n'
          script = script.replace("'''.replace(/^          /gm, \"\"))", "'''.replace(\"\\n          \", \"\\n\"))")
          script = script.replace(
              "replace_once(course_tab, old_persist, new_persist)",
              "regex_once(course_tab, r'  const persistPracticeProgress = async \\(assignmentKey, nextValue\\) => \\{.*?\\n  \\};', new_persist.rstrip())",
          )
          script = script.replace(
              "replace_once(course_tab, old_next_card, new_next_card)",
              "regex_once(course_tab, r'          \\{nextLesson \\? \\(.*?\\n          \\) : null\\}\\n', new_next_card.rstrip() + '\\n')",
          )
          script = script.replace(
              "replace_once(home_metrics, helper_anchor_home, helper_replacement_home)",
              "regex_once(home_metrics, r'  const failedIdentifiersText = useMemo\\(\\(\\) => \\{.*?\\n  \\}, \\[assignmentStats\\]\\);', helper_replacement_home.rstrip())",
          )
          script = script.replace(
              "replace_once(home_metrics, old_helper_jsx, '          helper={nextRecommendationHelper}\\n')",
              "regex_once(home_metrics, r'          helper=\\{\\n            blocked.*?\\n          \\}\\n', '          helper={nextRecommendationHelper}\\n')",
          )
          script = script.replace(
              "replace_once(scores, old_status, new_status)",
              "regex_once(scores, r'    const lessonStatus = plannedLessons\\.map\\(\\(l\\) => \\{.*?\\n    \\}\\);', new_status.rstrip())",
          )
          script = script.replace(
              "replace_once(scores, old_missed_map, new_missed_map)",
              "regex_once(scores, r'      \\.map\\(\\(l\\) => \\(\\{\\n        label: l\\.label,.*?\\n      \\}\\)\\);', new_missed_map.rstrip())",
          )
          script = script.replace(
              "replace_once(scores, old_next, new_next)",
              "regex_once(scores, r'        nextRecommendation = \\{\\n          label: firstIncomplete\\.label,.*?\\n        \\};', new_next.rstrip())",
          )
          marker = 'completedPracticeCount: lessonStatus.filter'
          marker_pos = script.find(marker)
          if marker_pos < 0:
              raise SystemExit('Could not find score summary response marker')
          block_start = script.rfind('replace_once(', 0, marker_pos)
          block_end = script.find('\n)', marker_pos)
          if block_start < 0 or block_end < 0:
              raise SystemExit('Could not locate score summary response replacement block')
          block_end += 2
          robust_response_patch = "regex_once(scores, r'        totalAssignments,\\n        submittedCount,\\n        completedCount: completedAssignments\\.length,', '        totalAssignments,\\n        totalCourseItems,\\n        submittedCount,\\n        completedCount: completedAssignments.length,\\n        completedPracticeCount: lessonStatus.filter((lesson) => lesson.selfStudy && lesson.isCompleted).length,')"
          script = script[:block_start] + robust_response_patch + script[block_end:]
          Path('/tmp/apply-course-progression.sh').write_text(script)
          PY
          set +e
          bash /tmp/apply-course-progression.sh 2>&1 | tee /tmp/course-progression-patch.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload patch diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: course-progression-patch-diagnostics
          path: /tmp/course-progression-patch.log

      - name: Move progression logic to a pure utility
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          course_tab = Path('web/src/components/CourseTab.js')
          text = course_tab.read_text()
          import_line = 'import { expandCourseBookEntries } from "../utils/courseBookEntries";'
          progression_import = 'import { getNextCourseBookEntry, isCourseBookEntryComplete } from "../utils/courseBookProgression";'
          if progression_import not in text:
              text = text.replace(import_line, import_line + '\n' + progression_import, 1)
          text, count = re.subn(
              r'const COMPLETED_TUTOR_STATUSES = new Set\(\[.*?\nconst getCourseBookEntryTitle',
              'const getCourseBookEntryTitle',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1 and 'export const isCourseBookEntryComplete' in text:
              raise SystemExit('Could not extract Course Book progression helpers')
          course_tab.write_text(text)

          old_test = Path('web/src/components/CourseTab.status.test.js')
          test_text = old_test.read_text()
          test_text = test_text.replace('  getNextCourseBookEntry,\n', '')
          test_text = test_text.replace('  isCourseBookEntryComplete,\n', '')
          test_text = re.sub(r'\n\s*describe\("course book next lesson progression".*?\n\s*\}\);\s*$', '\n', test_text, flags=re.S)
          old_test.write_text(test_text)

          utility = Path('web/src/utils/courseBookProgression.js')
          utility.write_text('''const COMPLETED_TUTOR_STATUSES = new Set(["passed", "submitted", "resubmitted"]);

const isMilestoneEntry = (entry = {}) =>
  Boolean(entry?.isMilestone || entry?.completion || /course completed/i.test(String(entry?.topic || "")));

const isTutorMarkedEntry = (entry = {}) =>
  Boolean(
    entry?.isTutorMarked ??
      entry?.tutorMarked ??
      entry?.submissionRequired ??
      entry?.assessmentType === "tutor-marked" ??
      entry?.assignment
  );

export const isCourseBookEntryComplete = (entry = {}, practiceProgress = {}) => {
  if (!entry || isMilestoneEntry(entry)) return false;
  if (isTutorMarkedEntry(entry)) return COMPLETED_TUTOR_STATUSES.has(entry.status);
  return Boolean(practiceProgress?.[entry.assignmentKey]?.completed);
};

export const getNextCourseBookEntry = (entries = [], practiceProgress = {}) =>
  entries.find((entry) => !isMilestoneEntry(entry) && !isCourseBookEntryComplete(entry, practiceProgress)) || null;
''')

          utility_test = Path('web/src/utils/courseBookProgression.test.js')
          utility_test.write_text('''import { getNextCourseBookEntry, isCourseBookEntryComplete } from "./courseBookProgression";

describe("course book next lesson progression", () => {
  const entries = [
    { assignmentKey: "A1-0.1", topic: "Greetings", isTutorMarked: true, status: "passed", isMilestone: false },
    { assignmentKey: "A1-DAY-3-PRACTICE-1.1", topic: "Pronouns self-study", isTutorMarked: false, status: "notStarted", isMilestone: false },
    { assignmentKey: "A1-1.2", topic: "Introducing Yourself", isTutorMarked: true, status: "notStarted", isMilestone: false },
  ];

  it("stops at an incomplete self-study lesson", () => {
    expect(getNextCourseBookEntry(entries, {})).toMatchObject({ assignmentKey: "A1-DAY-3-PRACTICE-1.1" });
    expect(isCourseBookEntryComplete(entries[1], {})).toBe(false);
  });

  it("unlocks the next assignment after self-study is marked complete", () => {
    const practiceProgress = { "A1-DAY-3-PRACTICE-1.1": { completed: true } };
    expect(isCourseBookEntryComplete(entries[1], practiceProgress)).toBe(true);
    expect(getNextCourseBookEntry(entries, practiceProgress)).toMatchObject({ assignmentKey: "A1-1.2" });
  });
});
''')
          PY

      - name: Use Node.js 18 for web tests
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Test Course Book progression
        shell: bash
        working-directory: web
        run: |
          set +e
          npm test -- --runInBand src/utils/courseBookProgression.test.js src/utils/courseBookEntries.test.js 2>&1 | tee /tmp/course-book-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            node <<'NODE'
          const fs = require('fs');
          const parser = require('@babel/parser');
          for (const file of ['src/components/CourseTab.js', 'src/components/HomeMetrics.js']) {
            parser.parse(fs.readFileSync(file, 'utf8'), { sourceType: 'module', plugins: ['jsx', 'optionalChaining'] });
            console.log(`Parsed ${file}`);
          }
          NODE
            status=$?
          fi
          exit "$status"

      - name: Upload Course Book test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: course-book-test-diagnostics
          path: |
            /tmp/course-book-tests.log
            web/src/components/CourseTab.js
            web/src/components/HomeMetrics.js
            web/src/utils/courseBookProgression.js
            web/src/utils/courseBookProgression.test.js
            functions/functionz/routes/scoresSummary.js
            functions/functionz/routes/scoresSummaryCoursePlan.js
            functions/functionz/routes/scoresSummaryCoursePlan.test.js

      - name: Use Node.js 22 for functions tests
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test Home metrics course plan
        working-directory: functions
        run: node --test functionz/routes/scoresSummaryCoursePlan.test.js

      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/components/CourseTab.js web/src/components/CourseTab.status.test.js web/src/components/HomeMetrics.js web/src/utils/courseBookProgression.js web/src/utils/courseBookProgression.test.js web/src/i18n/locales/en/translation.json web/src/i18n/locales/de/translation.json web/src/i18n/locales/fr/translation.json functions/functionz/routes/scoresSummary.js functions/functionz/routes/scoresSummaryCoursePlan.js functions/functionz/routes/scoresSummaryCoursePlan.test.js
          if git diff --cached --quiet; then
            echo "No progression changes to commit."
            exit 0
          fi
          git commit -m "Align Home metrics and Course Book progression"
          git push origin HEAD:${{ github.head_ref }}
