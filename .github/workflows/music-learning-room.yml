name: Falowen Music learning room

on:
  pull_request:
    paths:
      - 'web/public/music/**'
      - 'web/tests/music-playback-queue.test.cjs'
      - 'api/approved-music.js'
      - 'scripts/publishApprovedMusic.mjs'
      - 'tests/music-learning-room.test.mjs'
      - 'tests/music-follow-ui.test.mjs'
      - 'tests/music-timed-lyrics.test.mjs'
      - 'tests/a2-day10-traveller-music.test.mjs'
      - 'tests/a1-day02-day03-recording-lyrics.test.mjs'
      - 'server/musicLyrics.cjs'
      - 'server/musicDiscovery.cjs'
      - 'tests/music-ui/**'
      - '.github/workflows/music-learning-room.yml'
  push:
    branches: [main]
    paths:
      - 'web/public/music/**'
      - 'web/tests/music-playback-queue.test.cjs'
      - 'api/approved-music.js'
      - 'scripts/publishApprovedMusic.mjs'
      - 'tests/music-learning-room.test.mjs'
      - 'tests/music-follow-ui.test.mjs'
      - 'tests/music-timed-lyrics.test.mjs'
      - 'tests/a2-day10-traveller-music.test.mjs'
      - 'tests/a1-day02-day03-recording-lyrics.test.mjs'
      - 'server/musicLyrics.cjs'
      - 'server/musicDiscovery.cjs'
      - 'tests/music-ui/**'

jobs:
  validate-music:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse music JS and publishing script
        run: |
          node --check web/public/music/app.js
          node --check web/public/music/playback-queue.js
          node --check api/approved-music.js
          node --check scripts/publishApprovedMusic.mjs
      - name: Check mobile continuous-playback queue and lock-screen contracts
        run: node --test web/tests/music-playback-queue.test.cjs
      - name: Install isolated DOM test dependencies
        run: npm ci --prefix tests/music-ui --ignore-scripts
      - name: Verify published songs, quiz evidence and R2 privacy
        run: node --test tests/a1-day02-day03-recording-lyrics.test.mjs tests/music-learning-room.test.mjs tests/music-timed-lyrics.test.mjs tests/music-follow-ui.test.mjs tests/a2-day10-traveller-music.test.mjs
