name: Fix Firebase class page flow

on:
  push:
    paths:
      - ".github/workflows/fix-firebase-class-page-flow.yml"

permissions:
  contents: write

jobs:
  fix-class-page:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Repair class catalogue and brochure flow
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_name, old, new):
              path = Path(path_name)
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path_name}: {old[:120]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Reuse one Firestore catalogue request across the many legacy scripts
          # that still request classes-data.json.
          replace_once(
              "web/public/classes/class-template-loader.js",
              '  const originalFetch = window.fetch.bind(window);\n  const DAY_INDEX',
              '  const originalFetch = window.fetch.bind(window);\n  let liveCataloguePromise = null;\n  const DAY_INDEX',
          )
          replace_once(
              "web/public/classes/class-template-loader.js",
              '''  async function fetchLiveCatalogue() {
    const failures = [];
    for (const endpoint of LIVE_CATALOG_ENDPOINTS) {
      const separator = endpoint.includes("?") ? "&" : "?";
      const liveUrl = `${endpoint}${separator}fresh=${Date.now()}`;
      try {
        const response = await originalFetch(liveUrl, {
          cache: "no-store",
          headers: {
            "cache-control": "no-cache",
            pragma: "no-cache",
          },
        });
        if (!response.ok) throw new Error(`${endpoint} returned ${response.status}`);
        const payload = await response.json();
        if (!Array.isArray(payload?.classes)) throw new Error(`${endpoint} did not return a classes array`);
        return payload;
      } catch (error) {
        failures.push(error?.message || String(error));
      }
    }
    throw new Error(failures.join(" | ") || "No live class catalogue endpoint was available");
  }
''',
              '''  async function fetchLiveCatalogue() {
    if (!liveCataloguePromise) {
      liveCataloguePromise = (async () => {
        const failures = [];
        for (const endpoint of LIVE_CATALOG_ENDPOINTS) {
          const separator = endpoint.includes("?") ? "&" : "?";
          const liveUrl = `${endpoint}${separator}fresh=${Date.now()}`;
          try {
            const response = await originalFetch(liveUrl, {
              cache: "no-store",
              headers: {
                "cache-control": "no-cache",
                pragma: "no-cache",
              },
            });
            if (!response.ok) throw new Error(`${endpoint} returned ${response.status}`);
            const payload = await response.json();
            if (!Array.isArray(payload?.classes)) throw new Error(`${endpoint} did not return a classes array`);
            return payload;
          } catch (error) {
            failures.push(error?.message || String(error));
          }
        }
        throw new Error(failures.join(" | ") || "No live class catalogue endpoint was available");
      })();
    }

    try {
      return await liveCataloguePromise;
    } catch (error) {
      liveCataloguePromise = null;
      throw error;
    }
  }
''',
          )

          # Send successful submissions to the canonical brochure route.
          replace_once(
              "web/public/classes/class-leads.js",
              '''  function buildClassUrl(courseOrSlug, extraParams) {
    const slug = typeof courseOrSlug === "string" ? slugify(courseOrSlug) : getCourseSlug(courseOrSlug);
    const params = new URLSearchParams({ class: slug, open: "1" });
    if (isDebugMode()) params.set("debug", "1");
    Object.entries(extraParams || {}).forEach(([key, value]) => {
      if (value !== undefined && value !== null && value !== "") params.set(key, String(value));
    });
    return `/classes/?${params.toString()}`;
  }
''',
              '''  function buildClassUrl(courseOrSlug, extraParams) {
    const slug = typeof courseOrSlug === "string" ? slugify(courseOrSlug) : getCourseSlug(courseOrSlug);
    if (!slug) return "/classes/";
    const params = new URLSearchParams();
    if (isDebugMode()) params.set("debug", "1");
    Object.entries(extraParams || {}).forEach(([key, value]) => {
      if (value !== undefined && value !== null && value !== "") params.set(key, String(value));
    });
    const query = params.toString();
    return `/classes/${encodeURIComponent(slug)}/${query ? `?${query}` : ""}`;
  }
''',
          )

          leads_path = Path("web/public/classes/class-leads.js")
          leads = leads_path.read_text(encoding="utf-8")
          debug_old = '      if (debugBox) debugBox.classList.add("active");'
          if leads.count(debug_old) != 2:
              raise SystemExit(f"Expected two debug-box activations, found {leads.count(debug_old)}")
          leads = leads.replace(debug_old, '      if (debugBox && isDebugMode()) debugBox.classList.add("active");')
          leads_path.write_text(leads, encoding="utf-8")

          replace_once(
              "web/public/classes/class-leads.js",
              '''      const isValid = validateLeadForm();
      submitButton.disabled = true;
      submitButton.textContent = isValid ? "Saving..." : "Opening class...";

      const lead = buildLead(card, course);
      try {
        saveStoredLead(lead);
        updateSignupLinksWithLead(lead);
      } catch (error) {
        writeDebug({ step: "localSaveError", message: error?.message || String(error) });
      }

      if (!isValid) {
        setStatus(status, "Opening the class information. Some contact details were not saved correctly.", true);
        window.setTimeout(() => openClassPage(course, "validation_fallback"), 500);
        return;
      }

      submitLead(data, lead, course);
''',
              '''      const isValid = validateLeadForm();
      if (!isValid) {
        setStatus(status, "Please correct the highlighted fields before opening the class brochure.", true);
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Saving...";

      const lead = buildLead(card, course);
      try {
        saveStoredLead(lead);
        updateSignupLinksWithLead(lead);
      } catch (error) {
        writeDebug({ step: "localSaveError", message: error?.message || String(error) });
      }

      submitLead(data, lead, course);
''',
          )
          replace_once(
              "web/public/classes/class-leads.js",
              '''  function updateSignupLinksWithLead(lead) {
    const signupUrl = `/classes/?class=${encodeURIComponent(lead.classSlug)}&leadId=${encodeURIComponent(lead.id)}`;
    document.querySelectorAll("a[href^='/signup'], a[href^='/classes/?class']").forEach((link) => {
      link.href = signupUrl;
    });
  }
''',
              '''  function updateSignupLinksWithLead(lead) {
    const signupUrl = `/signup/?class=${encodeURIComponent(lead.classSlug)}&leadId=${encodeURIComponent(lead.id)}`;
    document.querySelectorAll("a[href^='/signup']").forEach((link) => {
      link.href = signupUrl;
    });
  }
''',
          )

          # Old query-string brochure links must behave as detail pages, while the
          # plain /classes/ URL remains the lead form.
          replace_once(
              "web/public/classes/class-simple-flow.js",
              '''  function isFormPage() {
    var path = window.location.pathname.replace(/\\/+$/, "") || "/";
    return path === "/classes" || path === "/classes/index.html";
  }

  function isDetailPage() {
    return /^\\/classes\\/[^/]+\\/?$/.test(window.location.pathname);
  }
''',
              '''  function isOpenMode() {
    var url = new URL(window.location.href);
    return url.searchParams.get("open") === "1" || url.searchParams.get("view") === "details" || url.searchParams.get("details") === "1";
  }

  function isFormPage() {
    var path = window.location.pathname.replace(/\\/+$/, "") || "/";
    return (path === "/classes" || path === "/classes/index.html") && !isOpenMode();
  }

  function isDetailPage() {
    if (/^\\/classes\\/[^/]+\\/?$/.test(window.location.pathname)) return true;
    var path = window.location.pathname.replace(/\\/+$/, "") || "/";
    var url = new URL(window.location.href);
    var querySlug = url.searchParams.get("class") || url.searchParams.get("slug") || url.searchParams.get("level");
    return (path === "/classes" || path === "/classes/index.html") && isOpenMode() && Boolean(querySlug);
  }
''',
          )

          # Do not let the select filter rewrite the lead-form URL into a detail
          # URL before the visitor submits the form.
          replace_once(
              "web/public/classes/active-class-filter.js",
              '''    if (!requestedIsActive && activeClasses[0]) {
      const nextUrl = `/classes/${activeClasses[0].slug}/`;
      window.history.replaceState(null, "", nextUrl);
      select.dispatchEvent(new Event("change", { bubbles: true }));
      if (status && sourceIsLive) status.textContent = "";
    }
''',
              '''    if (!requestedIsActive && activeClasses[0]) {
      select.value = activeClasses[0].slug;
      select.dispatchEvent(new Event("change", { bubbles: true }));
      if (status && sourceIsLive) status.textContent = "";
    }
''',
          )

          # Remove the second, unconditional submit redirect. class-leads.js now
          # owns validation, saving and navigation.
          replace_once(
              "web/public/classes/class-hero-banner.js",
              '''  function redirectAfterLeadSubmit() {
    document.addEventListener("submit", function (event) {
      var form = event.target;
      if (!form || form.id !== "leadCaptureForm" || !isFormPage()) return;
      var select = form.querySelector("#leadClass");
      var slug = select && select.value ? select.value : selectedSlug();
      var status = document.getElementById("leadStatus");
      if (status) status.textContent = "Saved. Opening selected class information...";
      window.setTimeout(function () {
        window.location.assign("/classes/?class=" + encodeURIComponent(slug) + "&open=1");
      }, 500);
    }, true);
  }
''',
              '''  function redirectAfterLeadSubmit() {
    // class-leads.js owns validated saving and brochure navigation.
  }
''',
          )

          # Hide the reviews section when the external published sheet cannot be
          # reached instead of displaying a broken-state message to visitors.
          replace_once(
              "web/public/classes/brochure-footer-reviews.js",
              '''      .catch(() => {
        const grid = document.getElementById("studentReviewGrid");
        if (grid) grid.innerHTML = '<p class="student-review-empty">Student reviews could not load now. Please check again later.</p>';
      });
''',
              '''      .catch(() => {
        const card = document.getElementById("studentReviewsCard");
        if (card) card.remove();
      });
''',
          )

          # Force browsers to request the repaired scripts after deployment.
          index_path = Path("web/public/classes/index.html")
          index = index_path.read_text(encoding="utf-8")
          versions = {
              '/classes/class-template-loader.js?v=20260625-2': '/classes/class-template-loader.js?v=20260626-3',
              '/classes/class-hero-banner.js?v=20260615-1': '/classes/class-hero-banner.js?v=20260626-3',
              '/classes/brochure-footer-reviews.js?v=20260610-2': '/classes/brochure-footer-reviews.js?v=20260626-3',
              '/classes/class-leads.js?v=20260610-debug-1': '/classes/class-leads.js?v=20260626-3',
              '/classes/class-simple-flow.js?v=20260623-2': '/classes/class-simple-flow.js?v=20260626-3',
              '/classes/active-class-filter.js?v=20260623-4': '/classes/active-class-filter.js?v=20260626-3',
          }
          for old, new in versions.items():
              if old not in index:
                  raise SystemExit(f"Expected script version not found: {old}")
              index = index.replace(old, new, 1)
          index_path.write_text(index, encoding="utf-8")
          PY

          node --check web/public/classes/class-template-loader.js
          node --check web/public/classes/class-leads.js
          node --check web/public/classes/class-simple-flow.js
          node --check web/public/classes/active-class-filter.js
          node --check web/public/classes/class-hero-banner.js
          node --check web/public/classes/brochure-footer-reviews.js

          rm .github/workflows/fix-firebase-class-page-flow.yml

      - name: Commit and push fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/classes .github/workflows/fix-firebase-class-page-flow.yml
          git commit -m "Fix Firebase class brochure and lead flow"
          git push
