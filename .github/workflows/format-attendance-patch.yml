name: Format attendance patch

on:
  push:
    branches:
      - fix/attendance-false-duplicate-checkin

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[attendance-format]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/attendance-false-duplicate-checkin
      - name: Format attendance block
        shell: python
        run: |
          from pathlib import Path
          path = Path("functions/functionz/app.js")
          text = path.read_text(encoding="utf-8")
          old = '''      const existingAttendance = attendance[studentCode];
const existingAttendanceStatus = String(
  existingAttendance?.status || existingAttendance?.attendance || ""
).toLowerCase();
const alreadyPresent =
  existingAttendance === true ||
  existingAttendance?.present === true ||
  existingAttendance?.attended === true ||
  existingAttendanceStatus === "present" ||
  existingAttendanceStatus === "late";
if (alreadyPresent) return { duplicate: true };'''
          new = '''      const existingAttendance = attendance[studentCode];
      const existingAttendanceStatus = String(
        existingAttendance?.status || existingAttendance?.attendance || ""
      ).toLowerCase();
      const alreadyPresent =
        existingAttendance === true ||
        existingAttendance?.present === true ||
        existingAttendance?.attended === true ||
        existingAttendanceStatus === "present" ||
        existingAttendanceStatus === "late";
      if (alreadyPresent) return { duplicate: true };'''
          if old not in text:
            raise SystemExit("Expected unformatted attendance block was not found.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Validate and commit
        run: |
          node --check functions/functionz/app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/functionz/app.js
          git commit -m "Format attendance duplicate check [attendance-format]"
          git push origin HEAD:fix/attendance-false-duplicate-checkin

# Temporary workflow used only to keep the final attendance fix diff clean.
