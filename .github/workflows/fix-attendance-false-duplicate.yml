name: Apply attendance false-duplicate fix

on:
  push:
    branches:
      - fix/attendance-false-duplicate-checkin

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[attendance-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/attendance-false-duplicate-checkin

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch duplicate attendance detection
        shell: python
        run: |
          from pathlib import Path

          path = Path("functions/functionz/app.js")
          text = path.read_text(encoding="utf-8")
          old = '      if (attendance[studentCode]) return { duplicate: true };'
          new = '''      const existingAttendance = attendance[studentCode];
          const existingAttendanceStatus = String(
            existingAttendance?.status || existingAttendance?.attendance || ""
          ).toLowerCase();
          const alreadyPresent =
            existingAttendance === true ||
            existingAttendance?.present === true ||
            existingAttendance?.attended === true ||
            existingAttendanceStatus === "present" ||
            existingAttendanceStatus === "late";
          if (alreadyPresent) return { duplicate: true };'''

          if old not in text:
            raise SystemExit("Expected attendance duplicate line was not found; refusing to patch.")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Install Functions dependencies without changing lockfile
        working-directory: functions
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Run attendance regression tests
        working-directory: functions
        run: npx jest functionz/tests/attendance.checkin.test.js --runInBand

      - name: Commit backend fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/functionz/app.js
          git commit -m "Fix false attendance duplicate detection [attendance-patch]"
          git push origin HEAD:fix/attendance-false-duplicate-checkin
