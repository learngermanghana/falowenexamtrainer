name: Exams Room Schreiben workspace

on:
  pull_request:
    paths:
      - "web/src/components/ExamWritingWorkspace*"
      - "web/src/components/ExamsRoomWritingFlow.test.js"
      - "web/src/data/examWritingWorkspace*"
      - "web/src/App.js"
      - "web/src/components/ExamRoom.js"
      - ".github/workflows/exam-writing-workspace.yml"
  push:
    branches: [main]
    paths:
      - "web/src/components/ExamWritingWorkspace*"
      - "web/src/components/ExamsRoomWritingFlow.test.js"
      - "web/src/data/examWritingWorkspace*"
      - "web/src/App.js"
      - "web/src/components/ExamRoom.js"
      - ".github/workflows/exam-writing-workspace.yml"

permissions:
  contents: read

jobs:
  writing-workspace-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm install --legacy-peer-deps --no-audit --no-fund --loglevel=error
      - name: Verify writing parts, form grading, drafts and AI/tutor integration
        working-directory: web
        env:
          CI: true
        run: >-
          npx jest --runInBand --runTestsByPath
          src/data/examWritingWorkspace.test.js
          src/components/ExamWritingWorkspace.test.jsx
          src/components/ExamsRoomWritingFlow.test.js
