name: Exams Room Schreiben workspace

on:
  pull_request:
    paths:
      - "web/src/components/ExamWritingWorkspace*"
      - "web/src/components/ExamsRoomWritingFlow.test.js"
      - "web/src/data/examWritingWorkspace*"
      - "web/src/data/c1ExamDiscussionTasks.js"
      - "web/src/data/c1ExamFormalEmailTasks.js"
      - "web/src/data/c1FormalEmailTemplate.js"
      - "web/src/data/c1ApprovedOpinionEssayTemplate.js"
      - "web/src/data/c1WritingTemplatesAndTasks.test.js"
      - "web/src/data/writingCheatSheets.js"
      - "web/src/components/WritingCheatSheetTabs.js"
      - "web/src/components/WritingCheatSheetTabs.c1Template.test.js"
      - "web/src/data/c1Day9ApprovedTextboxTemplate.test.js"
      - "web/src/data/examWritingEnglishCopy.js"
      - "functions/data/assessmentTasks.json"
      - "functions/functionz/tests/assessmentTaskContext.test.js"
      - "scripts/generateAssessmentTaskRegistry.mjs"
      - "web/src/App.js"
      - "web/src/components/ExamRoom.js"
      - ".github/workflows/exam-writing-workspace.yml"
  push:
    branches: [main]
    paths:
      - "web/src/components/ExamWritingWorkspace*"
      - "web/src/components/ExamsRoomWritingFlow.test.js"
      - "web/src/data/examWritingWorkspace*"
      - "web/src/data/c1ExamDiscussionTasks.js"
      - "web/src/data/c1ExamFormalEmailTasks.js"
      - "web/src/data/c1FormalEmailTemplate.js"
      - "web/src/data/c1ApprovedOpinionEssayTemplate.js"
      - "web/src/data/c1WritingTemplatesAndTasks.test.js"
      - "web/src/data/writingCheatSheets.js"
      - "web/src/components/WritingCheatSheetTabs.js"
      - "web/src/components/WritingCheatSheetTabs.c1Template.test.js"
      - "web/src/data/c1Day9ApprovedTextboxTemplate.test.js"
      - "web/src/data/examWritingEnglishCopy.js"
      - "functions/data/assessmentTasks.json"
      - "functions/functionz/tests/assessmentTaskContext.test.js"
      - "scripts/generateAssessmentTaskRegistry.mjs"
      - "web/src/App.js"
      - "web/src/components/ExamRoom.js"
      - ".github/workflows/exam-writing-workspace.yml"

permissions:
  contents: read

jobs:
  writing-workspace-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm install --legacy-peer-deps --no-audit --no-fund --loglevel=error
      - name: Validate generated AI assessment registry matches all Schreibtraining tasks
        run: node scripts/generateAssessmentTaskRegistry.mjs --check
      - name: Verify writing parts, form grading, drafts and AI/tutor integration
        working-directory: web
        env:
          CI: true
        run: >-
          npx jest --runInBand --runTestsByPath
          src/data/examWritingWorkspace.test.js
          src/data/c1WritingTemplatesAndTasks.test.js
          src/data/c1Day9ApprovedTextboxTemplate.test.js
          src/components/WritingCheatSheetTabs.c1Template.test.js
          src/components/ExamWritingWorkspace.test.jsx
          src/components/ExamsRoomWritingFlow.test.js

  backend-writing-lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install backend test dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund --loglevel=error
      - name: Verify backend accepts each registered Schreiben task and rejects stale ones
        working-directory: functions
        env:
          CI: true
        run: npx jest --runInBand --runTestsByPath functionz/tests/assessmentTaskContext.test.js
