name: A2 B1 navigation diagnostic

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/a2-b1-navigation-diagnostic.yml"

permissions:
  contents: read

jobs:
  test-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm install --legacy-peer-deps --no-audit --no-fund --loglevel=error

      - name: Run A2 and B1 navigation tests
        working-directory: web
        env:
          CI: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:ci -- --runTestsByPath src/components/A2B1CourseBook.test.js 2>&1 | tee /tmp/a2-b1-navigation.log

      - name: Upload navigation details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-b1-navigation-diagnostic
          path: /tmp/a2-b1-navigation.log
