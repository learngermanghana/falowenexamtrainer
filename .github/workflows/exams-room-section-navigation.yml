      - 'web/src/data/b1FinalMockData.js'
      - 'web/src/components/A1ReadingPracticeSamples.jsx'
      - 'web/src/components/A2ReadingPracticeSamples.jsx'
      - 'web/src/components/WritingPage.js'
      - 'web/src/components/ExamsOverviewPage.js'
      - 'web/src/components/ExamsOverviewPage.css'
      - 'web/src/components/ExamsOverviewPage.test.jsx'
      - 'web/src/components/ExamRoomSectionNavigation.test.js'
      - '.github/workflows/exams-room-section-navigation.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Overview, level access and navigation regression
        run: npx jest --runInBand --runTestsByPath src/components/ExamRoomSectionNavigation.test.js src/components/ExamsOverviewPage.test.jsx src/components/ExamRoomLowerLevelNavigation.test.js src/context/ExamContext.levelSwitching.test.jsx src/utils/examLevelAccess.test.js src/data/examResourcesRemoval.test.js
      - name: B1 Lesen and Hören practice regression
        run: npx jest --runInBand --runTestsByPath src/data/b1ReadingPracticeSamples.test.js src/components/B1ExamRoomNavigation.test.js
      - name: B1 four-module mock guidance and recovery regression
        run: npx jest --runInBand --runTestsByPath src/utils/b1MockProgress.test.js src/components/B1FinalMockExamPage.test.jsx src/components/B1FinalMockTimeout.test.jsx src/components/B1FinalMockSpeakingTimeout.test.jsx
      - name: A1-C2 mock completion and availability regression
        run: npx jest --runInBand --runTestsByPath src/utils/fullMockProgress.test.js
      - name: Recoverable mock Schreiben error regression
        run: npx jest --runInBand --runTestsByPath src/services/mockWritingSubmissionError.test.js
      - name: Direct web compile
        run: npx vite build
