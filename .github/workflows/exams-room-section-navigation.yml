name: Exams Room Section Navigation

on:
  pull_request:
    paths:
      - 'web/src/App.js'
      - 'web/src/components/LesenPage.js'
      - 'web/src/components/HorenPage.js'
      - 'web/src/components/ListeningPracticeSamplePage.jsx'
      - 'web/src/components/B1FinalMockExamPage.jsx'
      - 'web/src/components/B1FinalMockExamPage.css'
      - 'web/src/components/MockExamLibraryPage.js'
      - 'web/src/utils/b1MockProgress.js'
      - 'web/src/utils/b1MockProgress.test.js'
      - 'web/src/components/B1ReadingPracticeSamples.jsx'
      - 'web/src/components/B1ExamRoomNavigation.test.js'
      - 'web/src/data/b1ReadingPracticeSamples.js'
      - 'web/src/data/b1ReadingPracticeSamples.test.js'
      - 'web/src/data/b1FinalMockData.js'
      - 'web/src/components/A1ReadingPracticeSamples.jsx'
      - 'web/src/components/A2ReadingPracticeSamples.jsx'
      - 'web/src/components/ExamsOverviewPage.js'
      - 'web/src/components/ExamRoomSectionNavigation.test.js'
      - '.github/workflows/exams-room-section-navigation.yml'
  push:
    branches:
      - main
    paths:
      - 'web/src/App.js'
      - 'web/src/components/LesenPage.js'
      - 'web/src/components/HorenPage.js'
      - 'web/src/components/ListeningPracticeSamplePage.jsx'
      - 'web/src/components/B1FinalMockExamPage.jsx'
      - 'web/src/components/B1FinalMockExamPage.css'
      - 'web/src/components/MockExamLibraryPage.js'
      - 'web/src/utils/b1MockProgress.js'
      - 'web/src/utils/b1MockProgress.test.js'
      - 'web/src/components/B1ReadingPracticeSamples.jsx'
      - 'web/src/components/B1ExamRoomNavigation.test.js'
      - 'web/src/data/b1ReadingPracticeSamples.js'
      - 'web/src/data/b1ReadingPracticeSamples.test.js'
      - 'web/src/data/b1FinalMockData.js'
      - 'web/src/components/A1ReadingPracticeSamples.jsx'
      - 'web/src/components/A2ReadingPracticeSamples.jsx'
      - 'web/src/components/ExamsOverviewPage.js'
      - 'web/src/components/ExamRoomSectionNavigation.test.js'
      - '.github/workflows/exams-room-section-navigation.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Navigation regression
        run: npx jest --runInBand --runTestsByPath src/components/ExamRoomSectionNavigation.test.js
      - name: B1 Lesen and Hören practice regression
        run: npx jest --runInBand --runTestsByPath src/data/b1ReadingPracticeSamples.test.js src/components/B1ExamRoomNavigation.test.js
      - name: B1 four-module mock guidance and recovery regression
        run: npx jest --runInBand --runTestsByPath src/utils/b1MockProgress.test.js
      - name: Direct web compile
        run: npx vite build
