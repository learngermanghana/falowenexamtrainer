name: Patch A1 hub source path

on:
  push:
    branches:
      - fix/a1-day2-hub-and-media

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/a1-day2-hub-and-media
          fetch-depth: 0
      - name: Restore the component source assertion path
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's#../utils/a1ChapterResourceHubState.jsx#../components/A1ChapterResourceHubRoute.jsx#' web/src/data/inAppWorkbookRoutes.a1LessonLinks.test.js
          if git diff --quiet; then
            echo "Source path already correct."
            exit 0
          fi
          git config user.name "falowen-ci"
          git config user.email "actions@users.noreply.github.com"
          git add web/src/data/inAppWorkbookRoutes.a1LessonLinks.test.js
          git commit -m "Restore A1 hub component source assertion"
          git push origin HEAD:fix/a1-day2-hub-and-media
