name: Verify Cloud Run cost guards

on:
  pull_request:
    paths:
      - 'functions/**'
      - '.github/workflows/cloud-cost-guards.yml'
  workflow_dispatch:

jobs:
  cloud-cost-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions --no-audit --no-fund
      - run: node --check functions/index.js && node --check functions/classPushLifecycle.js
      - run: node --check functions/studentSheetSyncDiff.js && node --check functions/classSessionReminderQueries.js
      - run: node --test functions/__tests__/studentSheetSyncDiff.test.cjs functions/__tests__/classSessionReminderQueries.test.cjs
