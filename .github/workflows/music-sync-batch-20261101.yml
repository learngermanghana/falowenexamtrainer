name: One-time Falowen music CPU sync batch

on:
  pull_request:
    paths:
      - "scripts/run_falowen_music_sync_batch.py"
      - "scripts/align_falowen_music.py"
      - ".github/workflows/music-sync-batch-20261101.yml"

permissions:
  contents: write

jobs:
  align-live-public-recordings:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout proposed branch (not main)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline Whisper dependency (runner CPU only)
        run: python -m pip install --disable-pip-version-check faster-whisper==1.2.1
      - name: Run locally on existing Falowen public MP3s
        id: align
        continue-on-error: true
        run: python -u scripts/run_falowen_music_sync_batch.py
      - name: Upload candidate timing audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: falowen-music-alignment-reports
          path: docs/music-timing-candidates/*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Commit candidate reports only (no production publishing)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/music-timing-candidates/*.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Record actual Whisper timing candidates from public Falowen MP3s"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - name: Fail if audio alignment did not finish
        if: steps.align.outcome != 'success'
        run: exit 1
