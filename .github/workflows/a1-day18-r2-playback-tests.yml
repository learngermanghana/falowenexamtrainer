name: A1 Day 18 protected R2 playback tests
on:
  pull_request:
    paths:
      - "functions/functionz/r2CourseAudio.js"
      - "functions/functionz/__tests__/r2CourseAudio.test.js"
      - "functions/functionz/tests/a1Day18Audio.routes.test.js"
      - ".github/workflows/a1-day18-r2-playback-tests.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm install --legacy-peer-deps --no-audit --no-fund --loglevel=error
        working-directory: functions
      - run: npx jest --runInBand functionz/__tests__/r2CourseAudio.test.js functionz/tests/a1Day18Audio.routes.test.js
        working-directory: functions
        env:
          CI: true
