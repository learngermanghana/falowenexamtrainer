name: A1–B1 Firestore Submission Access

on:
  pull_request:
    paths:
      - "firestore.rules"
      - "tests/firestore-submission-lock.test.cjs"
      - ".github/workflows/firestore-submission-access.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-scoped-submissions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install emulator and rules test dependencies
        run: npm install --no-save --no-package-lock firebase@11.10.0 @firebase/rules-unit-testing@4.0.1 firebase-tools@14.25.1
      - name: Test A1, A2 and B1 student submissions against actual rules
        run: npx firebase emulators:exec --project demo-falowen-locks --only firestore "node --test tests/firestore-submission-lock.test.cjs"
