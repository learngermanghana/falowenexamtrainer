name: A1 Day 20 Falowen Radio

on:
  pull_request:
    paths:
      - "scripts/patchA1Day20LetterGuidance.mjs"
      - "web/package.json"
      - "web/src/components/LetterWritingIntroPage.js"
      - "web/src/components/A1Day20LetterGuidance.test.js"
      - "web/src/data/a1RadioResources.js"
      - "web/src/data/a1Day20FalowenRadio.test.js"
      - ".github/workflows/a1-day20-falowen-radio.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Apply simplified A1 letter guidance
        run: node scripts/patchA1Day20LetterGuidance.mjs
      - name: Test the A1 Day 20 Radio and writing guidance
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/data/a1Day20FalowenRadio.test.js src/components/A1Day20LetterGuidance.test.js
      - name: Build production web app
        working-directory: web
        run: npm run build
