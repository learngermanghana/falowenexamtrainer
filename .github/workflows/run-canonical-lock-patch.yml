name: Run course book task patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'fix/course-book-task-cards-submit-tabs'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/course-book-task-cards-submit-tabs
          fetch-depth: 0

      - name: Extract and apply patch
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-course-book-task-split.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          script_lines = []
          for line in workflow[start:end]:
              script_lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply_patch.py').write_text('\n'.join(script_lines) + '\n')
          PY
          set +e
          python /tmp/apply_patch.py > /tmp/course-book-patch.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/course-book-patch.log .course-book-patch-error.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .course-book-patch-error.log
            git commit -m "Record course book patch error"
            git push origin HEAD:fix/course-book-task-cards-submit-tabs
            exit "$status"
          fi
          rm -f .course-book-patch-trigger .course-book-patch-error.log

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Split course book task cards and standardize submit tabs"
          git push origin HEAD:fix/course-book-task-cards-submit-tabs

      - name: Run focused tests
        working-directory: web
        run: |
          npm ci
          CI=true npm test -- --watchAll=false --runInBand src/utils/courseBookEntries.test.js src/components/CourseLessonInlineSubmission.test.js
