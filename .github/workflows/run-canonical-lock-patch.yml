name: Run canonical lock patch

on:
  push:
    branches:
      - fix/canonical-assignment-locks

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canonical-assignment-locks
          fetch-depth: 0

      - name: Extract and apply patch
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-canonical-assignment-lock-patch.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          script_lines = []
          for line in workflow[start:end]:
              script_lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply_patch.py').write_text('\n'.join(script_lines) + '\n')
          PY
          python /tmp/apply_patch.py

      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo "Patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/components/AssignmentSubmissionPage.js web/src/components/CourseWorkbookSubmissionTabs.js
          git commit -m "Use canonical assignment IDs for submission locks"
          git push origin HEAD:fix/canonical-assignment-locks
