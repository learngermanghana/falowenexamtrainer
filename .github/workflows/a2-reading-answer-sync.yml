name: A2 Lesen answer sync

on:
  pull_request:
    paths:
      - "web/src/components/A2Day*WorkbookPage.js"
      - "functions/data/answerKeyManifest.json"
      - "scripts/auditA2ReadingAnswerSync.mjs"
      - ".github/workflows/a2-reading-answer-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a2-reading-answer-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Falowen ↔ GitHub answer manifest
        run: node scripts/auditA2ReadingAnswerSync.mjs
