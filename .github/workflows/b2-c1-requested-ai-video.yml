name: B2 C1 requested AI videos

on:
  pull_request:
    paths:
      - "web/src/data/b2C1LessonMediaOverrides.js"
      - "web/src/data/requestedLessonMediaMappings.test.js"
      - "web/src/data/lessonModel.js"
      - "web/src/data/lessonVideoDictionary.js"
      - "web/src/data/additionalLessonVideoResources.js"
      - "web/src/data/courseSchedule.js"
      - "web/src/components/B2Day7To16GuidedLessonPage.js"
      - "web/src/components/C1Day12To14GuidedLessonPage.js"
      - ".github/workflows/b2-c1-requested-ai-video.yml"

jobs:
  requested-ai-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Test requested B2 and C1 AI video ownership
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/data/requestedLessonMediaMappings.test.js
