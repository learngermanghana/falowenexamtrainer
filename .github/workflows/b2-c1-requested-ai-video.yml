name: B2 C1 requested AI videos

on:
  pull_request:
    paths:
      - "web/src/data/b2C1LessonMediaOverrides.js"
      - "web/src/data/requestedLessonMediaMappings.test.js"
      - "web/src/data/b2Day13To15RequestedAiVideos.test.js"
      - "web/src/data/b2Day16Day17AiVideos.test.js"
      - "web/src/data/b2Day11FalowenRadio.test.js"
      - "web/src/data/b2MediaReset.test.js"
      - "web/src/data/lessonRadioDictionary.js"
      - "web/src/data/lessonRadioDictionary.test.js"
      - "web/src/data/selfLearningLessons/b2/**"
      - "shared/curriculumCanonical.json"
      - "web/src/data/lessonCatalog.js"
      - "web/src/data/lessonModel.js"
      - "web/src/data/lessonVideoDictionary.js"
      - "web/src/data/additionalLessonVideoResources.js"
      - "web/src/data/courseSchedule.js"
      - "web/src/components/B2Day7To16GuidedLessonPage.js"
      - "web/src/components/C1Day12To14GuidedLessonPage.js"
      - ".github/workflows/b2-c1-requested-ai-video.yml"

jobs:
  requested-ai-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Test B2 media reset and remaining media ownership
        working-directory: web
        env:
          CI: true
        run: >-
          npx jest --runInBand --runTestsByPath
          src/data/b2MediaReset.test.js
          src/data/requestedLessonMediaMappings.test.js
          src/data/b2Day13To15RequestedAiVideos.test.js
          src/data/b2Day16Day17AiVideos.test.js
          src/data/b2Day11FalowenRadio.test.js
          src/data/lessonRadioDictionary.test.js
      - name: Build production web app
        working-directory: web
        run: npm run build
