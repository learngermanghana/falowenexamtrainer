name: A2 private one-time PDF proof
# Run 2: bypass A2 radio introduction in print-only export.

on:
  push:
    branches:
      - fix/a2-pdf-retail-preflight-20261025
    paths:
      - .github/workflows/a2-private-proof-once.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-a2-privately:
    name: Render and validate A2 only
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout A2 print branch
        uses: actions/checkout@v4
      - name: Verify A2 source revision
        run: git log -1 --oneline
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build A2 manifest
        run: |
          node scripts/course-material-bundles/buildLevelManifest.mjs A2
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const manifest = JSON.parse(fs.readFileSync("artifacts/course-material-bundles/A2/Falowen-A2-Course-Materials-manifest.json","utf8"));
          if (!manifest.readyForPdfGeneration || manifest.firstDay!==0 || manifest.lastDay!==28 || manifest.lessonCount!==29) {
            throw new Error("A2 manuscript manifest failed readiness/coverage gate.");
          }
          console.log("A2 printable lessons: "+manifest.printableLessonCount);
          NODE
      - name: Install PDF runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.54.2 pdf-lib@1.17.1 qrcode@1.5.4
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
      - name: Run A2 privacy and print tests
        run: |
          node --test scripts/course-material-bundles/a2PdfPrint.test.mjs
          node --test scripts/course-material-bundles/renderLevelBundleV2.test.mjs
      - name: Render A2 commercial review candidate locally on runner
        env:
          FALOWEN_PDF_BASE_URL: https://www.falowen.app
          FALOWEN_PDF_EMAIL: ${{ secrets.FALOWEN_PDF_EMAIL }}
          FALOWEN_PDF_PASSWORD: ${{ secrets.FALOWEN_PDF_PASSWORD }}
          FALOWEN_PDF_AUTH_STATE_B64: ${{ secrets.FALOWEN_PDF_AUTH_STATE_B64 }}
        run: node scripts/course-material-bundles/renderLevelBundleV2.mjs A2
      - name: Validate complete A2 before generating sample
        run: |
          node scripts/course-material-bundles/validateGeneratedBundle.mjs A2
          pdfinfo artifacts/course-material-bundles/A2/Falowen-A2-Course-Materials.pdf | grep -E "^(Pages|Page size|File size):"
      - name: Prepare only public A2 Day 1 sample
        run: node scripts/course-material-bundles/prepareA2Sample.mjs
      - name: Upload free A2 sample only
        uses: actions/upload-artifact@v4
        with:
          name: Falowen-A2-Free-Day1-Sample-proof
          path: artifacts/course-material-bundles/A2/Falowen-A2-Free-Day1-Sample.pdf
          if-no-files-found: error
          retention-days: 7
      - name: Upload render failure diagnostics only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Falowen-A2-Private-Proof-Diagnostics
          path: artifacts/course-material-bundles/A2/render-diagnostics.json
          if-no-files-found: ignore
          retention-days: 7
