name: Patch A1 12.1 bilingual grammar notes

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "scripts/tempImproveA1121Grammar.py"
      - ".github/workflows/temp-improve-a1-121-grammar-pr.yml"
      - "web/src/components/TwoCasePrepositionsPageLegacy.js"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply content patch
        run: python scripts/tempImproveA1121Grammar.py
      - name: Test and build
        working-directory: web
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund --loglevel=error
          CI=true npm run test:ci -- --runTestsByPath src/components/TwoCasePrepositionsPageLegacy.content.test.js src/components/TwoCasePrepositionsPage.test.js
          npm run build
      - name: Commit content change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/components/TwoCasePrepositionsPageLegacy.js web/src/components/TwoCasePrepositionsPageLegacy.content.test.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Improve A1 12.1 bilingual grammar notes"
          git push origin HEAD:${{ github.head_ref }}
