name: Course material bundle

on:
  pull_request:
    paths:
      - ".github/workflows/course-material-bundle.yml"
      - "scripts/course-material-bundles/**"
      - "shared/curriculumCanonical.json"
  workflow_dispatch:
    inputs:
      level:
        description: Course level to prepare
        required: true
        type: choice
        options:
          - A1
          - A2
          - B1
          - B2
          - C1
      build_pdf:
        description: Render and merge the complete level PDF
        required: true
        type: boolean
        default: true
      press_preview:
        description: Also create a Falowen Press editorial proof (NOT for sale)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: course-material-bundle-${{ github.event_name }}-${{ github.ref }}-${{ inputs.level || 'validation' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-manifests:
    name: Validate ${{ matrix.level }} manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - level: A1
            first_day: 0
            last_day: 23
            lesson_count: 24
          - level: A2
            first_day: 0
            last_day: 28
            lesson_count: 29
          - level: B1
            first_day: 0
            last_day: 28
            lesson_count: 29
          - level: B2
            first_day: 0
            last_day: 28
            lesson_count: 29
          - level: C1
            first_day: 0
            last_day: 28
            lesson_count: 29

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate bundle renderer auth guard
        run: |
          node --check scripts/course-material-bundles/renderLevelBundleV2.mjs
          node --check scripts/course-material-bundles/renderA1Bundle.mjs
          node --check scripts/course-material-bundles/a1RetailCover.mjs
          node --check scripts/course-material-bundles/a2RetailCover.mjs
          node --check scripts/course-material-bundles/a2PdfPrint.mjs
          node --check scripts/course-material-bundles/prepareA2Sample.mjs
          node --check scripts/course-material-bundles/a1PdfAuthState.mjs
          node --test scripts/course-material-bundles/a1PdfAuthState.test.mjs
          node --check scripts/course-material-bundles/pdfNavigation.mjs
          node --check scripts/course-material-bundles/validateGeneratedBundle.mjs
          node --check scripts/course-material-bundles/validateA1RenderPlan.mjs
          node --check scripts/course-material-bundles/buildPressProof.mjs
          node --check scripts/course-material-bundles/a1PrintHelpers.mjs
          node --check scripts/course-material-bundles/pdfPageAudit.mjs
          node --check scripts/course-material-bundles/a1PdfContentReadiness.mjs
          node --check scripts/course-material-bundles/a1PdfPrintExtras.mjs
          node --check scripts/course-material-bundles/a1PdfPrivacy.mjs
          node --check scripts/course-material-bundles/a1PdfPrintChrome.mjs
          node --test scripts/course-material-bundles/a1PdfPrivacy.test.mjs
          node --test scripts/course-material-bundles/a1PdfPrintChrome.test.mjs
          node --test scripts/course-material-bundles/a1PdfPrivacy.review.test.mjs
          node --test scripts/course-material-bundles/a1PdfContentReadiness.test.mjs
          node --check scripts/course-material-bundles/trimPrintedPdfTail.mjs
          node --check scripts/course-material-bundles/renderA1Bundle.mjs
          node --check scripts/course-material-bundles/runA1BundleCleanPdf.mjs
          node --test scripts/course-material-bundles/a1PrintHelpers.test.mjs
          node --test scripts/course-material-bundles/renderLevelBundleV2.test.mjs
          if [ "${{ matrix.level }}" = "A1" ]; then node --test scripts/course-material-bundles/validateA1RenderPlan.test.mjs; fi

      - name: Runtime-test PDF navigation and print safety
        if: ${{ matrix.level == 'A1' || matrix.level == 'A2' }}
        run: |
          if ! command -v pdftotext >/dev/null || ! command -v pdftoppm >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
          npm install --no-save --package-lock=false pdf-lib@1.17.1
          if [ "${{ matrix.level }}" = "A1" ]; then
            node --test scripts/course-material-bundles/a1RetailCover.test.mjs
            node --test scripts/course-material-bundles/pdfNavigation.test.mjs
            node --test scripts/course-material-bundles/buildPressProof.test.mjs
            node --test scripts/course-material-bundles/trimPrintedPdfTail.test.mjs
          fi
          if [ "${{ matrix.level }}" = "A2" ]; then
            node --test scripts/course-material-bundles/a2PdfPrint.test.mjs
            node --test scripts/course-material-bundles/a2EditorialPrintMode.test.mjs
          fi

      - name: Build and validate manifest
        env:
          LEVEL: ${{ matrix.level }}
          EXPECTED_FIRST_DAY: ${{ matrix.first_day }}
          EXPECTED_LAST_DAY: ${{ matrix.last_day }}
          EXPECTED_LESSON_COUNT: ${{ matrix.lesson_count }}
        run: |
          node scripts/course-material-bundles/buildLevelManifest.mjs "$LEVEL"
          if [ "$LEVEL" = "A1" ]; then node scripts/course-material-bundles/validateA1RenderPlan.mjs; fi
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const level = process.env.LEVEL;
          const file = `artifacts/course-material-bundles/${level}/Falowen-${level}-Course-Materials-manifest.json`;
          const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
          const expectedFirstDay = Number(process.env.EXPECTED_FIRST_DAY);
          const expectedLastDay = Number(process.env.EXPECTED_LAST_DAY);
          const expectedLessonCount = Number(process.env.EXPECTED_LESSON_COUNT);
          if (manifest.schemaVersion !== 3) throw new Error(`Expected schemaVersion 3, received ${manifest.schemaVersion}.`);
          if (manifest.firstDay !== expectedFirstDay || manifest.lastDay !== expectedLastDay) {
            throw new Error(
              `Expected ${level} curriculum boundaries ${expectedFirstDay}-${expectedLastDay}, received ${manifest.firstDay}-${manifest.lastDay}.`,
            );
          }
          if (manifest.lessonCount !== expectedLessonCount) {
            throw new Error(`Expected ${expectedLessonCount} ${level} lessons, received ${manifest.lessonCount}.`);
          }
          if (!manifest.curriculumComplete) throw new Error(`Missing curriculum days: ${manifest.missingDays.join(", ")}.`);
          if (!manifest.routesClassified) throw new Error(`${manifest.unresolvedLessonCount} printable routes need classification.`);
          if (!manifest.readyForPdfGeneration) throw new Error(`${level} is not ready for PDF generation.`);
          console.log(`${level}: ${manifest.printableLessonCount} printable lessons are ready.`);
          NODE

  build-bundle:
    name: Build ${{ inputs.level }} course material bundle
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-manifests
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show checked-out revision
        run: |
          echo "Workflow ref: $GITHUB_REF"
          echo "Commit SHA: $GITHUB_SHA"
          git log -1 --oneline

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build ordered level manifest
        run: |
          node scripts/course-material-bundles/buildLevelManifest.mjs "${{ inputs.level }}"
          if [ "${{ inputs.level }}" = "A1" ]; then node scripts/course-material-bundles/validateA1RenderPlan.mjs; fi

      - name: Validate and show manifest summary
        run: |
          node -e '
            const fs = require("fs");
            const level = process.env.LEVEL;
            const file = `artifacts/course-material-bundles/${level}/Falowen-${level}-Course-Materials-manifest.json`;
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
            if (manifest.schemaVersion !== 3) {
              throw new Error(`Outdated manifest schema ${manifest.schemaVersion}; expected schemaVersion 3.`);
            }
            console.log(`${manifest.level}: ${manifest.lessonCount} curriculum entries`);
            console.log(`Printable lessons: ${manifest.printableLessonCount}`);
            console.log(`Excluded lessons: ${manifest.excludedLessonCount}`);
            console.log(`Missing days: ${manifest.missingDays.length ? manifest.missingDays.join(", ") : "none"}`);
            console.log(`Unresolved printable routes: ${manifest.unresolvedLessonCount}`);
            console.log(`Curriculum complete: ${manifest.curriculumComplete}`);
            console.log(`Routes classified: ${manifest.routesClassified}`);
            console.log(`Ready for PDF generation: ${manifest.readyForPdfGeneration}`);
            if (process.env.BUILD_PDF === "true" && !manifest.readyForPdfGeneration) {
              throw new Error(`${level} is not ready for consolidated PDF generation.`);
            }
          '
        env:
          LEVEL: ${{ inputs.level }}
          BUILD_PDF: ${{ inputs.build_pdf }}

      - name: Upload administration manifest
        uses: actions/upload-artifact@v4
        with:
          name: Falowen-${{ inputs.level }}-course-material-manifest
          path: artifacts/course-material-bundles/${{ inputs.level }}/Falowen-${{ inputs.level }}-Course-Materials-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Install PDF rendering dependencies
        if: ${{ inputs.build_pdf }}
        run: npm install --no-save --package-lock=false playwright@1.54.2 pdf-lib@1.17.1 qrcode@1.5.4

      - name: Install Chromium
        if: ${{ inputs.build_pdf }}
        run: npx playwright install --with-deps chromium

      - name: Install PDF text validator
        if: ${{ inputs.build_pdf && (inputs.level == 'A1' || inputs.level == 'A2' || inputs.level == 'B1') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Render and merge course materials
        if: ${{ inputs.build_pdf }}
        run: |
          if [ "${{ inputs.level }}" = "A1" ]; then
            node scripts/course-material-bundles/runA1BundleCleanPdf.mjs
          else
            node scripts/course-material-bundles/renderLevelBundleV2.mjs "${{ inputs.level }}"
          fi
        env:
          FALOWEN_PDF_BASE_URL: https://www.falowen.app
          FALOWEN_PDF_EMAIL: ${{ secrets.FALOWEN_PDF_EMAIL }}
          FALOWEN_PDF_PASSWORD: ${{ secrets.FALOWEN_PDF_PASSWORD }}
          FALOWEN_PDF_AUTH_STATE_B64: ${{ secrets.FALOWEN_PDF_AUTH_STATE_B64 }}

      - name: Validate generated A1-B1 PDF
        if: ${{ inputs.build_pdf && (inputs.level == 'A1' || inputs.level == 'A2' || inputs.level == 'B1') }}
        run: node scripts/course-material-bundles/validateGeneratedBundle.mjs "${{ inputs.level }}"

      - name: Create free A2 PDF sample from the validated retail candidate
        if: ${{ inputs.build_pdf && inputs.level == 'A2' }}
        run: node scripts/course-material-bundles/prepareA2Sample.mjs

      # Public repositories must not distribute the full A2 retail manuscript.
      - name: Upload A2 sample only
        if: ${{ inputs.build_pdf && inputs.level == 'A2' }}
        uses: actions/upload-artifact@v4
        with:
          name: Falowen-A2-Free-Day1-Sample
          path: artifacts/course-material-bundles/A2/Falowen-A2-Free-Day1-Sample.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Upload consolidated level PDF (excluding paid A2 manuscript)
        if: ${{ inputs.build_pdf && inputs.level != 'A2' }}
        uses: actions/upload-artifact@v4
        with:
          name: Falowen-${{ inputs.level }}-course-materials-pdf
          path: artifacts/course-material-bundles/${{ inputs.level }}/Falowen-${{ inputs.level }}-Course-Materials.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Build Falowen Press editorial proof
        if: ${{ inputs.build_pdf && inputs.press_preview && inputs.level != 'A2' }}
        run: node scripts/course-material-bundles/buildPressProof.mjs "${{ inputs.level }}"

      - name: Upload Falowen Press editorial proof
        if: ${{ inputs.build_pdf && inputs.press_preview && inputs.level != 'A2' }}
        uses: actions/upload-artifact@v4
        with:
          name: Falowen-${{ inputs.level }}-press-editorial-proof
          path: artifacts/course-material-bundles/${{ inputs.level }}/Falowen-${{ inputs.level }}-Press-Editorial-Proof.pdf
          if-no-files-found: error
          retention-days: 14

      - name: Upload A2 render diagnostics on failure (metadata JSON only)
        if: ${{ failure() && inputs.build_pdf && inputs.level == 'A2' }}
        uses: actions/upload-artifact@v4
        with:
          name: Falowen-A2-render-diagnostics
          path: artifacts/course-material-bundles/A2/render-diagnostics.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload render diagnostics on failure for other levels
        if: ${{ failure() && inputs.build_pdf && inputs.level != 'A2' }}
        uses: actions/upload-artifact@v4
        with:
          name: Falowen-${{ inputs.level }}-render-diagnostics
          path: artifacts/course-material-bundles/${{ inputs.level }}/
          if-no-files-found: warn
          retention-days: 7
