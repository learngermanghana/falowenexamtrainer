name: Course material bundle

on:
  workflow_dispatch:
    inputs:
      level:
        description: Course level to prepare
        required: true
        type: choice
        options:
          - A1
          - A2
          - B1
          - B2
          - C1

permissions:
  contents: read

jobs:
  build-manifest:
    name: Build ${{ inputs.level }} material manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show checked-out revision
        run: |
          echo "Workflow ref: $GITHUB_REF"
          echo "Commit SHA: $GITHUB_SHA"
          git log -1 --oneline

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build ordered level manifest
        run: node scripts/course-material-bundles/buildLevelManifest.mjs "${{ inputs.level }}"

      - name: Validate and show manifest summary
        run: |
          node -e '
            const fs = require("fs");
            const level = process.env.LEVEL;
            const file = `artifacts/course-material-bundles/${level}/Falowen-${level}-Course-Materials-manifest.json`;
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
            if (manifest.schemaVersion !== 3) {
              throw new Error(`Outdated manifest schema ${manifest.schemaVersion}; expected schemaVersion 3.`);
            }
            console.log(`${manifest.level}: ${manifest.lessonCount} curriculum entries`);
            console.log(`Printable lessons: ${manifest.printableLessonCount}`);
            console.log(`Excluded lessons: ${manifest.excludedLessonCount}`);
            console.log(`Missing days: ${manifest.missingDays.length ? manifest.missingDays.join(", ") : "none"}`);
            console.log(`Unresolved printable routes: ${manifest.unresolvedLessonCount}`);
            console.log(`Curriculum complete: ${manifest.curriculumComplete}`);
            console.log(`Routes classified: ${manifest.routesClassified}`);
            console.log(`Ready for PDF generation: ${manifest.readyForPdfGeneration}`);
          '
        env:
          LEVEL: ${{ inputs.level }}

      - name: Upload administration manifest
        uses: actions/upload-artifact@v4
        with:
          name: Falowen-${{ inputs.level }}-course-material-manifest
          path: artifacts/course-material-bundles/${{ inputs.level }}/Falowen-${{ inputs.level }}-Course-Materials-manifest.json
          if-no-files-found: error
          retention-days: 30
