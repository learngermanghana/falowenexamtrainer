name: Student sheet delivery regression
on:
  pull_request:
    paths:
      - 'functions/index.js'
      - 'functions/studentSheetDelivery.js'
      - 'functions/__tests__/studentSheetDelivery.test.cjs'
      - '.github/workflows/student-sheet-delivery.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check functions/index.js
      - run: node --test functions/__tests__/studentSheetDelivery.test.cjs
