name: Deploy Falowen Firestore Indexes

on:
  pull_request:
    paths:
      - 'firestore.indexes.json'
      - 'firebase.json'
      - 'scripts/deployFirestoreIndexes.cjs'
      - 'scripts/deployFirestoreIndexes.test.cjs'
      - '.github/workflows/deploy-firestore-indexes.yml'
  push:
    branches: [main]
    paths:
      - 'firestore.indexes.json'
      - 'scripts/deployFirestoreIndexes.cjs'
      - 'scripts/deployFirestoreIndexes.test.cjs'
      - 'firebase.json'
      - '.github/workflows/deploy-firestore-indexes.yml'
  workflow_dispatch:

concurrency:
  group: falowenexamtrainer-firestore-indexes
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/deployFirestoreIndexes.test.cjs
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIREBASE_PROJECT_ID: falowen-examiner-trainer
      GOOGLE_CLOUD_PROJECT: falowen-examiner-trainer
      GCLOUD_PROJECT: falowen-examiner-trainer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check committed index configuration
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const conf=JSON.parse(fs.readFileSync("firebase.json","utf8"));
          const file=conf.firestore?.indexes;
          if(file!=="firestore.indexes.json")throw Error("Firebase must reference the tracked index manifest");
          const rows=JSON.parse(fs.readFileSync(file,"utf8")).indexes||[];
          for(const fields of [
            ["uid","source","createdAt"],
            ["uid","source","level","createdAt"]
          ]){
            if(!rows.some(row=>row.collectionGroup==="liveSpeakExamResults"
              && row.queryScope==="COLLECTION"
              && row.fields?.map(x=>x.fieldPath).join(",")===fields.join(",")
              && row.fields.at(-1).order==="DESCENDING")) {
              throw Error("Missing staff speaking review index: "+fields.join(","));
            }
          }
          console.log("Firestore index manifest validated for both Speaking Review queries");
          NODE
      - name: Authenticate using existing Falowen deployment identity
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_FALOWEN }}'
      - name: Install Firebase Admin deployment dependencies
        run: npm install --prefix functions --no-audit --no-fund
      - name: Test index comparison and creation payload
        run: node --test scripts/deployFirestoreIndexes.test.cjs
      - name: Reconcile indexes through Firestore API without Firestore Rules validation
        id: reconcile
        run: node scripts/deployFirestoreIndexes.cjs
      - name: Explain one-time index deployment IAM permission if blocked
        if: ${{ failure() && steps.reconcile.outcome == 'failure' && steps.reconcile.outputs.permission_denied == 'true' }}
        shell: bash
        run: |
          account="$(node -e 'const fs=require("fs");const path=process.env.GOOGLE_APPLICATION_CREDENTIALS;try{console.log(JSON.parse(fs.readFileSync(path,"utf8")).client_email||"unknown")}catch{console.log("unknown")}' )"
          {
            echo '### Index deployment needs one-time Firestore IAM permission'
            echo ''
            echo "Deployment service account: \`$account\`"
            echo 'Grant **Cloud Datastore Index Admin** (`roles/datastore.indexAdmin`) for project `falowen-examiner-trainer`, then rerun this workflow.'
            echo 'Google Cloud IAM: https://console.cloud.google.com/iam-admin/iam?project=falowen-examiner-trainer'
            echo 'The account does **not** need Owner/Editor and no learner recordings need to be stored.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Grant roles/datastore.indexAdmin to $account; then rerun the index workflow."
      - name: Deployment note
        run: |
          echo '### Firestore indexes submitted' >> "$GITHUB_STEP_SUMMARY"
          echo 'Missing indexes were submitted to falowen-examiner-trainer using the Firestore index API.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Firebase may continue building indexes after deployment; check query readiness separately.' >> "$GITHUB_STEP_SUMMARY"
