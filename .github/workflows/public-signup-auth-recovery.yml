name: Public signup auth recovery

on:
  pull_request:
    paths:
      - "scripts/patchPublicSignupAuthRecovery.mjs"
      - "scripts/checkPublicSignupAuthRecovery.js"
      - "web/src/App.js"
      - "web/src/context/AuthContext.js"
      - "web/src/components/SignUpPage.js"
      - "web/src/components/SignUpPageLegacy.js"
      - "web/src/lib/signupAuthRecovery.js"
      - "web/src/lib/publicFunnelTracking.js"
      - "web/src/__tests__/signupAuthRecovery.test.js"
      - "web/src/__tests__/SignUpPage.test.js"
      - "web/package.json"
      - ".github/workflows/public-signup-auth-recovery.yml"

jobs:
  signup-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply signup auth recovery safeguards
        run: node scripts/patchPublicSignupAuthRecovery.mjs
      - name: Verify signup auth and WhatsApp support contracts
        run: node scripts/checkPublicSignupAuthRecovery.js
      - name: Install web dependencies
        working-directory: web
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Test interrupted signup recovery and application form
        working-directory: web
        run: npx jest --runInBand --runTestsByPath src/__tests__/signupAuthRecovery.test.js src/__tests__/SignUpPage.test.js
      - name: Build production web app
        working-directory: web
        run: npm run build
      - name: Verify support copy reached the production bundle
        working-directory: web
        run: |
          grep -R -q "Contact Admissions Support on WhatsApp" dist
          if grep -R -q "Continue on WhatsApp" dist; then
            echo "Old confusing WhatsApp continuation label is still present in the production bundle."
            exit 1
          fi
