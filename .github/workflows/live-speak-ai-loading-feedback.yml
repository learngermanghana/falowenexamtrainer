name: A1–C2 Speaking AI Loading Feedback

on:
  pull_request:
    paths:
      - "web/src/components/LiveSpeakPage.jsx"
      - "web/src/components/SpeakingAiLoadingStatus*"
      - "web/src/components/SpeakingExamDesign.css"
      - ".github/workflows/live-speak-ai-loading-feedback.yml"
  push:
    branches: [main]
    paths:
      - "web/src/components/LiveSpeakPage.jsx"
      - "web/src/components/SpeakingAiLoadingStatus*"
      - "web/src/components/SpeakingExamDesign.css"
      - ".github/workflows/live-speak-ai-loading-feedback.yml"

jobs:
  speaking-loading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Check A1–C2 wait states and speaking regressions
        working-directory: web
        run: npx jest --runInBand --runTestsByPath src/components/SpeakingAiLoadingStatus.test.jsx src/components/LiveSpeakTurnManagement.test.jsx src/components/LiveSpeakEmbeddedIntegration.test.jsx src/components/LiveSpeakRecovery.test.jsx src/components/CourseSpeakingRecovery.test.jsx src/components/SpeakingExamUnifiedUi.test.jsx src/components/A2MockSpeakingExaminerFlow.test.jsx
      - name: Build production student site
        working-directory: web
        run: npx vite build
