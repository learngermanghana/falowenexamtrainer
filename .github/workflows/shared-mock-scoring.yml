name: Shared verified mock scoring A1–C2

on:
  pull_request:
    paths:
      - "functions/functionz/verifiedFourSkillMockScore.js"
      - "functions/functionz/a1MockCompletionSync.js"
      - "functions/functionz/a2MockCompletionSync.js"
      - "functions/functionz/b1MockCompletionSync.js"
      - "functions/functionz/tests/verifiedFourSkillMockScore.test.cjs"
      - ".github/workflows/shared-mock-scoring.yml"
  push:
    branches: [main]
    paths:
      - "functions/functionz/verifiedFourSkillMockScore.js"
      - "functions/functionz/a1MockCompletionSync.js"
      - "functions/functionz/a2MockCompletionSync.js"
      - "functions/functionz/b1MockCompletionSync.js"
      - "functions/functionz/tests/verifiedFourSkillMockScore.test.cjs"
      - ".github/workflows/shared-mock-scoring.yml"

permissions:
  contents: read

jobs:
  verified-grading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate shared mock modules
        run: |
          node --check functions/functionz/verifiedFourSkillMockScore.js
          node --check functions/functionz/a1MockCompletionSync.js
          node --check functions/functionz/a2MockCompletionSync.js
          node --check functions/functionz/b1MockCompletionSync.js
      - name: Compare A1/A2/B1 actual exam grading with shared engine
        run: node --test functions/functionz/tests/verifiedFourSkillMockScore.test.cjs
