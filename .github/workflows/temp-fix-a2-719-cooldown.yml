name: Apply A2 7.19 cooldown fix

on:
  push:
    branches:
      - agent/fix-a2-7-19-draft-submit

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-a2-7-19-draft-submit
          fetch-depth: 0

      - name: Scope cooldown to selected assignment
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path("web/src/components/AssignmentSubmissionPage.js")
          source = target.read_text()
          old = '''  const latestSubmissionActionAt = useMemo(() => {
            const latest = recentSubmissions.reduce((acc, item) => {
              const statusLabel = safeLower(item?.status);
              if (!["submitted", "resubmitted"].includes(statusLabel)) return acc;

              const itemDate = toDateValue(item.resubmittedAt || item.submittedAt || item.createdAt || item.updatedAt);
              if (!itemDate) return acc;
              if (!acc || itemDate > acc) return itemDate;
              return acc;
            }, null);

            return latest;
          }, [recentSubmissions]);'''
          new = '''  const latestSubmissionActionAt = useMemo(() => {
            const latest = recentSubmissions.reduce((acc, item) => {
              // A submission for another assignment must never block this assignment.
              // The 10-minute cooldown only protects repeat attempts for the selected task.
              if (!isSameSelectedAssignment(item)) return acc;

              const statusLabel = safeLower(item?.status);
              if (!["submitted", "resubmitted"].includes(statusLabel)) return acc;

              const itemDate = toDateValue(item.resubmittedAt || item.submittedAt || item.createdAt || item.updatedAt);
              if (!itemDate) return acc;
              if (!acc || itemDate > acc) return itemDate;
              return acc;
            }, null);

            return latest;
          }, [isSameSelectedAssignment, recentSubmissions]);'''

          if old not in source:
              if new not in source:
                  raise SystemExit("Expected cooldown block was not found")
          else:
              target.write_text(source.replace(old, new, 1))

          Path(".github/workflows/temp-fix-a2-719-cooldown.yml").unlink()
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/components/AssignmentSubmissionPage.js .github/workflows/temp-fix-a2-719-cooldown.yml
          git diff --cached --quiet || git commit -m "Scope submission cooldown to selected assignment"
          git push origin HEAD:agent/fix-a2-7-19-draft-submit
