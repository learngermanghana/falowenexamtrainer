name: ChatGPT Falowen Companion

on:
  pull_request:
    paths:
      - "functions/functionz/chatgptCompanion.js"
      - "functions/functionz/chatgptClassTimetable.js"
      - "functions/functionz/chatgptClassPreparation.js"
      - "functions/functionz/__tests__/chatgptClassPreparation.test.js"
      - "web/src/data/a1*.js"
      - "web/src/data/a2*.js"
      - "web/src/components/A1Day1GreetingsWorkbookPage.js"
      - "functions/functionz/__tests__/chatgptClassTimetable.test.js"
      - "scripts/generateChatgptLessonContent.mjs"
      - "scripts/extractFalowenGrammar.mjs"
      - "scripts/extractFalowenWorkbook.mjs"
      - "web/src/components/A2B1WorkbookGrammarNotesContent.js"
      - "web/src/components/*GrammarPage.js"
      - "web/src/components/*GrammarNotesPage.js"
      - "web/src/components/*WorkbookPage.js"
      - "web/src/data/b2*.js"
      - "web/package.json"
      - "functions/functionz/__tests__/chatgptCompanion.test.js"
      - "functions/functionz/__tests__/chatgptCompanion.integration.test.js"
      - "functions/functionz/paymentAwareApp.js"
      - "web/src/components/ChatGPTConnectPage.jsx"
      - "web/src/App.js"
      - "web/public/.well-known/**"
      - "vercel.json"
      - ".github/workflows/chatgpt-companion.yml"
  workflow_dispatch:

jobs:
  mcp-security-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install --no-package-lock --ignore-scripts
      - run: npm --prefix functions install --no-package-lock --ignore-scripts
      - name: Generate student-facing curriculum from canonical A1–B2 sources
        run: node scripts/generateChatgptLessonContent.mjs
      - name: Verify OAuth constraints and student data scope
        run: npx jest --config jest.config.js --runInBand --runTestsByPath functions/functionz/__tests__/chatgptCompanion.test.js functions/functionz/__tests__/chatgptCompanion.integration.test.js functions/functionz/__tests__/chatgptClassTimetable.test.js functions/functionz/__tests__/chatgptClassPreparation.test.js
      - name: Verify JavaScript syntax
        run: |
          node --check scripts/extractFalowenGrammar.mjs
          node --check scripts/extractFalowenWorkbook.mjs
          node --check functions/functionz/chatgptCompanion.js
          node --check functions/functionz/chatgptClassTimetable.js
          node --check functions/functionz/chatgptClassPreparation.js
          node --check functions/functionz/paymentAwareApp.js
          node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8'))"
