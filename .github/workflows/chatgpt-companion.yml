      - "functions/functionz/__tests__/chatgptCompanion.test.js"
      - "functions/functionz/__tests__/chatgptCompanion.integration.test.js"
      - "functions/functionz/paymentAwareApp.js"
      - "web/src/components/ChatGPTConnectPage.jsx"
      - "web/src/App.js"
      - "web/public/.well-known/**"
      - "vercel.json"
      - ".github/workflows/chatgpt-companion.yml"
  workflow_dispatch:

jobs:
  mcp-security-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install --no-package-lock --ignore-scripts
      - run: npm --prefix functions install --no-package-lock --ignore-scripts
      - name: Verify fail-closed A1 submission safety snapshot is current
        run: node scripts/generateChatgptA1SubmissionRules.mjs --check
      - name: Generate student-facing curriculum from canonical A1–C2 sources
        run: node scripts/generateChatgptLessonContent.mjs && node scripts/generateChatgptExamContent.mjs
      - name: Verify OAuth constraints and student data scope
        run: npx jest --config jest.config.js --runInBand --runTestsByPath functions/functionz/__tests__/chatgptCompanion.test.js functions/functionz/__tests__/chatgptCompanion.integration.test.js functions/functionz/__tests__/chatgptClassTimetable.test.js functions/functionz/__tests__/chatgptClassPreparation.test.js functions/functionz/__tests__/chatgptExamLibrary.test.js functions/functionz/__tests__/chatgptExamPractice.test.js functions/functionz/__tests__/chatgptAssignmentSubmission.test.js functions/functionz/__tests__/chatgptPersonalRevision.test.js functions/functionz/__tests__/chatgptInteractiveTutor.test.js functions/functionz/__tests__/chatgptSavedRevision.test.js
      - name: Verify JavaScript syntax
        run: |
          node --check scripts/generateChatgptLessonContent.mjs
          node --check scripts/generateChatgptExamContent.mjs
          node --check scripts/generateChatgptA1SubmissionRules.mjs
          node --check functions/functionz/chatgptA1SubmissionSafety.js
          node --check scripts/extractFalowenGrammar.mjs
          node --check scripts/extractFalowenWorkbook.mjs
          node --check functions/functionz/chatgptCompanion.js
          node --check functions/functionz/chatgptClassTimetable.js
          node --check functions/functionz/chatgptClassPreparation.js
          node --check functions/functionz/chatgptExamLibrary.js
          node --check functions/functionz/chatgptExamPractice.js
          node --check functions/functionz/chatgptMockReview.js
          node --check functions/functionz/chatgptPersonalRevision.js
          node --check functions/functionz/chatgptInteractiveTutor.js
          node --check functions/functionz/chatgptSavedRevision.js
          node --check scripts/chatgptExpandedMockContent.mjs
          node --check functions/functionz/chatgptAssignmentSubmission.js
          node --check functions/functionz/chatgptWorkbookSubmission.js
          node --check scripts/chatgptCourseSourceLoader.mjs
          node --check functions/functionz/paymentAwareApp.js
          node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8'))"
