name: A1 Day 19 DOM safety

on:
  pull_request:
    paths:
      - ".github/workflows/a1-day19-dom-safety.yml"
      - "scripts/patchA1TutorNavigationSelfPracticeSafety.mjs"
      - "web/package.json"
      - "web/src/components/A1UnifiedTutorWorkbookNavigation.js"
      - "web/src/components/A1UnifiedTutorWorkbookNavigation.test.js"
      - "web/src/components/VerbotenErlaubtPage.js"
      - "web/src/components/VerbotenErlaubtPage.test.jsx"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Apply A1 tutor navigation safety
        working-directory: web
        run: npm run sync:a1-tutor-nav-safety
      - name: Test Day 19 self-practice and interactive page
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/A1UnifiedTutorWorkbookNavigation.test.js src/components/VerbotenErlaubtPage.test.jsx
      - name: Build production web app
        working-directory: web
        run: npm run build
