name: Firebase integration tests

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        # The root package-lock predates the current backend devDependencies.
        # Install from package.json without mutating or trusting that stale lock in CI.
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run Firebase emulator integration tests
        run: npm run test:integration
