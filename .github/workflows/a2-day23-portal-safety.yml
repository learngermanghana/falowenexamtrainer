name: A2 Day 23 portal safety

on:
  pull_request:
    paths:
      - "scripts/patchA2LegacyPortalSafety.mjs"
      - "web/package.json"
      - "web/src/components/A2LegacyStandardWorkbookNavigationImpl.js"
      - "web/src/components/A2LegacyPortalSafety.test.jsx"
      - ".github/workflows/a2-day23-portal-safety.yml"

jobs:
  portal-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply portal safety patch twice
        run: |
          node scripts/patchA2LegacyPortalSafety.mjs
          node scripts/patchA2LegacyPortalSafety.mjs
      - name: Install web dependencies
        working-directory: web
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Test Day 23 portal replacement race
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/A2LegacyPortalSafety.test.jsx
      - name: Build production web app
        working-directory: web
        run: npm run build
