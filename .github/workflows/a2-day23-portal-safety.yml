name: A2 workbook DOM safety

on:
  pull_request:
    paths:
      - "scripts/patchA2LegacyPortalSafety.mjs"
      - "scripts/patchA2Day23NativeNavigationSafety.mjs"
      - "scripts/patchA2ReactOwnedDomCleanupSafety.mjs"
      - "scripts/patchA2FallbackWorkbookSafety.mjs"
      - "scripts/patchA2LateWorkbookNativeOwnership.mjs"
      - "scripts/patchA2SharedRegressionSafety.mjs"
      - "web/package.json"
      - "web/src/components/a2B1WorkbookSectionProfile.js"
      - "web/src/components/a2GoetheListeningOnlyCleanup.js"
      - "web/src/components/A2LegacyStandardWorkbookNavigationImpl.js"
      - "web/src/components/StandardWorkbookComponents.js"
      - "web/src/components/A2LegacyPortalSafety.test.jsx"
      - "web/src/components/A2ReactOwnedCleanupSafety.test.jsx"
      - "web/src/components/A2FallbackWorkbookSafety.test.jsx"
      - "web/src/components/A2Day25BuildNavigation.test.js"
      - "web/src/components/A2LateWorkbookNativeOwnership.test.js"
      - "web/src/components/A2SharedWorkbookRegression.test.js"
      - ".github/workflows/a2-day23-portal-safety.yml"

jobs:
  dom-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply A2 DOM and ownership patches twice
        run: |
          node scripts/patchA2LegacyPortalSafety.mjs
          node scripts/patchA2Day23NativeNavigationSafety.mjs
          node scripts/patchA2ReactOwnedDomCleanupSafety.mjs
          node scripts/patchA2FallbackWorkbookSafety.mjs
          node scripts/patchA2LateWorkbookNativeOwnership.mjs
          node scripts/patchA2SharedRegressionSafety.mjs
          node scripts/patchA2LegacyPortalSafety.mjs
          node scripts/patchA2Day23NativeNavigationSafety.mjs
          node scripts/patchA2ReactOwnedDomCleanupSafety.mjs
          node scripts/patchA2FallbackWorkbookSafety.mjs
          node scripts/patchA2LateWorkbookNativeOwnership.mjs
          node scripts/patchA2SharedRegressionSafety.mjs
      - name: Install web dependencies
        working-directory: web
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Test A2 portal, native ownership, submission and Grammar contracts
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/A2LegacyPortalSafety.test.jsx src/components/A2ReactOwnedCleanupSafety.test.jsx src/components/A2FallbackWorkbookSafety.test.jsx src/components/A2Day25BuildNavigation.test.js src/components/A2LateWorkbookNativeOwnership.test.js src/components/A2SharedWorkbookRegression.test.js
      - name: Build production web app
        working-directory: web
        run: npm run build
