name: Fix Paystack final balance detection

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-paystack-final-balance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Align backend billing fields with frontend
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("functions/functionz/paymentAwareApp.js")
          text = path.read_text()

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return source.replace(old, new, 1)

          round_block = (
              "const roundMoney = (value) =>\n"
              "  Math.round((Number(value) + Number.EPSILON) * 100) / 100;\n"
          )
          helper_block = round_block + '''
          const parseMoney = (value) => {
            if (typeof value === "number") return Number.isFinite(value) ? value : Number.NaN;
            if (value === null || value === undefined || value === "") return Number.NaN;
            const normalized = String(value)
              .replace(/,/g, "")
              .replace(/[^0-9.-]/g, "");
            const parsed = Number(normalized);
            return Number.isFinite(parsed) ? parsed : Number.NaN;
          };

          const getStudentBillingTotals = (student = {}) => {
            const parsedTuition = parseMoney(student.tuitionFee);
            const tuitionFee = Number.isFinite(parsedTuition) ? Math.max(parsedTuition, 0) : 0;
            const parsedPaid = parseMoney(
              student.paid ?? student.initialPaymentAmount ?? student.paidAmount
            );
            const paidSoFar = Number.isFinite(parsedPaid) ? Math.max(parsedPaid, 0) : 0;
            const parsedExplicitBalance = parseMoney(student.balanceDue ?? student.balance);
            const explicitBalance = Number.isFinite(parsedExplicitBalance)
              ? Math.max(parsedExplicitBalance, 0)
              : null;
            const derivedBalance = Math.max(roundMoney(tuitionFee - paidSoFar), 0);
            const balanceDue = explicitBalance === null
              ? derivedBalance
              : Math.min(explicitBalance, derivedBalance);
            return { tuitionFee, paidSoFar, balanceDue };
          };
'''
          text = replace_once(text, round_block, helper_block, "billing helper")

          initialize_old = (
              "    const tuitionFee = Math.max(Number(student.tuitionFee || 0), 0);\n"
              "    const paidSoFar = Math.max(Number(student.initialPaymentAmount || 0), 0);\n"
              "    const balanceDue = Number.isFinite(Number(student.balanceDue))\n"
              "      ? Math.max(Number(student.balanceDue), 0)\n"
              "      : Math.max(tuitionFee - paidSoFar, 0);\n"
          )
          text = replace_once(
              text,
              initialize_old,
              "    const { tuitionFee, paidSoFar, balanceDue } = getStudentBillingTotals(student);\n",
              "initialize billing",
          )

          webhook_old = (
              "    const tuitionFee = Math.max(Number(student.tuitionFee || 0), 0);\n"
              "    const priorPaid = Math.max(Number(student.initialPaymentAmount || 0), 0);\n"
              "    const priorBalanceDue = Number.isFinite(Number(student.balanceDue))\n"
              "      ? Math.max(Number(student.balanceDue), 0)\n"
              "      : Math.max(tuitionFee - priorPaid, 0);\n"
          )
          webhook_new = (
              "    const {\n"
              "      tuitionFee,\n"
              "      paidSoFar: priorPaid,\n"
              "      balanceDue: priorBalanceDue,\n"
              "    } = getStudentBillingTotals(student);\n"
          )
          text = replace_once(text, webhook_old, webhook_new, "webhook billing")

          updates_old = (
              "    const updates = {\n"
              "      initialPaymentAmount: totalPaid,\n"
              "      balanceDue,\n"
          )
          updates_new = (
              "    const updates = {\n"
              "      paid: totalPaid,\n"
              "      initialPaymentAmount: totalPaid,\n"
              "      balanceDue,\n"
          )
          text = replace_once(text, updates_old, updates_new, "payment updates")

          path.write_text(text)
          Path(".github/workflows/fix-paystack-final-balance.yml").unlink()
          PY

      - name: Validate backend syntax
        run: node --check functions/functionz/paymentAwareApp.js

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/functionz/paymentAwareApp.js .github/workflows/fix-paystack-final-balance.yml
          git commit -m "Fix Paystack final balance detection"
          git push origin main
