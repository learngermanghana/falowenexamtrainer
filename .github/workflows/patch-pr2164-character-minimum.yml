name: Patch PR 2164 A1 character floor

on:
  push:
    branches:
      - fix/day3-radio-title-a1-word-minimum

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/day3-radio-title-a1-word-minimum
          fetch-depth: 0
      - name: Align internal character floors with the A1 word rule
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/const MIN_SUBMISSION_CHARACTERS = 80;/const MIN_SUBMISSION_CHARACTERS = 20;/' web/src/components/AssignmentSubmissionPage.js
          sed -i 's/const MIN_SUBMISSION_CHARACTERS = 80;/const MIN_SUBMISSION_CHARACTERS = 20;/' web/src/components/VerifiedCloudDraftSubmissionPage.js
          if git diff --quiet; then
            echo "Character floors are already aligned."
            exit 0
          fi
          git config user.name "falowen-ci"
          git config user.email "actions@users.noreply.github.com"
          git add web/src/components/AssignmentSubmissionPage.js web/src/components/VerifiedCloudDraftSubmissionPage.js
          git commit -m "Align A1 internal validation with 20-word minimum"
          git push origin HEAD:fix/day3-radio-title-a1-word-minimum
