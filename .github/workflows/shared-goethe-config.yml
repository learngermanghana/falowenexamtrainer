name: Shared Goethe Exam Config

on:
  pull_request:
    paths:
      - 'web/src/data/goetheExamSchedule.js'
      - 'web/src/services/goetheExamConfigService.js'
      - 'web/src/hooks/useGoetheExamConfig.js'
      - 'web/src/components/MyExamFilePage.js'
      - 'web/src/components/StudyCalendarPage.js'
      - 'web/scripts/patch-goethe-exam-config-ui.mjs'
      - 'web/tests/goethe-exam-shared-config.test.mjs'
      - 'web/package.json'
      - '.github/workflows/shared-goethe-config.yml'
  push:
    branches: [main]
    paths:
      - 'web/src/data/goetheExamSchedule.js'
      - 'web/src/services/goetheExamConfigService.js'
      - 'web/src/hooks/useGoetheExamConfig.js'
      - 'web/src/components/MyExamFilePage.js'
      - 'web/src/components/StudyCalendarPage.js'
      - 'web/scripts/patch-goethe-exam-config-ui.mjs'
      - 'web/tests/goethe-exam-shared-config.test.mjs'
      - 'web/package.json'
      - '.github/workflows/shared-goethe-config.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Apply shared-config UI patch
        run: node scripts/patch-goethe-exam-config-ui.mjs
      - name: Test shared Goethe configuration
        run: node --test tests/goethe-exam-shared-config.test.mjs
      - name: Build Falowen web app
        run: npm run build
