name: Student submission Firestore permissions

on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'tests/firestore-submission-lock.test.cjs'
      - 'web/src/services/submissionLockService.js'
      - 'web/src/components/VerifiedCloudDraftSubmissionPage.js'
      - '.github/workflows/student-submission-permissions.yml'
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'tests/firestore-submission-lock.test.cjs'
      - 'web/src/services/submissionLockService.js'
      - 'web/src/components/VerifiedCloudDraftSubmissionPage.js'
      - '.github/workflows/student-submission-permissions.yml'

jobs:
  emulator-permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install local emulator test dependencies
        run: npm install --no-save --no-audit --no-fund firebase @firebase/rules-unit-testing firebase-tools
      - name: Check first submission, timer expiry and owner isolation for A1–B1
        env:
          CI: 'true'
        run: npx firebase emulators:exec --project demo-falowen-locks --only firestore "node --test tests/firestore-submission-lock.test.cjs"
