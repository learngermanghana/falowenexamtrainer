name: C2 Course Book alignment

on:
  pull_request:
    paths:
      - "web/src/data/c2*.js"
      - "web/src/components/C2*.js"
      - "web/src/components/CourseTab.js"
      - "web/src/components/WritingFeedbackCard.js"
      - "web/src/components/WritingFeedbackCard.test.js"
      - "web/src/hooks/useC2CourseProgress.js"
      - "web/src/data/curriculumManifest.js"
      - "web/src/components/SelfLearningLessonRegistry.js"
      - "scripts/patchC2*.mjs"
      - ".github/workflows/c2-course-book-alignment.yml"

jobs:
  c2-alignment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test C2 AI writing prompt contract
        run: node functions/functionz/prompts.courseTask.test.js
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Run C2 alignment and rotating-skill regression tests
        working-directory: web
        run: >-
          npx jest --runInBand --runTestsByPath
          src/data/c2LessonContentAlignment.test.js
          src/components/C2UnifiedGuidedWorkbookPage.test.js
          src/components/C2CourseBookSkillProgress.test.js
          src/components/WritingFeedbackCard.test.js
