name: A2 7.19 draft submission regression

on:
  pull_request:
    paths:
      - "web/src/components/AssignmentSubmissionPage.js"
      - "web/src/components/AssignmentSubmissionPage.cooldownScope.test.js"
      - ".github/workflows/temp-test-a2-719-submit.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm install --legacy-peer-deps --no-audit --no-fund --loglevel=error
      - name: Test assignment-scoped cooldown regression
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/AssignmentSubmissionPage.cooldownScope.test.js
      - name: Build production web app
        working-directory: web
        run: npm run build
