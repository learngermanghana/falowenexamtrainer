name: Offline music alignment safety checks

on:
  pull_request:
    paths:
      - "scripts/align_falowen_music.py"
      - "tests/test_falowen_music_alignment.py"
      - ".github/workflows/offline-music-alignment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alignment-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run offline algorithm and publishing-gate tests (no model or MP3 download)
        run: python -m unittest discover -s tests -p test_falowen_music_alignment.py -v
