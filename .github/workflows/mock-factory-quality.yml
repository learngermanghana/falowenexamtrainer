name: Mock Factory A1–C2 release guard

on:
  pull_request:
    paths:
      - "web/src/data/mockFactoryContract*"
      - "web/src/data/mockExamCatalog.js"
      - "web/src/data/a2FullMockContract*"
      - ".github/workflows/mock-factory-quality.yml"
  push:
    branches: [main]
    paths:
      - "web/src/data/mockFactoryContract*"
      - "web/src/data/mockExamCatalog.js"
      - "web/src/data/a2FullMockContract*"
      - ".github/workflows/mock-factory-quality.yml"

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Block unregistered A1–C2 ready mocks
        working-directory: web
        run: CI=true npx jest --runInBand --runTestsByPath src/data/mockFactoryContract.test.js src/data/a2FullMockContract.test.js src/data/mockExamCatalog.a2Library.test.js
