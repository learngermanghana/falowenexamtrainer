name: One-shot A2 Day 1 Small Talk repair

on:
  push:
    branches:
      - fix/a2-day1-small-talk-20260916
    paths:
      - .github/workflows/fix-a2-day1-small-talk.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply repair
        run: python scripts/oneShotFixA2Day1.py

      - name: Install frontend dependencies
        run: npm --prefix web install --ignore-scripts

      - name: Build frontend directly with Vite
        run: cd web && npx vite build

      - name: Commit repair to branch
        shell: bash
        run: |
          git config user.name "falowen-repair-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/src/App.js web/src/data web/src/components/A2Day2SmallTalkWorkbookEnhancedPage.js web/src/components/A2StarterConjunctionsPage.js web/src/index.js web/src/staleChunkRecoveryRuntime.js vercel.json scripts .github/workflows/fix-a2-day1-small-talk.yml || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix A2 Day 1 Small Talk routing and learning content"
          git push origin HEAD:fix/a2-day1-small-talk-20260916
