          new_app_routes = '''          <Route
            path="/campus/course/a2-day-1-small-talk-workbook"
            element={withRadioWorkbookGate("A2", 1, <A2Day2SmallTalkWorkbookEnhancedPage />)}
          />
          {/* Legacy alias kept so old bookmarks continue to work. */}
          <Route
            path="/campus/course/a2-day-2-small-talk-workbook"
            element={withRadioWorkbookGate("A2", 1, <A2Day2SmallTalkWorkbookEnhancedPage />)}
          />'''
          if app.count(old_app_route) != 1:
              raise SystemExit(f"Expected exactly one legacy A2 Small Talk route in App.js, found {app.count(old_app_route)}")
          app_path.write_text(app.replace(old_app_route, new_app_routes, 1))

          # Canonicalize every data/config reference while leaving the App.js legacy alias in place.
          allowed_suffixes = {".js", ".jsx", ".mjs", ".cjs", ".json", ".md", ".txt"}
          for root in (Path("web"), Path("scripts")):
              if not root.exists():
                  continue
              for path in root.rglob("*"):
                  if not path.is_file() or path == app_path or path.suffix.lower() not in allowed_suffixes:
                      continue
                  try:
                      text = path.read_text()
                  except UnicodeDecodeError:
                      continue
                  if old_route in text:
                      path.write_text(text.replace(old_route, new_route))

          workbook_path = Path("web/src/components/A2Day2SmallTalkWorkbookEnhancedPage.js")
