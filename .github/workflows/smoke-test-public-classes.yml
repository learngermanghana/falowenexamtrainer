name: Smoke test public classes API

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'api/**'
      - 'web/public/classes/**'
      - 'vercel.json'
      - '.github/workflows/smoke-test-public-classes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for deployments
        run: sleep 120

      - name: Check public classes catalogue
        shell: bash
        run: |
          set -u
          endpoints=(
            "https://www.falowen.app/api/public/classes"
            "https://europe-west1-falowen-examiner-trainer.cloudfunctions.net/publicClassesCatalog"
          )

          success=false
          selected_endpoint=""
          selected_status=""
          last_error=""

          for endpoint in "${endpoints[@]}"; do
            url="${endpoint}?smoke=$(date +%s)"
            echo "GET $url"
            status=$(curl --silent --show-error --location \
              --connect-timeout 20 --max-time 60 \
              --header 'Cache-Control: no-cache' \
              --output /tmp/public-classes.json \
              --write-out '%{http_code}' \
              "$url" || true)
            echo "HTTP status: $status"
            cat /tmp/public-classes.json 2>/dev/null || true
            echo

            if [ "$status" != "200" ]; then
              last_error="${endpoint} returned ${status:-no-status}"
              continue
            fi

            if node -e '
              const fs = require("fs");
              const payload = JSON.parse(fs.readFileSync("/tmp/public-classes.json", "utf8"));
              if (!Array.isArray(payload.classes)) throw new Error("classes array missing");
              const bonn = payload.classes.find((item) => item.slug === "a1-bonn-klasse");
              if (!bonn) throw new Error("A1 Bonn Klasse missing from live API");
              console.log("Found:", JSON.stringify(bonn));
            '; then
              success=true
              selected_endpoint="$endpoint"
              selected_status="$status"
              break
            else
              last_error="${endpoint} returned 200 but A1 Bonn Klasse was missing"
            fi
          done

          mkdir -p diagnostics
          SUCCESS="$success" ENDPOINT="$selected_endpoint" STATUS="$selected_status" ERROR_TEXT="$last_error" node - <<'NODE'
          const fs = require("fs");
          const result = {
            checkedAt: new Date().toISOString(),
            success: process.env.SUCCESS === "true",
            endpoint: process.env.ENDPOINT || "",
            httpStatus: process.env.STATUS || "",
            error: process.env.ERROR_TEXT || "",
          };
          fs.writeFileSync("diagnostics/public-classes-smoke.json", `${JSON.stringify(result, null, 2)}\n`);
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/public-classes-smoke.json
          git commit -m "Record public classes smoke-test result" || true
          git push

          test "$success" = "true"
