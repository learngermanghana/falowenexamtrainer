name: Speaking Audio Reliability

on:
  pull_request:
    paths:
      - 'web/src/components/SpeakingPage.js'
      - 'web/src/components/GoetheFreeChatPage.js'
      - 'web/src/components/GoetheFreeChatPage.test.jsx'
      - 'web/src/components/GoetheFreeChatMounts.test.js'
      - 'web/src/components/CourseInlinePracticePanel.js'
      - 'web/src/components/C1Day11GoetheSpeakingSelfLearningPage.restore.test.js'
      - 'web/src/components/SpeakingExamIntroPage.js'
      - 'web/src/components/A1Teil3SpeakingPracticePanel.js'
      - 'web/src/components/A1Teil3SpeakingPracticePanel.test.jsx'
      - 'web/src/components/GoetheCoachAudioFailureUi.test.js'
      - 'web/src/components/SelfLearningLessonRegistry.js'
      - 'web/src/components/selfLearning/TeacherLectureSupportingMaterials.js'
      - 'web/src/components/selfLearning/TeacherLectureSupportingMaterials.test.jsx'
      - 'web/src/components/selfLearning/EmbeddedPracticePanels.js'
      - 'web/src/components/selfLearning/EmbeddedSpeechPracticePanel.js'
      - 'web/src/components/speechTrainer/InlineSpeechTrainer.js'
      - 'web/src/components/A2Day3ComparisonsWorkbookPage.js'
      - 'web/src/data/selfLearningLessons/c1/day11EngagementUndEhrenamt.js'
      - 'web/src/hooks/useCustomCoachSpeech.js'
      - 'web/src/hooks/useCustomCoachSpeech.test.js'
      - 'web/src/lib/speakingAudio.js'
      - 'web/src/lib/speakingSessionDuration.js'
      - 'web/src/lib/speakingExamLock.js'
      - 'web/src/lib/speakingExamLock.test.js'
      - 'web/src/services/coachService.js'
      - 'web/src/services/speechTrainerService.js'
      - 'web/src/services/presentationCoachService.js'
      - 'web/src/services/presentationCoachService.test.js'
      - 'functions/functionz/app.js'
      - 'functions/functionz/speakingAudioReliability.js'
      - 'scripts/patchSpeakingAudioReliability.mjs'
      - 'scripts/fixSpeakingAudioFrontendPatch.mjs'
      - 'scripts/fixSpeakingAudioBackendPatch.mjs'
      - 'scripts/patchCustomSpeakingSessionDuration.mjs'
      - 'scripts/patchCustomSpeakingReplyStyle.mjs'
      - 'scripts/patchGoetheCoachAudioFeedback.mjs'
      - 'scripts/patchCourseGoetheFreeChatMounts.mjs'
      - 'scripts/patchLockedA1Teil3Speaking.mjs'
      - 'scripts/patchRequestedCourseMedia.mjs'
      - 'scripts/runSpeakingAudioReliabilityPatch.mjs'
      - 'scripts/checkSpeakingAudioReliabilityPatch.mjs'
      - 'tests/speaking-audio-reliability.test.mjs'
      - 'tests/custom-speaking-reply-style.test.mjs'
      - 'web/package.json'
      - '.github/workflows/speaking-audio-reliability.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Apply and validate speaking audio and course free-chat patches
        shell: bash
        run: |
          set +e
          status=0
          {
            echo '== patch script syntax =='
            node --check scripts/patchSpeakingAudioReliability.mjs || status=$?
            node --check scripts/fixSpeakingAudioFrontendPatch.mjs || status=$?
            node --check scripts/fixSpeakingAudioBackendPatch.mjs || status=$?
            node --check scripts/patchCustomSpeakingSessionDuration.mjs || status=$?
            node --check scripts/patchCustomSpeakingReplyStyle.mjs || status=$?
            node --check scripts/patchGoetheCoachAudioFeedback.mjs || status=$?
            node --check scripts/patchCourseGoetheFreeChatMounts.mjs || status=$?
            node --check scripts/patchLockedA1Teil3Speaking.mjs || status=$?
            node --check scripts/patchRequestedCourseMedia.mjs || status=$?
            node --check scripts/runSpeakingAudioReliabilityPatch.mjs || status=$?
            node --check scripts/checkSpeakingAudioReliabilityPatch.mjs || status=$?
            echo '== apply patches =='
            node scripts/runSpeakingAudioReliabilityPatch.mjs || status=$?
            node scripts/patchCustomSpeakingReplyStyle.mjs || status=$?
            node scripts/patchGoetheCoachAudioFeedback.mjs || status=$?
            node scripts/patchCourseGoetheFreeChatMounts.mjs || status=$?
            node scripts/patchRequestedCourseMedia.mjs || status=$?
            echo '== backend syntax =='
            node --check functions/functionz/app.js || status=$?
            node --check functions/functionz/speakingAudioReliability.js || status=$?
            echo '== pure helper tests =='
            node --test tests/speaking-audio-reliability.test.mjs || status=$?
            node --test tests/custom-speaking-reply-style.test.mjs || status=$?
          } 2>&1 | tee speaking-audio-apply.log
          exit "$status"

      - name: Audit patched source contracts
        id: contract
        shell: bash
        run: |
          set +e
          node scripts/checkSpeakingAudioReliabilityPatch.mjs 2>&1 | tee speaking-audio-contract.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload speaking audio diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speaking-audio-diagnostics-${{ github.run_id }}
          path: |
            speaking-audio-apply.log
            speaking-audio-contract.log
          if-no-files-found: warn
          retention-days: 7

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Test speaking and self-learning UI regressions
        shell: bash
        working-directory: web
        run: |
          set +e
          CI=true npm run test:ci -- --runTestsByPath \
            src/components/GoetheFreeChatPage.test.jsx \
            src/components/GoetheFreeChatMounts.test.js \
            src/components/C1Day11GoetheSpeakingSelfLearningPage.restore.test.js \
            src/components/SpeakingMindMap.test.js \
            src/components/SpeakingPracticeTimerCard.test.js \
            src/lib/speakingExamLock.test.js \
            src/components/A1Teil3SpeakingPracticePanel.test.jsx \
            src/components/selfLearning/TeacherLectureSupportingMaterials.test.jsx \
            src/services/presentationCoachService.test.js \
            src/hooks/useCustomCoachSpeech.test.js \
            src/components/GoetheCoachAudioFailureUi.test.js \
            2>&1 | tee ../speaking-ui-tests.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload speaking UI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speaking-ui-diagnostics-${{ github.run_id }}
          path: speaking-ui-tests.log
          if-no-files-found: warn
          retention-days: 7

      - name: Build production web app
        working-directory: web
        run: npm run build

      - name: Confirm idempotent patch runners
        run: |
          node scripts/runSpeakingAudioReliabilityPatch.mjs
          node scripts/patchCustomSpeakingReplyStyle.mjs
          node scripts/patchGoetheCoachAudioFeedback.mjs
          node scripts/patchCourseGoetheFreeChatMounts.mjs
          node scripts/patchRequestedCourseMedia.mjs
          node scripts/checkSpeakingAudioReliabilityPatch.mjs
