name: Course Book video and badge tests

on:
  pull_request:
    branches:
      - main

jobs:
  lesson-video-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Test chapter-specific lesson videos
        shell: bash
        run: |
          set -o pipefail
          npm test -- --runInBand src/data/lessonModel.test.js 2>&1 | tail -n 100

  terminology-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Test Course Book badge wording
        shell: bash
        run: |
          set -o pipefail
          npm test -- --runInBand src/components/CourseBookTerminologyInjector.test.js 2>&1 | tail -n 100
