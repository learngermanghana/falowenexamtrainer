name: A1–B1 mock listening review
on:
  pull_request:
    paths:
      - 'web/src/components/MockListeningReview*'
      - 'web/src/components/A1FinalMockExamPage.jsx'
      - 'web/src/components/A2FinalMockExamPage.jsx'
      - 'web/src/components/A2Mock2Hoeren.jsx'
      - 'web/src/components/A2Mock2ExamHub.jsx'
      - 'web/src/components/A2Mock3ExamHub.jsx'
      - 'web/src/components/A2KombiMockExamPage.jsx'
      - 'web/src/components/B1FinalMockExamPage.jsx'
      - 'functions/functionz/mockListeningReview.js'
      - 'functions/functionz/*MockCompletionSync.js'
      - 'functions/functionz/app.js'
      - 'functions/functionz/tests/mockListeningReview.test.cjs'
      - '.github/workflows/mock-listening-review.yml'
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check functions/functionz/app.js
          node --test functions/functionz/tests/mockListeningReview.test.cjs
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npx jest --runInBand --runTestsByPath src/components/MockListeningReview.test.jsx src/components/A2MockAnswerVisibility.test.jsx
        env:
          CI: true
      - run: npx vite build
