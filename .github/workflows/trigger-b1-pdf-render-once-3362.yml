name: Trigger B1 PDF render once (PR 3362)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/trigger-b1-pdf-render-once-3362.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch-b1-render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch existing B1 course material bundle workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const response = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "course-material-bundle.yml",
              ref: "main",
              inputs: {
                level: "B1",
                build_pdf: "true",
                press_preview: "false"
              }
            });
            core.info("Requested B1 PDF course-material bundle on main (HTTP " + response.status + ")");
