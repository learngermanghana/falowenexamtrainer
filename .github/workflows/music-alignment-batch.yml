name: One-time requested recording alignment

on:
  pull_request:
    types: [opened]
    paths:
      - '.github/workflows/music-alignment-batch.yml'

permissions:
  contents: read

jobs:
  acoustic-review:
    if: github.head_ref == 'codex/music-all-recording-timings'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local CPU transcription dependencies
        run: python -m pip install 'faster-whisper==1.2.1' 'av==16.1.0'
      - name: Align untimed public music to German words
        run: >-
          python -u scripts/align_falowen_music.py --all --include-drafts
          --limit 100 --shard-count 6 --shard-index ${{ matrix.shard }}
          --output /tmp/falowen-music-timing-review
      - name: Preserve candidate timings and acoustic mismatch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: music-alignment-review-${{ matrix.shard }}
          path: /tmp/falowen-music-timing-review/*.json
          if-no-files-found: error
          retention-days: 14
