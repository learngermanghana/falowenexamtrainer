name: Diagnose A1 unified workbook

on:
  pull_request:
    paths:
      - "web/src/components/A1UnifiedTutorWorkbookNavigation.js"
      - "web/src/components/A1UnifiedTutorWorkbookNavigation.test.js"
      - ".github/workflows/diagnose-a1-unified.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Run focused test and capture output
        id: focused-test
        working-directory: web
        shell: bash
        run: |
          set +e
          CI=true npm run test:ci -- --runTestsByPath src/components/A1UnifiedTutorWorkbookNavigation.test.js > a1-unified-test-output.txt 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload focused test output
        uses: actions/upload-artifact@v4
        with:
          name: a1-unified-test-output
          path: web/a1-unified-test-output.txt
          if-no-files-found: error
      - name: Fail when the focused test failed
        if: steps.focused-test.outputs.exit_code != '0'
        run: exit 1
