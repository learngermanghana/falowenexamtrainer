name: Deploy Paystack API once

# This second push triggers the one-time deployment workflow.
on:
  push:
    paths:
      - '.github/workflows/deploy-paystack-api-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIREBASE_PROJECT_ID: falowen-examiner-trainer
      WEBHOOK_URL: https://api-awc2au65xa-ew.a.run.app/paystack/webhook

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install function dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Validate payment source
        working-directory: functions
        run: |
          node --check index.entry.js
          node --check functionz/paymentAwareApp.js
          node --check functionz/paystackFeePolicy.js
          node -e 'const exported = require("./index.entry.js"); if (!exported.api) throw new Error("api export missing");'

      - name: Authenticate
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_FALOWEN }}'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy existing API function
        run: firebase deploy --project "$FIREBASE_PROJECT_ID" --only functions:falowenexamtrainer:api --debug

      - name: Verify deployed fee policy
        run: |
          response=''
          for attempt in $(seq 1 18); do
            response=$(curl --fail --silent --show-error "$WEBHOOK_URL" || true)
            if echo "$response" | grep -q 'shared_50_50'; then
              printf '%s\n' "$response" > paystack-policy-response.json
              exit 0
            fi
            sleep 10
          done
          echo "Expected shared_50_50 response was not received. Last response: $response"
          exit 1

      - name: Record successful deployment
        env:
          DEPLOY_COMMIT: '${{ github.sha }}'
          DEPLOY_RUN_ID: '${{ github.run_id }}'
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          response = json.loads(Path('paystack-policy-response.json').read_text())
          payload = {
              'checkedAt': datetime.now(timezone.utc).isoformat(),
              'success': True,
              'commit': os.environ.get('DEPLOY_COMMIT', ''),
              'runId': os.environ.get('DEPLOY_RUN_ID', ''),
              'function': 'falowenexamtrainer:api',
              'project': 'falowen-examiner-trainer',
              'webhook': 'https://api-awc2au65xa-ew.a.run.app/paystack/webhook',
              'verification': response,
          }
          path = Path('diagnostics/firebase-api-deploy.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, indent=2) + '\n')
          PY

          git config user.name "Falowen Deployment Bot"
          git config user.email "moxflex@gmail.com"
          git add diagnostics/firebase-api-deploy.json
          git commit -m "Confirm Paystack API deployment [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
