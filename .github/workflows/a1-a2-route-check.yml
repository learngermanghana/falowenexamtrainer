name: A1 A2 workbook routes

on:
  pull_request:
    paths:
      - "web/src/data/inAppWorkbookRoutes.json"
      - "web/src/data/inAppWorkbookRoutes.js"
      - "web/src/data/inAppWorkbookRoutes.a1LessonLinks.test.js"
      - "web/src/data/strictInAppWorkbookRoutes.js"
      - "web/src/data/a1RouteAlignment.js"
      - "web/src/data/a1RouteAlignment.test.js"
      - "web/src/data/a1CourseBookCards.js"
      - "web/src/data/a1RadioResources.js"
      - "web/src/data/curriculumManifest.js"
      - "web/src/data/lessonModel.js"
      - "web/src/data/additionalA2RadioEntries.js"
      - "web/src/utils/courseWorkbookRoutes.js"
      - "web/src/utils/courseBookProgression.js"
      - "web/src/utils/courseBookProgression.test.js"
      - "web/src/utils/a1ChapterSpecificLessonState.js"
      - "web/src/utils/a1ChapterSpecificLessonState.test.js"
      - "web/src/utils/a1WorkbookServiceScope.js"
      - "web/src/utils/a1WorkbookServiceScope.test.js"
      - "web/src/components/A1Day1GreetingsWorkbookPage.js"
      - "web/src/components/A1Day1RadioRegression.test.js"
      - "web/src/components/A1Day21WeatherWorkbookPage.js"
      - "web/src/components/A1Day21WeatherWorkbookPage.test.js"
      - "web/src/components/A1RadioFirstWorkbookRoutes.jsx"
      - "web/src/components/A1RadioFirstWorkbookRoutes.test.jsx"
      - "web/src/components/A1WorkbookVideoHeader.js"
      - "web/src/components/A1WorkbookVideoHeader.test.js"
      - "web/src/components/A1WorkbookSectionTabs.js"
      - "web/src/components/A1WorkbookSectionTabs.test.js"
      - "web/src/components/A1UnifiedTutorWorkbookNavigation.js"
      - "web/src/components/A1UnifiedTutorWorkbookNavigation.test.js"
      - "web/src/components/A2Day1RadioRegression.test.js"
      - "web/src/components/AutoWorkbookStartGuide.test.js"
      - "web/src/components/WorkbookStartGuide.js"
      - "web/src/components/WorkbookStartGuide.test.js"
      - "web/src/components/RequestedLessonAiVideoHeader.jsx"
      - "web/src/components/RequestedLessonAiVideoHeader.test.jsx"
      - "web/src/components/CourseBookLayoutStandardizer.js"
      - "web/src/components/CourseBookLayoutStandardizer.test.js"
      - "web/src/components/RadioFirstWorkbookGate.js"
      - "web/src/components/A2Day*Workbook*.js"
      - "web/src/components/A2LegacyStandardWorkbookNavigation.js"
      - "web/src/components/A2StandardTabbedWorkbookPage.js"
      - "web/src/components/A2SharedWorkbookRegression.test.js"
      - "web/src/components/RouteScopedAppServices.js"
      - "web/src/index.jsx"
      - "scripts/applyA1RouteAlignment.js"
      - "package.json"

jobs:
  test-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Test workbook routes and supporting materials
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/AutoWorkbookStartGuide.test.js src/components/WorkbookStartGuide.test.js
      - name: Test pinned Day 0 Course Book behavior
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/utils/courseBookProgression.test.js src/components/CourseBookLayoutStandardizer.test.js
      - name: Test A1 lesson resource hubs
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/data/inAppWorkbookRoutes.a1LessonLinks.test.js
      - name: Test A1 Day 20 and Day 21 workbook service scope
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/utils/a1WorkbookServiceScope.test.js src/components/A1Day21WeatherWorkbookPage.test.js
      - name: Test A1 Course Book card routes
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/data/a1RouteAlignment.test.js --testNamePattern="uses only internal registered routes"
      - name: Test resolved A1 routes
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/data/a1RouteAlignment.test.js --testNamePattern="aligns every resolved A1"
      - name: Test fragile A1 assignments
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/data/a1RouteAlignment.test.js --testNamePattern="keeps the previously fragile assignments"
      - name: Test curriculum regeneration guard
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/data/a1RouteAlignment.test.js --testNamePattern="preserves the A1 alignment"
      - name: Test native A1 workbook visibility
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/A1WorkbookSectionTabs.test.js
      - name: Test unified A1 tutor workbook navigation
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/A1UnifiedTutorWorkbookNavigation.test.js
      - name: Test A1 workbook AI video headers
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/A1WorkbookVideoHeader.test.js
      - name: Test requested B1 and B2 AI video headers
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/RequestedLessonAiVideoHeader.test.jsx
      - name: Test split A1 lesson chapter state
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/utils/a1ChapterSpecificLessonState.test.js
      - name: Test A1 Day 1 Falowen Radio
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/A1Day1RadioRegression.test.js
      - name: Test A1 Day 13 and Day 21 Falowen Radio
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/A1RadioFirstWorkbookRoutes.test.jsx
      - name: Test A2 Day 1 Falowen Radio
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/A2Day1RadioRegression.test.js
      - name: Test shared A2 workbook experience
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/A2SharedWorkbookRegression.test.js
      - working-directory: web
        run: npm run build
