name: A1 A2 workbook routes

on:
  pull_request:
    paths:
      - "web/src/data/inAppWorkbookRoutes.json"
      - "web/src/data/inAppWorkbookRoutes.js"
      - "web/src/data/strictInAppWorkbookRoutes.js"
      - "web/src/data/a1RouteAlignment.js"
      - "web/src/data/a1RouteAlignment.test.js"
      - "web/src/data/a1CourseBookCards.js"
      - "web/src/data/curriculumManifest.js"
      - "web/src/data/lessonModel.js"
      - "web/src/utils/courseWorkbookRoutes.js"
      - "web/src/utils/a1ChapterSpecificLessonState.js"
      - "web/src/utils/a1ChapterSpecificLessonState.test.js"
      - "web/src/components/A1WorkbookSectionTabs.js"
      - "web/src/components/A1WorkbookSectionTabs.test.js"
      - "web/src/components/AutoWorkbookStartGuide.test.js"
      - "web/src/components/A2Day*Workbook*.js"
      - "web/src/components/A2StandardTabbedWorkbookPage.js"
      - "web/src/components/A2SharedWorkbookRegression.test.js"
      - "web/src/components/A2LegacyStandardWorkbookNavigation.js"
      - "web/src/components/A2Days21To26StandardNavigation.test.js"
      - "web/src/components/RouteScopedAppServices.js"
      - "scripts/applyA1RouteAlignment.js"
      - "package.json"

jobs:
  test-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Test existing workbook route matcher
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/AutoWorkbookStartGuide.test.js
      - name: Test A1 Course Book card routes
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/data/a1RouteAlignment.test.js --testNamePattern="uses only internal registered routes"
      - name: Test resolved A1 routes
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/data/a1RouteAlignment.test.js --testNamePattern="aligns every resolved A1"
      - name: Test fragile A1 assignments
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/data/a1RouteAlignment.test.js --testNamePattern="keeps the previously fragile assignments"
      - name: Test curriculum regeneration guard
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/data/a1RouteAlignment.test.js --testNamePattern="preserves the A1 alignment"
      - name: Test native A1 workbook visibility
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/A1WorkbookSectionTabs.test.js
      - name: Test split A1 lesson chapter state
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/utils/a1ChapterSpecificLessonState.test.js
      - name: Test shared A2 workbook experience and Days 21-26 content preservation
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/A2SharedWorkbookRegression.test.js src/components/A2Days21To26StandardNavigation.test.js
      - working-directory: web
        run: npm run build
