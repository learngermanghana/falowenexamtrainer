      - "web/src/components/CourseBookLayoutStandardizer.test.js"
      - "web/src/components/RadioFirstWorkbookGate.js"
      - "web/src/components/A2Day*Workbook*.js"
      - "web/src/components/A2LegacyStandardWorkbookNavigation.js"
      - "web/src/components/A2StandardTabbedWorkbookPage.js"
      - "web/src/components/A2SharedWorkbookRegression.test.js"
      - "web/src/components/SubmissionMinimumWordGuard.js"
      - "web/src/components/SubmissionMinimumWordGuard.test.js"
      - "web/src/components/RouteScopedAppServices.js"
      - "web/src/a1WorkbookMobileSubmit.test.js"
      - "web/src/index.jsx"
      - "scripts/applyA1RouteAlignment.js"
      - "package.json"

jobs:
  test-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Test workbook routes and supporting materials
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/AutoWorkbookStartGuide.test.js src/components/WorkbookStartGuide.test.js
      - name: Test pinned Day 0 Course Book behavior
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/utils/courseBookProgression.test.js src/components/CourseBookLayoutStandardizer.test.js
      - name: Test A1 lesson resource hubs
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/data/inAppWorkbookRoutes.a1LessonLinks.test.js
      - name: Test A1 Day 20 and Day 21 workbook service scope
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/utils/a1WorkbookServiceScope.test.js src/components/A1Day21WeatherWorkbookPage.test.js
      - name: Test A1 Course Book card routes
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/data/a1RouteAlignment.test.js --testNamePattern="uses only internal registered routes"
      - name: Test resolved A1 routes
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/data/a1RouteAlignment.test.js --testNamePattern="aligns every resolved A1"
      - name: Test fragile A1 assignments
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/data/a1RouteAlignment.test.js --testNamePattern="keeps the previously fragile assignments"
      - name: Test curriculum regeneration guard
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/data/a1RouteAlignment.test.js --testNamePattern="preserves the A1 alignment"
      - name: Test native A1 workbook visibility
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/utils/a1NativeWorkbookExperience.test.js src/components/A1WorkbookSectionTabs.test.js
      - name: Test canonical A1 shared workbook navigation
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/data/a1AssignmentRegistry.test.js src/components/A1TutorMarkedWorkbookShell.test.js src/components/A1SharedAssignmentWorkbookBridge.test.jsx src/components/A1UnifiedTutorWorkbookNavigation.test.js
      - name: Test permanent A1 chapter lesson routes
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/data/a1CanonicalLessonRoutes.test.js src/components/A1CanonicalChapterLessonRoute.test.jsx src/utils/a1ChapterSpecificLessonState.test.js src/components/A1ChapterSpecificLessonRouteBoundary.test.js
      - name: Test A1 letter-writing shared navigation
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/A1Day20LetterWritingWorkbookPage.test.js
      - name: Test A1 letter marker panel
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/A1CourseBookLetterPracticePanel.test.js
      - name: Test task-scoped writing progress IDs
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/services/writingProgressService.test.js
      - name: Test A1 letter marker prompt contract
        working-directory: functions/functionz
        run: node prompts.courseTask.test.js
      - name: Test A1 letter-writing direct route
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/A1Day20Chapter123DirectWorkbookRoute.test.js
      - name: Test A1 letter practice ownership
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/A1CoursePracticeAutoMount.test.js
      - name: Test submission word-count feedback and A1 mobile safeguards
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/SubmissionMinimumWordGuard.test.js src/a1WorkbookMobileSubmit.test.js
      - name: Test A1 workbook AI video headers
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/A1WorkbookVideoHeader.test.js
      - name: Test requested B1 and B2 AI video headers
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/RequestedLessonAiVideoHeader.test.jsx
      - name: Test requested lesson media mappings
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/data/requestedLessonMediaMappings.test.js src/data/writingVideoResources.test.js src/components/B1WorkbookWritingCheatSheetInjector.test.js
      - name: Test A1 Day 1 Falowen Radio
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/A1Day1RadioRegression.test.js
      - name: Test A1 Day 13, Day 21 and Day 22 Falowen Radio
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/A1RadioFirstWorkbookRoutes.test.jsx
      - name: Test A2 Day 1 Falowen Radio
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/A2Day1RadioRegression.test.js
      - name: Test shared A2 workbook experience
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/A2SharedWorkbookRegression.test.js
      - working-directory: web
        run: npm run build
