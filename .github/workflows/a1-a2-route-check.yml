      - "web/src/components/A1ChapterSpecificLessonRouteBoundary.test.js"
      - "web/src/components/A1CourseBookLetterPracticePanel.js"
      - "web/src/components/A1CourseBookLetterPracticePanel.test.js"
      - "web/src/components/A1CoursePracticeAutoMount.js"
      - "web/src/components/A1CoursePracticeAutoMount.test.js"
