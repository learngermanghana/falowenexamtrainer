name: Trigger B1 PDF after browser-scope fix 3364

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/trigger-b1-pdf-after-scope-fix-3364.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch-b1-render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request production B1 PDF render once
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const response = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "course-material-bundle.yml",
              ref: "main",
              inputs: {
                level: "B1",
                build_pdf: "true",
                press_preview: "false"
              }
            });
            core.info("B1 PDF workflow dispatched on main; status=" + response.status);
