name: B2 Day 11 Falowen Radio

on:
  pull_request:
    paths:
      - "scripts/patchRequestedCourseMedia.mjs"
      - "web/src/data/b2C1LessonMediaOverrides.js"
      - "web/src/data/b2LessonContentAlignment.js"
      - "web/src/data/lessonModel.js"
      - "web/src/data/courseSchedule.js"
      - "web/src/components/SelfLearningLessonRegistry.js"
      - "web/src/components/B2Day7To16GuidedLessonPage.js"
      - "web/src/data/b2Day11FalowenRadio.test.js"
      - ".github/workflows/b2-day11-falowen-radio.yml"

jobs:
  radio-resource:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Test B2 Day 11 Falowen Radio ownership
        working-directory: web
        env:
          CI: true
        run: npx jest --runInBand --runTestsByPath src/data/b2Day11FalowenRadio.test.js
      - name: Build production web app with media guards
        working-directory: web
        run: npm run build
