name: Diagnose PR 2164

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/diagnose-pr2164.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm install --legacy-peer-deps --no-audit --no-fund --loglevel=error
      - name: Capture curriculum test output
        shell: bash
        run: |
          set +e
          cd web
          CI=true npm run test:ci -- --runTestsByPath src/data/a1CourseBookCards.test.js src/data/a1RouteAlignment.test.js src/utils/courseBookEntries.test.js > ../pr2164-tests.log 2>&1
          status=$?
          cd ..
          tail -n 240 pr2164-tests.log
          exit $status
      - name: Upload curriculum test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2164-tests-log
          path: pr2164-tests.log
      - name: Capture build output
        if: always()
        shell: bash
        run: |
          set +e
          cd web
          npm run build > ../pr2164-build.log 2>&1
          status=$?
          cd ..
          tail -n 160 pr2164-build.log
          exit $status
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2164-build-log
          path: pr2164-build.log
