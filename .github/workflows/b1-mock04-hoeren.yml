name: B1 Mock 04 Lesen Hören Schreiben verification
on:
  pull_request:
    paths:
      - 'functions/functionz/b1Mock4*'
      - 'functions/functionz/tests/b1Mock4Lesen.test.cjs'
      - 'web/src/data/b1Mock4ReadingContent.js'
      - 'web/src/data/b1Mock4ReadingContent.test.js'
      - 'web/src/data/b1Mock4WritingTasks.js'
      - 'web/src/data/b1Mock4WritingTasks.test.js'
      - 'web/src/components/B1Mock4Schreiben.jsx'
      - 'web/src/services/b1FinalMockService.js'
      - 'web/src/components/B1Mock4Lesen.jsx'
      - 'web/src/services/b1Mock4LesenService.js'
      - 'functions/functionz/tests/b1Mock4Hoeren.test.cjs'
      - 'functions/functionz/app.js'
      - 'web/src/components/B1Mock4Hoeren.jsx'
      - 'web/src/services/b1Mock4HoerenService.js'
      - 'web/src/data/mockExamCatalog.js'
      - 'web/src/App.js'
      - '.github/workflows/b1-mock04-hoeren.yml'
  push:
    branches: [main]
    paths:
      - 'functions/functionz/b1Mock4*'
      - 'functions/functionz/tests/b1Mock4Hoeren.test.cjs'
      - 'functions/functionz/tests/b1Mock4Lesen.test.cjs'
      - '.github/workflows/b1-mock04-hoeren.yml'
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and server-only grading
        run: |
          node --check functions/functionz/app.js
          node --check functions/functionz/b1Mock4Hoeren.js
          node --check functions/functionz/b1Mock4Lesen.js
          node --check functions/functionz/b1Mock4PublishedAudio.js
          node --test functions/functionz/tests/b1Mock4Hoeren.test.cjs functions/functionz/tests/b1Mock4Lesen.test.cjs
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: web
      - name: Mock 04 Lesen source and no-answer-leak checks
        working-directory: web
        env:
          CI: true
        run: npx jest --runInBand --runTestsByPath src/data/b1Mock4ReadingContent.test.js src/data/b1Mock4WritingTasks.test.js
      - name: Production web build (no deployment)
        working-directory: web
        run: npx vite build
