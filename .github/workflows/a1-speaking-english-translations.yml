name: A1 speaking English translations

on:
  pull_request:
    paths:
      - "web/src/components/SpeakingExamIntroPage.js"
      - "web/src/components/SpeakingExamIntroPage.translations.test.jsx"
      - ".github/workflows/a1-speaking-english-translations.yml"
  push:
    branches: [main]
    paths:
      - "web/src/components/SpeakingExamIntroPage.js"
      - "web/src/components/SpeakingExamIntroPage.translations.test.jsx"
      - ".github/workflows/a1-speaking-english-translations.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install website dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: A1 speaking translation and route regressions
        working-directory: web
        run: npx jest --runInBand --runTestsByPath src/components/SpeakingExamIntroPage.translations.test.jsx src/components/A1SpeakingExamIntroEntryRoute.test.jsx
      - name: Build student website
        working-directory: web
        run: npx vite build
