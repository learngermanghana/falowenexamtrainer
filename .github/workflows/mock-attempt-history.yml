name: Compact mock attempt history
on:
  pull_request:
    paths:
      - 'functions/functionz/mockAttemptHistory.js'
      - 'functions/functionz/tests/mockAttemptHistory.test.cjs'
      - 'functions/functionz/app.js'
      - 'web/src/components/MockAttemptHistory*'
      - 'web/src/components/mockHistoryAnswerLabels.js'
      - 'web/src/components/MockExamLibraryPage.js'
      - '.github/workflows/mock-attempt-history.yml'
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check functions/functionz/app.js
          node --test functions/functionz/tests/mockAttemptHistory.test.cjs
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npx jest --runInBand --runTestsByPath src/components/MockAttemptHistory.test.jsx
        env:
          CI: true
      - run: npx vite build
