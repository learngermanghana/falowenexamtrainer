name: Assessment task synchronization
on:
  pull_request:
    paths:
      - 'web/src/**'
      - 'functions/data/assessmentTasks.json'
      - 'scripts/generateAssessmentTaskRegistry.mjs'
      - '.github/workflows/assessment-task-sync.yml'
  push:
    branches: [main]
    paths:
      - 'web/src/**'
      - 'functions/data/assessmentTasks.json'
      - 'scripts/generateAssessmentTaskRegistry.mjs'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/generateAssessmentTaskRegistry.mjs --check
