name: German-only public courses
on:
  pull_request:
    paths:
      - 'web/src/components/LandingPage*'
      - 'web/src/components/PublicAuthRouteBridge.js'
      - 'web/src/context/AuthContext.js'
      - 'web/scripts/*course*'
      - 'scripts/tests/germanOnlyCatalogue.test.mjs'
      - '.github/workflows/german-only-public.yml'
jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/tests/germanOnlyCatalogue.test.mjs
