name: Graded course speaking progression

on:
  pull_request:
    paths:
      - "web/src/components/LiveSpeakPage.jsx"
      - "web/src/components/LiveSpeakTurnManagement.test.jsx"
      - "web/src/components/CourseSpeakingMockAssignment.jsx"
      - "web/src/components/CourseSpeakingRecovery.test.jsx"
      - "web/src/services/courseSpeakingMockService.js"
      - "functions/functionz/liveSpeak.js"
      - "functions/functionz/courseSpeakingMock.js"
      - ".github/workflows/graded-course-speaking-progress.yml"
  push:
    branches: [main]
    paths:
      - "web/src/components/LiveSpeakPage.jsx"
      - "web/src/components/LiveSpeakTurnManagement.test.jsx"
      - "web/src/components/CourseSpeakingMockAssignment.jsx"
      - "web/src/components/CourseSpeakingRecovery.test.jsx"
      - "web/src/services/courseSpeakingMockService.js"
      - "functions/functionz/liveSpeak.js"
      - "functions/functionz/courseSpeakingMock.js"
      - ".github/workflows/graded-course-speaking-progress.yml"

jobs:
  exam-speaking-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Verify audio unlock, graded Teil recovery, and exam continuity
        working-directory: web
        env:
          CI: "true"
        run: npx jest --runInBand --runTestsByPath src/components/LiveSpeakTurnManagement.test.jsx src/components/CourseSpeakingRecovery.test.jsx src/components/LiveSpeakRecovery.test.jsx
      - name: Build Falowen
        working-directory: web
        run: npx vite build
