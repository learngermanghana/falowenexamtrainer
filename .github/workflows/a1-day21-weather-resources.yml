name: A1 Day 21 weather resources

on:
  pull_request:
    paths:
      - "web/src/components/A1Day21WeatherResources.jsx"
      - "web/src/components/A1Day21WeatherResources.test.jsx"
      - "web/src/components/A1TutorMarkedWorkbookShell.js"
      - "web/src/components/A1WorkbookGrammarNotes.js"
      - "web/src/components/A1GrammarVideoCard.jsx"
      - "web/src/components/A1WorkbookVideoHeader.js"
      - "web/src/data/a1LessonVideoResourceOverrides.js"
      - "web/src/data/a1TeacherVideoResources.js"
      - ".github/workflows/a1-day21-weather-resources.yml"

jobs:
  day21-weather-resources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Test teacher and AI weather resources
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/components/A1Day21WeatherResources.test.jsx src/data/a1LessonVideoResourceOverrides.test.js
      - name: Build production web app
        working-directory: web
        run: npm run build
