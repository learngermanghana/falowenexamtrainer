      - "functions/data/assessmentTasks.json"
      - "web/src/data/assessmentTaskVersions.json"
      - "functions/functionz/app.js"
      - "functions/functionz/a2MockCompletionSync.js"
      - "functions/functionz/a2WritingAssessment.js"
      - "functions/functionz/assessmentTaskContext.js"
      - "functions/functionz/a2MockSpeakingAttemptIdentity.js"
      - "functions/functionz/tests/a2MockSpeakingAttemptIdentity.test.cjs"
      - "functions/functionz/tests/a2Mock2AssessmentContracts.test.cjs"
      - "functions/functionz/__tests__/a2Mock2Registration.test.js"
      - "web/src/services/a2Mock2Backup.js"
      - "web/src/services/a2Mock2Backup.test.js"
      - "functions/functionz/a2Mock2SectionBackup.js"
      - "functions/functionz/__tests__/mockSectionBackups.test.js"
      - "web/src/components/B1FinalMockExamPage.jsx"
      - "web/src/components/B2FinalMockExamPage.jsx"
      - "web/src/components/ListeningPracticeSamplePage.jsx"
      - "web/src/utils/mockChoicePresentation*"
      - "web/src/data/consistentWritingPatterns*"
      - "web/src/data/writingCheatSheets.js"
      - "web/src/components/ConsistentWritingPatternGuide.jsx"
      - "web/src/components/B1WritingWorkspace.js"
      - "web/src/components/WritingPage.js"
      - "web/src/components/A1Day20GoetheWritingGrammarPage.jsx"
      - "web/src/data/a2Mock2*"
      - ".github/workflows/mock-writing-choice-regressions.yml"
  push:
    branches: [main]
    paths:
      - "web/src/components/A1FinalMockExamPage.jsx"
      - "web/src/components/A2FinalMockExamPage.jsx"
      - "web/src/components/A2Mock2Lesen.jsx"
      - "web/src/components/A2Mock2Hoeren.jsx"
      - "web/src/components/A2Mock2Schreiben.jsx"
      - "web/src/components/A2Mock2ExamHub.jsx"
      - "web/src/components/A2Mock2Sprechen.jsx"
      - "web/src/components/A2Mock2SubmissionRecovery.test.jsx"
      - "web/src/components/A2Mock2UnifiedFlow.test.js"
      - "web/src/utils/mockReviewAccess.js"
      - "web/src/services/mockAssessmentRequest.js"
      - "web/src/services/coachService.js"
      - "web/src/services/coachServiceAudioPersistence.test.js"
      - "web/src/components/A2Mock2AiAssessmentContract.test.js"
      - "scripts/generateAssessmentTaskRegistry.mjs"
      - "functions/data/assessmentTasks.json"
      - "web/src/data/assessmentTaskVersions.json"
      - "functions/functionz/app.js"
      - "functions/functionz/a2MockCompletionSync.js"
      - "functions/functionz/a2WritingAssessment.js"
      - "functions/functionz/assessmentTaskContext.js"
      - "functions/functionz/a2MockSpeakingAttemptIdentity.js"
      - "functions/functionz/tests/a2MockSpeakingAttemptIdentity.test.cjs"
      - "functions/functionz/tests/a2Mock2AssessmentContracts.test.cjs"
      - "functions/functionz/__tests__/a2Mock2Registration.test.js"
      - "web/src/services/a2Mock2Backup.js"
      - "web/src/services/a2Mock2Backup.test.js"
      - "functions/functionz/a2Mock2SectionBackup.js"
      - "functions/functionz/__tests__/mockSectionBackups.test.js"
      - "web/src/components/B1FinalMockExamPage.jsx"
      - "web/src/components/B2FinalMockExamPage.jsx"
      - "web/src/components/ListeningPracticeSamplePage.jsx"
      - "web/src/utils/mockChoicePresentation*"
      - "web/src/data/consistentWritingPatterns*"
      - "web/src/data/writingCheatSheets.js"
      - "web/src/components/ConsistentWritingPatternGuide.jsx"
      - "web/src/components/B1WritingWorkspace.js"
      - "web/src/components/WritingPage.js"
      - "web/src/components/A1Day20GoetheWritingGrammarPage.jsx"
      - "web/src/data/a2Mock2*"
      - ".github/workflows/mock-writing-choice-regressions.yml"
jobs:
  exam-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install student web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Verify scoring-preserving choices and clean writing textareas
        working-directory: web
        run: npx jest --runInBand --runTestsByPath src/utils/mockChoicePresentation.test.js src/data/a2Mock2Lesen.test.js src/data/a2Mock2Hoeren.test.js src/components/A2Mock2Integration.test.js src/data/consistentWritingPatterns.test.jsx src/components/B1WritingWorkspace.test.jsx src/components/A1Day20GoetheWritingGrammarPage.test.jsx
      - name: Verify Mock 2 saved submission recovery and retryable AI grading
        working-directory: web
        run: npx jest --runInBand --runTestsByPath src/components/A2Mock2SubmissionRecovery.test.jsx src/components/A2MockAnswerVisibility.test.jsx src/components/A2Mock2UnifiedFlow.test.js src/services/a2Mock2Backup.test.js
      - name: Verify Mock 2 ephemeral audio and transcript-only AI processing
        working-directory: web
        run: npx jest --runInBand --runTestsByPath src/services/coachServiceAudioPersistence.test.js src/components/A2Mock2AiAssessmentContract.test.js
      - name: Verify Mock 2 task registration and score isolation
        run: node --test functions/functionz/tests/a2Mock2AssessmentContracts.test.cjs functions/functionz/tests/a2MockSpeakingAttemptIdentity.test.cjs functions/functionz/__tests__/mockSectionBackups.test.js
      - name: Verify exact Mock 2 backend task registry and versions
        run: node scripts/generateAssessmentTaskRegistry.mjs --check
      - name: Build Exam Room web app
        working-directory: web
        run: npx vite build
