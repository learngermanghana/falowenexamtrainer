name: Mock writing fields and answer choices
on:
  pull_request:
    paths:
      - "web/src/components/A1FinalMockExamPage.jsx"
      - "web/src/components/A1MockReviewVisibleLetters.test.jsx"
      - "web/src/components/A2FinalMockExamPage.jsx"
      - "web/src/components/A2Mock2Lesen.jsx"
      - "web/src/components/A2Mock2Hoeren.jsx"
      - "web/src/components/A2Mock2Schreiben.jsx"
      - "web/src/components/B1FinalMockExamPage.jsx"
      - "web/src/components/B2FinalMockExamPage.jsx"
      - "web/src/components/ListeningPracticeSamplePage.jsx"
      - "web/src/utils/mockChoicePresentation*"
      - "web/src/data/a2Mock2*"
      - ".github/workflows/mock-writing-choice-regressions.yml"
  push:
    branches: [main]
    paths:
      - "web/src/components/A1FinalMockExamPage.jsx"
      - "web/src/components/A1MockReviewVisibleLetters.test.jsx"
      - "web/src/components/A2FinalMockExamPage.jsx"
      - "web/src/components/A2Mock2Lesen.jsx"
      - "web/src/components/A2Mock2Hoeren.jsx"
      - "web/src/components/A2Mock2Schreiben.jsx"
      - "web/src/components/B1FinalMockExamPage.jsx"
      - "web/src/components/B2FinalMockExamPage.jsx"
      - "web/src/components/ListeningPracticeSamplePage.jsx"
      - "web/src/utils/mockChoicePresentation*"
      - "web/src/data/a2Mock2*"
      - ".github/workflows/mock-writing-choice-regressions.yml"
jobs:
  exam-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install student web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Verify scoring-preserving choices and clean writing textareas
        working-directory: web
        run: npx jest --runInBand --runTestsByPath src/utils/mockChoicePresentation.test.js src/data/a2Mock2Lesen.test.js src/data/a2Mock2Hoeren.test.js src/components/A2Mock2Integration.test.js src/components/A1MockReviewVisibleLetters.test.jsx
      - name: Build Exam Room web app
        working-directory: web
        run: npx vite build
