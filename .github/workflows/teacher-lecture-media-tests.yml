name: Teacher lecture media tests

on:
  pull_request:
    paths:
      - "web/src/data/teacherLectureVideoResources.js"
      - "web/src/data/lessonVideoDictionary.js"
      - "web/src/data/lessonModel.js"
      - "web/src/data/*TeacherLecture*.test.js"
      - "web/src/data/teacherLectureMediaRegression.test.js"
      - ".github/workflows/teacher-lecture-media-tests.yml"

permissions:
  contents: read

jobs:
  teacher-media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm install --legacy-peer-deps --no-audit --no-fund --loglevel=error

      - name: Run teacher lecture media regressions
        working-directory: web
        env:
          CI: true
        run: npm run test:ci -- --runTestsByPath src/data/teacherLectureMediaRegression.test.js src/data/lessonModelTeacherLectureResources.test.js
