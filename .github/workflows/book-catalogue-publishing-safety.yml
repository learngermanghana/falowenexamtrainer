name: Book catalogue publishing safety
on:
  push:
    branches:
      - release/falowen-a1-a2-exam-guide-listings-20261025
    paths:
      - functions/functionz/bookCommerce.js
      - functions/__tests__/bookCommerce.test.js
      - .github/workflows/book-catalogue-publishing-safety.yml
  pull_request:
    paths:
      - functions/functionz/bookCommerce.js
      - functions/__tests__/bookCommerce.test.js
      - .github/workflows/book-catalogue-publishing-safety.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check functions/functionz/bookCommerce.js
      - run: node --test functions/__tests__/bookCommerce.test.js
